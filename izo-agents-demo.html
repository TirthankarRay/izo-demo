                          </div>
                        ):null;
                      })}
                    </div>
                  </div>
                </div>
              </div>

              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:16,marginBottom:16}}>
                {/* Phases */}
                <div style={{background:C.card,borderRadius:14,border:`1px solid ${C.border}`,overflow:"hidden"}}>
                  <div style={{padding:"12px 18px",borderBottom:`1px solid ${C.border}`,background:"#F8FAFC",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                    <span style={{fontWeight:700,fontSize:13,color:C.heading}}>🔄 Agentic Phases</span>
                    <button onClick={()=>aiEditStep(3)} style={{fontSize:10,color:C.primary,fontWeight:600,background:"none",border:"none",cursor:"pointer",padding:"4px 8px",borderRadius:4}}>Edit ✎</button>
                  </div>
                  <div style={{padding:12}}>
                    {aiParsedConfig.phases.map((ph,i)=>(
                      <div key={i} style={{display:"flex",alignItems:"center",gap:8,padding:"8px 10px",borderRadius:6,borderLeft:`3px solid ${PHASE_COLORS[ph.phase]}`,background:`${PHASE_COLORS[ph.phase]}06`,marginBottom:6}}>
                        <span style={{fontSize:12}}>{PHASE_ICONS[ph.phase]}</span>
                        <div style={{flex:1}}>
                          <div style={{fontSize:11,fontWeight:700,color:PHASE_COLORS[ph.phase]}}>{ph.phase}: {ph.title}</div>
                          <div style={{fontSize:9,color:C.muted}}>{ph.actions.join(" → ")}</div>
                        </div>
                        <span style={{fontSize:9,color:C.muted}}>{(ph.toolBindings||[]).length} tools</span>
                      </div>
                    ))}
                  </div>
                </div>

                {/* HITL Config */}
                <div style={{background:C.card,borderRadius:14,border:`1px solid ${C.border}`,overflow:"hidden"}}>
                  <div style={{padding:"12px 18px",borderBottom:`1px solid ${C.border}`,background:"#F8FAFC",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                    <span style={{fontWeight:700,fontSize:13,color:C.heading}}>👤 HITL Configuration</span>
                    <button onClick={()=>aiEditStep(4)} style={{fontSize:10,color:C.primary,fontWeight:600,background:"none",border:"none",cursor:"pointer",padding:"4px 8px",borderRadius:4}}>Edit ✎</button>
                  </div>
                  <div style={{padding:12}}>
                    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,fontSize:11,marginBottom:10}}>
                      <div style={{padding:"8px 10px",borderRadius:6,background:"#FFF7ED",border:"1px solid #FB923C22"}}>
                        <div style={{fontSize:9,color:C.muted}}>Gate Phase</div>
                        <div style={{fontWeight:700,color:"#EA580C"}}>{PHASE_ICONS[aiParsedConfig.hitlGate]} {aiParsedConfig.hitlGate}</div>
                      </div>
                      <div style={{padding:"8px 10px",borderRadius:6,background:"#F8FAFC",border:`1px solid ${C.border}`}}>
                        <div style={{fontSize:9,color:C.muted}}>Threshold</div>
                        <div style={{fontWeight:700,color:C.heading}}>{aiParsedConfig.hitlThreshold}</div>
                      </div>
                      <div style={{padding:"8px 10px",borderRadius:6,background:"#F8FAFC",border:`1px solid ${C.border}`}}>
                        <div style={{fontSize:9,color:C.muted}}>Notify</div>
                        <div style={{fontWeight:700,color:C.heading}}>{aiParsedConfig.hitlNotifyChannel}</div>
                      </div>
                      <div style={{padding:"8px 10px",borderRadius:6,background:"#F8FAFC",border:`1px solid ${C.border}`}}>
                        <div style={{fontSize:9,color:C.muted}}>Timeout</div>
                        <div style={{fontWeight:700,color:C.heading}}>{aiParsedConfig.hitlTimeoutMins}m</div>
                      </div>
                    </div>
                    <div style={{fontSize:10,fontWeight:600,color:C.heading,marginBottom:4}}>Active Rules ({aiParsedConfig.hitlRules.filter(r=>r.enabled).length})</div>
                    <div style={{display:"flex",flexWrap:"wrap",gap:4}}>
                      {aiParsedConfig.hitlRules.filter(r=>r.enabled).map(r=>(
                        <span key={r.id} style={{padding:"3px 8px",borderRadius:4,background:"#FFF7ED",border:"1px solid #FB923C22",fontSize:9,fontWeight:600,color:"#EA580C"}}>{r.name}</span>
                      ))}
                    </div>
                  </div>
                </div>
              </div>

              {/* AI Source Prompt Reference */}
              <div style={{background:C.card,borderRadius:10,border:`1px solid ${C.border}`,padding:14,marginBottom:16}}>
                <div style={{fontSize:10,fontWeight:600,color:C.muted,marginBottom:4}}>SOURCE PROMPT</div>
                <div style={{fontSize:11,color:C.text,lineHeight:1.5,fontStyle:"italic"}}>{aiPrompt}</div>
              </div>

              {/* Actions */}
              <div style={{display:"flex",justifyContent:"center",gap:12}}>
                <button onClick={applyAiConfig} style={{padding:"12px 36px",borderRadius:8,background:`linear-gradient(135deg,${C.success},#059669)`,color:"#fff",fontWeight:700,fontSize:14,boxShadow:"0 4px 14px rgba(16,185,129,.25)"}}>✅ Accept & Run Test</button>
                <button onClick={()=>{setForm(aiParsedConfig);setMode("wizard");setStep(0)}} style={{padding:"12px 24px",borderRadius:8,background:"#EDF2F7",color:C.heading,fontWeight:600,fontSize:13}}>🔧 Open in Wizard</button>
                <button onClick={()=>{setAiState("idle")}} style={{padding:"12px 24px",borderRadius:8,background:"#FFF7ED",color:"#EA580C",fontWeight:600,fontSize:13,border:"1px solid #FB923C33"}}>✏️ Refine Prompt</button>
              </div>
            </div>
          )}
        </div>
      )}

      {/* ═══ WIZARD MODE ═══ */}
      {mode==="wizard"&&(
      <div>
      <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:24}}>
        <button onClick={()=>{setMode(null)}} style={{padding:"6px 14px",borderRadius:6,background:"#EDF2F7",color:C.muted,fontWeight:600,fontSize:12}}>← Back</button>
        <div>
          <h2 style={{fontSize:20,fontWeight:700,color:C.heading,margin:0}}>Create New Agent</h2>
          <p style={{fontSize:12,color:C.muted,marginTop:2}}>Step-by-step configuration wizard</p>
        </div>
      </div>

      {/* Progress Steps */}
      <div style={{display:"flex",alignItems:"center",gap:0,marginBottom:28,background:C.card,borderRadius:12,border:`1px solid ${C.border}`,padding:"14px 20px"}}>
        {STEPS.map((s,i)=>(
          <Fragment key={s}>
            <div onClick={()=>{if(i<=Math.max(step,0))setStep(i)}} style={{display:"flex",alignItems:"center",gap:8,cursor:i<=step?"pointer":"default",opacity:i<=step?1:.4}}>
              <div style={{width:28,height:28,borderRadius:"50%",background:i<step?C.success:i===step?C.primary:"#EDF2F7",color:i<=step?"#fff":C.muted,display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,fontWeight:700,transition:"all .3s"}}>
                {i<step?"✓":(i+1)}
              </div>
              <span style={{fontSize:12,fontWeight:i===step?700:500,color:i===step?C.heading:C.muted}}>{s}</span>
            </div>
            {i<STEPS.length-1&&<div style={{flex:1,height:2,background:i<step?C.success:C.border,margin:"0 12px",transition:"background .3s"}}/>}
          </Fragment>
        ))}
      </div>

      {/* Step 0: Persona Selection */}
      {step===0&&(
        <div style={{background:C.card,borderRadius:14,border:`1px solid ${C.border}`,padding:24,animation:"fadeUp .3s ease-out"}}>
          <div style={{fontWeight:700,fontSize:16,color:C.heading,marginBottom:4}}>Choose Agent Persona</div>
          <div style={{fontSize:12,color:C.muted,marginBottom:20}}>Select a pre-built persona template or create a custom one</div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:14}}>
            {PERSONA_TEMPLATES.map(p=>(
              <div key={p.id} onClick={()=>selectPersona(p)} style={{padding:20,borderRadius:12,border:`2px solid ${form.personaId===p.id?C.primary:C.border}`,background:form.personaId===p.id?C.primaryBg:C.card,cursor:"pointer",transition:"all .2s"}}>
                <div style={{fontSize:28,marginBottom:8}}>{p.icon}</div>
                <div style={{fontWeight:700,fontSize:13,color:C.heading,marginBottom:4}}>{p.name}</div>
                <div style={{fontSize:11,color:C.muted,lineHeight:1.5}}>{p.desc}</div>
              </div>
            ))}
          </div>
          <div style={{display:"flex",justifyContent:"flex-end",marginTop:20}}>
            <button onClick={()=>setStep(1)} disabled={!form.personaId} style={{padding:"10px 28px",borderRadius:8,background:form.personaId?`linear-gradient(135deg,${C.primary},${C.primaryDark})`:"#D9E2EC",color:"#fff",fontWeight:600,fontSize:13}}>Next: Metadata →</button>
          </div>
        </div>
      )}

      {/* Step 1: Metadata */}
      {step===1&&(
        <div style={{background:C.card,borderRadius:14,border:`1px solid ${C.border}`,padding:24,animation:"fadeUp .3s ease-out"}}>
          <div style={{fontWeight:700,fontSize:16,color:C.heading,marginBottom:4}}>Agent Metadata</div>
          <div style={{fontSize:12,color:C.muted,marginBottom:20}}>Define the agent's identity, description, and operational parameters</div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:20}}>
            <div>
              <Input label="Agent Name" value={form.name} onChange={v=>u("name",v)} placeholder="e.g., Data Quality Agent"/>
              <Input label="Persona Title" value={form.persona} onChange={v=>u("persona",v)} placeholder="e.g., Data Quality Engineer"/>
              <Input label="Description" value={form.desc} onChange={v=>u("desc",v)} placeholder="Describe what this agent does..." area/>
            </div>
            <div>
              <div style={{marginBottom:14}}>
                <label style={{display:"block",fontSize:11,fontWeight:600,color:C.heading,marginBottom:5,textTransform:"uppercase",letterSpacing:.5}}>Agent Icon</label>
                <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
                  {["🔍","🛡️","🔗","📊","👁️","⚡","🧠","🔧","💊","🌊","🔐","📋"].map(ic=>(
                    <div key={ic} onClick={()=>u("icon",ic)} style={{width:40,height:40,borderRadius:10,border:`2px solid ${form.icon===ic?C.primary:C.border}`,background:form.icon===ic?C.primaryBg:"#FAFBFC",display:"flex",alignItems:"center",justifyContent:"center",fontSize:20,cursor:"pointer"}}>{ic}</div>
                  ))}
                </div>
              </div>
              <div style={{marginBottom:14}}>
                <label style={{display:"block",fontSize:11,fontWeight:600,color:C.heading,marginBottom:5,textTransform:"uppercase",letterSpacing:.5}}>Brand Color</label>
                <div style={{display:"flex",gap:8}}>
                  {["#1E82BD","#0A5081","#3A9BD5","#28426D","#5BA4CF","#10B981","#8B5CF6","#F59E0B","#EF4444","#EA580C"].map(c=>(
                    <div key={c} onClick={()=>u("color",c)} style={{width:32,height:32,borderRadius:8,background:c,border:`2px solid ${form.color===c?"#fff":c}`,cursor:"pointer",boxShadow:form.color===c?`0 0 0 2px ${c}`:""}}/>
                  ))}
                </div>
              </div>
              <Input label="Scan Schedule" value={form.schedule} onChange={v=>u("schedule",v)} placeholder="e.g., 5m, 1h, daily" mono/>
            </div>
          </div>
          <div style={{display:"flex",justifyContent:"space-between",marginTop:20}}>
            <button onClick={()=>setStep(0)} style={{padding:"10px 24px",borderRadius:8,background:"#EDF2F7",color:C.muted,fontWeight:600,fontSize:13}}>← Back</button>
            <button onClick={()=>setStep(2)} disabled={!form.name} style={{padding:"10px 28px",borderRadius:8,background:form.name?`linear-gradient(135deg,${C.primary},${C.primaryDark})`:"#D9E2EC",color:"#fff",fontWeight:600,fontSize:13}}>Next: Tools →</button>
          </div>
        </div>
      )}

      {/* Step 2: Tool Selection & Configuration */}
      {step===2&&(
        <div style={{animation:"fadeUp .3s ease-out"}}>
          <div style={{background:C.card,borderRadius:14,border:`1px solid ${C.border}`,padding:24,marginBottom:16}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
              <div style={{fontWeight:700,fontSize:16,color:C.heading}}>Connect Tools</div>
              <div style={{fontSize:12,color:C.primary,fontWeight:600}}>{form.tools.length} of {TOOL_OPTIONS.length} selected</div>
            </div>
            <div style={{fontSize:12,color:C.muted,marginBottom:6}}>Select which tools this agent can call during its execution loop</div>
            {form.personaId&&form.personaId!=="custom"&&(
              <div style={{padding:"8px 14px",borderRadius:8,background:"#EDF8FF",border:"1px solid #1E82BD22",fontSize:11,color:C.primary,marginBottom:16}}>
                💡 Recommended tools for <strong>{form.persona}</strong> are pre-selected. Add or remove as needed.
              </div>
            )}

            {/* Tool Grid */}
            <div style={{display:"grid",gridTemplateColumns:"repeat(5,1fr)",gap:12,marginBottom:16}}>
              {TOOL_OPTIONS.map(t=>{
                const sel=form.tools.includes(t.id);
                const isRec=t.recommended.includes(form.personaId);
                return (
                  <div key={t.id} onClick={()=>toggleTool(t.id)} style={{padding:14,borderRadius:12,border:`2px solid ${sel?C.primary:C.border}`,background:sel?C.primaryBg:"#FAFBFC",cursor:"pointer",textAlign:"center",transition:"all .2s",position:"relative"}}>
                    {isRec&&<div style={{position:"absolute",top:6,right:6,fontSize:8,background:"#DBEAFE",color:C.primary,padding:"1px 5px",borderRadius:4,fontWeight:700}}>REC</div>}
                    <div style={{fontSize:24,marginBottom:4}}>{t.icon}</div>
                    <div style={{fontWeight:600,fontSize:11,color:sel?C.primary:C.heading}}>{t.name}</div>
                    <div style={{fontSize:9,color:C.muted,marginTop:2}}>{t.cat}</div>
                    {sel&&<div style={{marginTop:6,width:18,height:18,borderRadius:"50%",background:C.primary,color:"#fff",display:"inline-flex",alignItems:"center",justifyContent:"center",fontSize:10}}>✓</div>}
                  </div>
                );
              })}
            </div>
          </div>

          {/* Selected Tool Details & Connection Config */}
          {form.tools.length>0&&(
            <div style={{background:C.card,borderRadius:14,border:`1px solid ${C.border}`,overflow:"hidden",marginBottom:16}}>
              <div style={{padding:"14px 20px",borderBottom:`1px solid ${C.border}`,fontWeight:700,fontSize:13,color:C.heading,background:"#F8FAFC",display:"flex",alignItems:"center",gap:8}}>
                🔗 Tool Connection Configuration
                <span style={{fontSize:11,color:C.muted,fontWeight:400}}>— Verify each tool endpoint before proceeding</span>
              </div>
              <div style={{padding:0}}>
                {form.tools.map(tid=>{
                  const t=TOOL_OPTIONS.find(x=>x.id===tid);
                  if(!t) return null;
                  const conf=form.toolConfigs[tid]||{};
                  const expanded=expandedTool===tid;
                  return (
                    <div key={tid} style={{borderBottom:`1px solid ${C.border}`}}>
                      <div onClick={()=>setExpandedTool(expanded?null:tid)} style={{padding:"12px 20px",display:"flex",alignItems:"center",gap:12,cursor:"pointer",background:expanded?"#F8FAFC":"transparent"}}>
                        <span style={{fontSize:20}}>{t.icon}</span>
                        <div style={{flex:1}}>
                          <div style={{fontWeight:600,fontSize:13,color:C.heading}}>{t.name}</div>
                          <div style={{fontSize:11,color:C.muted}}>{t.desc}</div>
                        </div>
                        <div style={{display:"flex",alignItems:"center",gap:8}}>
                          {conf.verified&&<span style={{fontSize:10,color:C.success,fontWeight:600}}>✅ Connected ({conf.latency})</span>}
                          {conf.verifying&&<span style={{fontSize:10,color:C.primary,fontWeight:600}}>⟳ Verifying...</span>}
                          {!conf.verified&&!conf.verifying&&<span style={{fontSize:10,color:"#F59E0B",fontWeight:600}}>⚠ Not verified</span>}
                          <span style={{fontSize:10,color:C.muted,transform:expanded?"rotate(180deg)":"rotate(0)",transition:"transform .2s"}}>▼</span>
                        </div>
                      </div>
                      {expanded&&(
                        <div style={{padding:"0 20px 16px",background:"#F8FAFC"}}>
                          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:16}}>
                            <div>
                              <div style={{fontSize:10,fontWeight:600,color:C.heading,marginBottom:4,textTransform:"uppercase",letterSpacing:.5}}>Endpoint URL</div>
                              <div style={{padding:"8px 12px",borderRadius:6,background:"#fff",border:`1px solid ${C.border}`,fontSize:11,fontFamily:"'JetBrains Mono',monospace",color:C.text}}>{t.endpoint}</div>
                              <div style={{fontSize:10,fontWeight:600,color:C.heading,marginTop:10,marginBottom:4,textTransform:"uppercase",letterSpacing:.5}}>Auth Method</div>
                              <div style={{display:"flex",gap:6}}>
                                {["api_key","oauth2","mtls"].map(am=>(
                                  <span key={am} style={{padding:"4px 10px",borderRadius:6,background:(conf.authMethod||"api_key")===am?C.primaryBg:"#fff",border:`1px solid ${(conf.authMethod||"api_key")===am?C.primary:C.border}`,fontSize:10,fontWeight:600,color:(conf.authMethod||"api_key")===am?C.primary:C.muted,cursor:"pointer"}}
                                    onClick={e=>{e.stopPropagation();setForm(p=>({...p,toolConfigs:{...p.toolConfigs,[tid]:{...p.toolConfigs[tid],authMethod:am}}}))}}
                                  >{am.toUpperCase()}</span>
                                ))}
                              </div>
                            </div>
                            <div>
                              <div style={{fontSize:10,fontWeight:600,color:C.heading,marginBottom:4,textTransform:"uppercase",letterSpacing:.5}}>Available Methods</div>
                              <div style={{display:"flex",flexWrap:"wrap",gap:4}}>
                                {t.methods.map(m=>(
                                  <span key={m} style={{padding:"3px 8px",borderRadius:4,background:"#EDF2F7",fontSize:9,fontFamily:"'JetBrains Mono',monospace",color:C.heading}}>{m}</span>
                                ))}
                              </div>
                              <button onClick={e=>{e.stopPropagation();verifyTool(tid)}} disabled={conf.verified||conf.verifying} style={{marginTop:10,padding:"8px 18px",borderRadius:6,background:conf.verified?C.success:conf.verifying?"#CBD5E0":`linear-gradient(135deg,${C.primary},${C.primaryDark})`,color:"#fff",fontWeight:600,fontSize:11}}>
                                {conf.verified?"✓ Connection Verified":conf.verifying?"Verifying...":"Verify Connection"}
                              </button>
                            </div>
                          </div>
                          {/* Code Preview */}
                          {TOOL_CODE_SNIPPETS[tid]&&(
                            <div style={{marginTop:12}}>
                              <div onClick={e=>{e.stopPropagation();setShowCode(showCode===tid?null:tid)}} style={{fontSize:10,fontWeight:600,color:C.primary,cursor:"pointer",display:"flex",alignItems:"center",gap:4}}>
                                {"<>"} {showCode===tid?"Hide":"View"} Integration Code
                              </div>
                              {showCode===tid&&(
                                <pre style={{marginTop:8,padding:14,borderRadius:8,background:"#1E293B",color:"#E2E8F0",fontSize:10,fontFamily:"'JetBrains Mono',monospace",lineHeight:1.6,overflowX:"auto",maxHeight:280,overflowY:"auto"}}>{TOOL_CODE_SNIPPETS[tid]}</pre>
                              )}
                            </div>
                          )}
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
            </div>
          )}

          <div style={{display:"flex",justifyContent:"space-between"}}>
            <button onClick={()=>setStep(1)} style={{padding:"10px 24px",borderRadius:8,background:"#EDF2F7",color:C.muted,fontWeight:600,fontSize:13}}>← Back</button>
            <button onClick={()=>setStep(3)} disabled={form.tools.length===0} style={{padding:"10px 28px",borderRadius:8,background:form.tools.length?`linear-gradient(135deg,${C.primary},${C.primaryDark})`:"#D9E2EC",color:"#fff",fontWeight:600,fontSize:13}}>Next: Phases →</button>
          </div>
        </div>
      )}

      {/* Step 3: Phase Configuration */}
      {step===3&&(
        <div style={{animation:"fadeUp .3s ease-out"}}>
          <div style={{background:C.card,borderRadius:14,border:`1px solid ${C.border}`,padding:24,marginBottom:16}}>
            <div style={{fontWeight:700,fontSize:16,color:C.heading,marginBottom:4}}>Configure Agentic Loop</div>
            <div style={{fontSize:12,color:C.muted,marginBottom:16}}>Define actions, bind tools, and preview code for each phase of the PLAN → TOOL USE → REFLECT → ACT loop</div>

            {/* Phase Tabs */}
            <div style={{display:"flex",gap:0,marginBottom:0,borderBottom:`2px solid ${C.border}`}}>
              {form.phases.map((ph,pi)=>{
                const active=activePhaseTab===pi;
                const col=PHASE_COLORS[ph.phase];
                return (
                  <div key={pi} onClick={()=>setActivePhaseTab(pi)} style={{padding:"10px 20px",cursor:"pointer",borderBottom:active?`3px solid ${col}`:"3px solid transparent",marginBottom:-2,display:"flex",alignItems:"center",gap:6,transition:"all .2s"}}>
                    <span style={{fontSize:14}}>{PHASE_ICONS[ph.phase]}</span>
                    <span style={{fontSize:12,fontWeight:active?700:500,color:active?col:C.muted}}>{ph.phase}</span>
                    <span style={{fontSize:9,background:active?`${col}15`:"#EDF2F7",color:active?col:C.muted,padding:"1px 6px",borderRadius:4,fontWeight:600}}>{ph.actions.filter(a=>a).length}</span>
                  </div>
                );
              })}
            </div>
          </div>

          {/* Active Phase Detail */}
          {(()=>{
            const ph=form.phases[activePhaseTab];
            const pi=activePhaseTab;
            const col=PHASE_COLORS[ph.phase];
            return (
              <div style={{display:"grid",gridTemplateColumns:"1fr 340px",gap:16,marginBottom:16}}>
                {/* Left: Actions */}
                <div style={{background:C.card,borderRadius:14,border:`1px solid ${col}33`,borderTop:`3px solid ${col}`,padding:20}}>
                  <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:14}}>
                    <span style={{padding:"4px 12px",borderRadius:6,background:`${col}15`,fontSize:11,fontWeight:700,color:col}}>{PHASE_ICONS[ph.phase]} {ph.phase}</span>
                    <input value={ph.title} onChange={e=>{const phases=[...form.phases];phases[pi]={...phases[pi],title:e.target.value};u("phases",phases)}} placeholder="Phase title..." style={{flex:1,padding:"8px 12px",borderRadius:6,border:`1px solid ${C.border}`,fontSize:13,fontWeight:600,color:C.heading,outline:"none"}}/>
                  </div>

                  <div style={{fontSize:10,fontWeight:600,color:C.heading,marginBottom:8,textTransform:"uppercase",letterSpacing:.5}}>Actions ({ph.actions.length})</div>
                  {ph.actions.map((ac,ai)=>(
                    <div key={ai} style={{display:"flex",gap:8,marginBottom:8,alignItems:"center"}}>
                      <div style={{width:24,height:24,borderRadius:6,background:`${col}12`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:10,fontWeight:700,color:col,flexShrink:0}}>{ai+1}</div>
                      <input value={ac} onChange={e=>updatePhaseAction(pi,ai,e.target.value)} placeholder={`Action ${ai+1}...`} style={{flex:1,padding:"8px 12px",borderRadius:6,border:`1px solid ${C.border}`,fontSize:12,color:C.text,outline:"none",background:"#FAFBFC"}}/>
                      {ph.actions.length>1&&<div onClick={()=>removePhaseAction(pi,ai)} style={{width:22,height:22,borderRadius:6,background:"#FEE2E2",color:C.error,display:"flex",alignItems:"center",justifyContent:"center",fontSize:12,cursor:"pointer",flexShrink:0}}>×</div>}
                    </div>
                  ))}
                  <button onClick={()=>addPhaseAction(pi)} style={{padding:"6px 14px",borderRadius:6,background:"#EDF2F7",color:C.muted,fontSize:11,fontWeight:600,marginTop:4}}>+ Add Action</button>

                  {/* Phase Description */}
                  <div style={{marginTop:16,padding:14,borderRadius:8,background:`${col}06`,border:`1px solid ${col}15`}}>
                    <div style={{fontSize:10,fontWeight:600,color:col,marginBottom:4}}>Phase Behavior</div>
                    <div style={{fontSize:11,color:C.muted,lineHeight:1.6}}>
                      {ph.phase==="PLAN"&&"The agent analyzes context, queries metadata, ranks priorities by impact score, and creates an execution plan for the current cycle."}
                      {ph.phase==="TOOL USE"&&"The agent invokes bound tools in parallel (asyncio.gather), collecting raw results from each API. Failed calls trigger automatic retry with exponential backoff."}
                      {ph.phase==="REFLECT"&&"The agent cross-references tool results, uses Cortex LLM for root cause analysis, calculates blast radius, and classifies severity (LOW/MEDIUM/HIGH/CRITICAL)."}
                      {ph.phase==="ACT"&&"The agent executes remediation actions, triggers pipelines, sends notifications, and checks whether a HITL gate should pause execution for human approval."}
                    </div>
                  </div>
                </div>

                {/* Right: Tool Bindings */}
                <div style={{background:C.card,borderRadius:14,border:`1px solid ${C.border}`,padding:18}}>
                  <div style={{fontWeight:700,fontSize:13,color:C.heading,marginBottom:4}}>Tool Bindings</div>
                  <div style={{fontSize:11,color:C.muted,marginBottom:12}}>Which tools should this phase invoke?</div>
                  {form.tools.map(tid=>{
                    const t=TOOL_OPTIONS.find(x=>x.id===tid);
                    const bound=(ph.toolBindings||[]).includes(tid);
                    return t?(
                      <div key={tid} onClick={()=>bindToolToPhase(pi,tid)} style={{display:"flex",alignItems:"center",gap:10,padding:"8px 12px",borderRadius:8,border:`1px solid ${bound?C.primary+"44":C.border}`,background:bound?C.primaryBg:"#FAFBFC",cursor:"pointer",marginBottom:6,transition:"all .15s"}}>

                        <div style={{flex:1}}>
                          <div style={{fontWeight:600,fontSize:11,color:bound?C.primary:C.heading}}>{t.name}</div>
                          <div style={{fontSize:9,color:C.muted}}>{t.methods.slice(0,2).join(", ")}</div>
                        </div>
                        <div style={{width:18,height:18,borderRadius:4,border:`2px solid ${bound?C.primary:C.border}`,background:bound?C.primary:"transparent",display:"flex",alignItems:"center",justifyContent:"center",color:"#fff",fontSize:10}}>{bound&&"✓"}</div>
                      </div>
                    ):null;
                  })}
                  {form.tools.length===0&&<div style={{fontSize:11,color:C.muted,fontStyle:"italic",padding:12}}>No tools selected. Go back to Step 2 to add tools.</div>}

                  {/* Quick code preview */}
                  {(ph.toolBindings||[]).length>0&&(
                    <div style={{marginTop:12,padding:10,borderRadius:8,background:"#1E293B",maxHeight:200,overflowY:"auto"}}>
                      <div style={{fontSize:9,fontWeight:600,color:"#94A3B8",marginBottom:6}}>GENERATED ORCHESTRATOR CODE</div>
                      <pre style={{fontSize:9,fontFamily:"'JetBrains Mono',monospace",color:"#E2E8F0",lineHeight:1.5,margin:0}}>{`async def ${ph.phase.toLowerCase().replace(" ","_")}(self, ctx):\n    \"\"\"${ph.title||ph.phase} phase\"\"\"\n    results = await asyncio.gather(\n${(ph.toolBindings||[]).map(tid=>{const t=TOOL_OPTIONS.find(x=>x.id===tid);return `        self.${tid}_client.${(t?.methods[0]||"execute()").replace("()","")}\n            (ctx=${tid}_params)`}).join(",\n")}\n    )\n    return self.merge_results(results)`}</pre>
                    </div>
                  )}
                </div>
              </div>
            );
          })()}

          {/* Mini phase flow at bottom */}
          <div style={{background:C.card,borderRadius:10,border:`1px solid ${C.border}`,padding:"12px 20px",display:"flex",alignItems:"center",gap:0,marginBottom:16}}>
            {form.phases.map((p,i)=>(
              <Fragment key={i}>
                <div onClick={()=>setActivePhaseTab(i)} style={{display:"flex",alignItems:"center",gap:6,padding:"6px 14px",borderRadius:8,background:activePhaseTab===i?`${PHASE_COLORS[p.phase]}15`:"transparent",cursor:"pointer",transition:"all .2s"}}>
                  <span style={{fontSize:12}}>{PHASE_ICONS[p.phase]}</span>
                  <span style={{fontSize:11,fontWeight:activePhaseTab===i?700:500,color:activePhaseTab===i?PHASE_COLORS[p.phase]:C.muted}}>{p.phase}</span>
                  <span style={{fontSize:9,color:C.muted}}>({p.actions.filter(a=>a).length} actions, {(p.toolBindings||[]).length} tools)</span>
                </div>
                {i<3&&<span style={{color:C.light,fontSize:12,margin:"0 4px"}}>→</span>}
              </Fragment>
            ))}
          </div>

          <div style={{display:"flex",justifyContent:"space-between"}}>
            <button onClick={()=>setStep(2)} style={{padding:"10px 24px",borderRadius:8,background:"#EDF2F7",color:C.muted,fontWeight:600,fontSize:13}}>← Back</button>
            <button onClick={()=>setStep(4)} style={{padding:"10px 28px",borderRadius:8,background:`linear-gradient(135deg,${C.primary},${C.primaryDark})`,color:"#fff",fontWeight:600,fontSize:13}}>Next: HITL →</button>
          </div>
        </div>
      )}

      {/* Step 4: HITL Configuration */}
      {step===4&&(
        <div style={{animation:"fadeUp .3s ease-out"}}>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:16,marginBottom:16}}>
            {/* Left: Gate & Threshold */}
            <div style={{background:C.card,borderRadius:14,border:`1px solid ${C.border}`,padding:20}}>
              <div style={{fontWeight:700,fontSize:14,color:C.heading,marginBottom:14}}>👤 Approval Gate & Threshold</div>
              <div style={{fontSize:10,fontWeight:600,color:C.heading,marginBottom:8,textTransform:"uppercase",letterSpacing:.5}}>HITL Gate Phase</div>
              <div style={{display:"grid",gap:6,marginBottom:18}}>
                {["PLAN","TOOL USE","REFLECT","ACT"].map(ph=>(
                  <div key={ph} onClick={()=>u("hitlGate",ph)} style={{padding:"10px 14px",borderRadius:8,border:`2px solid ${form.hitlGate===ph?"#EA580C":C.border}`,background:form.hitlGate===ph?"#FFF7ED":"#FAFBFC",cursor:"pointer",display:"flex",alignItems:"center",gap:8}}>
                    <span style={{fontSize:14}}>{PHASE_ICONS[ph]}</span>
                    <span style={{fontWeight:600,fontSize:12,color:form.hitlGate===ph?"#EA580C":C.heading}}>{ph}</span>
                    {form.hitlGate===ph&&<span style={{marginLeft:"auto",fontSize:10,color:"#EA580C",fontWeight:600}}>👤 Gate Active</span>}
                  </div>
                ))}
              </div>
              <div style={{fontSize:10,fontWeight:600,color:C.heading,marginBottom:8,textTransform:"uppercase",letterSpacing:.5}}>Escalation Threshold</div>
              <div style={{display:"grid",gap:6}}>
                {["Low","Medium","High","Critical"].map(th=>(
                  <div key={th} onClick={()=>u("hitlThreshold",th)} style={{padding:"10px 14px",borderRadius:8,border:`2px solid ${form.hitlThreshold===th?C.primary:C.border}`,background:form.hitlThreshold===th?C.primaryBg:"#FAFBFC",cursor:"pointer",display:"flex",alignItems:"center",gap:8}}>
                    <div style={{width:8,height:8,borderRadius:"50%",background:th==="Low"?C.success:th==="Medium"?"#F59E0B":th==="High"?"#EA580C":C.error}}/>
                    <span style={{fontWeight:600,fontSize:12,color:form.hitlThreshold===th?C.primary:C.heading}}>{th}</span>
                    <span style={{fontSize:10,color:C.muted,marginLeft:4}}>{th==="Low"?"Auto-approve most":th==="Medium"?"High-impact needs approval":th==="High"?"Most need approval":"All need approval"}</span>
                  </div>
                ))}
              </div>
            </div>

            {/* Right: Escalation Rules */}
            <div style={{background:C.card,borderRadius:14,border:`1px solid ${C.border}`,padding:20}}>
              <div style={{fontWeight:700,fontSize:14,color:C.heading,marginBottom:4}}>⚡ Escalation Rules</div>

                  <div key={rule.id} onClick={()=>toggleHitlRule(idx)} style={{padding:"10px 14px",borderRadius:8,border:`1px solid ${rule.enabled?"#EA580C33":C.border}`,background:rule.enabled?"#FFF7ED":"#FAFBFC",cursor:"pointer",display:"flex",alignItems:"center",gap:10,transition:"all .15s"}}>

                    <div style={{flex:1}}>
                      <div style={{fontWeight:600,fontSize:11,color:rule.enabled?"#EA580C":C.heading}}>{rule.name}</div>
                      <div style={{fontSize:9,color:C.muted}}>{rule.desc}</div>
                    </div>
                    <div style={{display:"flex",gap:4,flexShrink:0}}>
                      <span style={{fontSize:8,padding:"2px 6px",borderRadius:4,background:rule.severity==="Critical"?"#FEE2E2":rule.severity==="High"?"#FFF7ED":"#FEF3C7",color:rule.severity==="Critical"?C.error:rule.severity==="High"?"#EA580C":"#92400E",fontWeight:700}}>{rule.severity}</span>
                      <span style={{fontSize:8,padding:"2px 6px",borderRadius:4,background:`${PHASE_COLORS[rule.phase]}15`,color:PHASE_COLORS[rule.phase],fontWeight:700}}>{rule.phase}</span>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          </div>

          {/* Notification & Auto-Approve Settings */}
          <div style={{background:C.card,borderRadius:14,border:`1px solid ${C.border}`,padding:20,marginBottom:16}}>

            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr 1fr",gap:16}}>
              <div>
                <div style={{fontSize:10,fontWeight:600,color:C.heading,marginBottom:5,textTransform:"uppercase",letterSpacing:.5}}>Notification Channel</div>

                  <span>💬</span>
                  <input value={form.hitlNotifyChannel} onChange={e=>u("hitlNotifyChannel",e.target.value)} style={{border:"none",outline:"none",background:"transparent",fontSize:12,fontFamily:"'JetBrains Mono',monospace",color:C.text,width:"100%"}}/>
                </div>
              </div>
              <div>
                <div style={{fontSize:10,fontWeight:600,color:C.heading,marginBottom:5,textTransform:"uppercase",letterSpacing:.5}}>Primary Reviewer</div>
                <div style={{padding:"8px 12px",borderRadius:6,border:`1px solid ${C.border}`,fontSize:12,fontFamily:"'JetBrains Mono',monospace",color:C.text,background:"#FAFBFC",display:"flex",alignItems:"center",gap:6}}>
                  <span>👤</span>
                  <input value={form.hitlReviewers[0]||""} onChange={e=>u("hitlReviewers",[e.target.value])} style={{border:"none",outline:"none",background:"transparent",fontSize:12,fontFamily:"'JetBrains Mono',monospace",color:C.text,width:"100%"}}/>
                </div>
              </div>
              <div>
                <div style={{fontSize:10,fontWeight:600,color:C.heading,marginBottom:5,textTransform:"uppercase",letterSpacing:.5}}>Auto-Approve Below</div>

              </div>
              <div>

                    <span key={opt.v} onClick={()=>u("hitlTimeoutMins",opt.v)} style={{padding:"8px 12px",borderRadius:6,border:`1px solid ${form.hitlTimeoutMins===opt.v?C.primary:C.border}`,background:form.hitlTimeoutMins===opt.v?C.primaryBg:"#FAFBFC",fontSize:11,fontWeight:600,color:form.hitlTimeoutMins===opt.v?C.primary:C.muted,cursor:"pointer",flex:1,textAlign:"center"}}>{opt.l}</span>
                  ))}
                </div>
              </div>
            </div>

            {/* HITL Flow Preview */}
            <div style={{marginTop:16,padding:14,borderRadius:10,background:"#FFF7ED",border:"1px solid #FB923C22"}}>

              <div style={{display:"flex",alignItems:"center",gap:6,fontSize:10,color:C.text,flexWrap:"wrap"}}>
                <span style={{padding:"3px 8px",borderRadius:4,background:`${PHASE_COLORS[form.hitlGate]}15`,fontWeight:700,color:PHASE_COLORS[form.hitlGate]}}>{form.hitlGate}</span>
                <span>→</span>
                <span style={{padding:"3px 8px",borderRadius:4,background:"#FEE2E2",color:C.error,fontWeight:600}}>Check {form.hitlRules.filter(r=>r.enabled).length} rules</span>
                <span>→</span>
                <span style={{padding:"3px 8px",borderRadius:4,background:"#DBEAFE",color:C.primary,fontWeight:600}}>Severity ≥ {form.hitlThreshold}?</span>
                <span>→</span>
                <span style={{padding:"3px 8px",borderRadius:4,background:"#FFF7ED",color:"#EA580C",fontWeight:600}}>Route to {form.hitlNotifyChannel}</span>
                <span>→</span>
                <span style={{padding:"3px 8px",borderRadius:4,background:"#ECFDF5",color:C.success,fontWeight:600}}>Reviewer approves/denies ({form.hitlTimeoutMins}min timeout)</span>
              </div>
            </div>
          </div>

          <div style={{display:"flex",justifyContent:"space-between"}}>
            <button onClick={()=>setStep(3)} style={{padding:"10px 24px",borderRadius:8,background:"#EDF2F7",color:C.muted,fontWeight:600,fontSize:13}}>← Back</button>
            <button onClick={()=>setStep(5)} style={{padding:"10px 28px",borderRadius:8,background:`linear-gradient(135deg,${C.primary},${C.primaryDark})`,color:"#fff",fontWeight:600,fontSize:13}}>Next: Test →</button>
          </div>
        </div>
      )}

      {/* Step 5: Test Runner */}
      {step===5&&(
        <div style={{animation:"fadeUp .3s ease-out"}}>
          {/* Test Scenario Header */}
          {(()=>{
            const scenario=TEST_SCENARIOS[form.personaId]||TEST_SCENARIOS.dq_eng;
            return (
              <div style={{background:C.card,borderRadius:14,border:`1px solid ${C.border}`,padding:20,marginBottom:16}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
                  <div>
                    <div style={{fontWeight:700,fontSize:16,color:C.heading}}>Agent Test Runner</div>
                    <div style={{fontSize:12,color:C.muted,marginTop:2}}>Simulate a full agent cycle with synthetic Novartis data</div>
                  </div>
                  <button onClick={runTest} disabled={testState==="running"} style={{padding:"12px 32px",borderRadius:8,background:testState==="running"?`${C.primary}66`:`linear-gradient(135deg,${C.primary},${C.primaryDark})`,color:"#fff",fontWeight:700,fontSize:14,boxShadow:`0 4px 14px ${C.primary}33`}}>
                    {testState==="idle"?"▶ Run Agent Test":testState==="running"?"⟳ Testing...":"↻ Re-run Test"}
                  </button>
                </div>

                {/* Scenario Info */}
                <div style={{padding:14,borderRadius:10,background:"#F8FAFC",border:`1px solid ${C.border}`}}>
                  <div style={{fontWeight:700,fontSize:12,color:C.heading,marginBottom:8}}>📋 Test Scenario: {scenario.name}</div>
                  <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8}}>
                    {scenario.synthetic_data.map((d,i)=>(
                      <div key={i} style={{padding:"10px 12px",borderRadius:8,background:C.card,border:`1px solid ${d.status==="healthy"?C.success+"33":d.status==="sla_breach"?"#F59E0B33":"#EF444433"}`}}>
                        <div style={{fontWeight:600,fontSize:10,color:C.heading,fontFamily:"'JetBrains Mono',monospace"}}>{d.table.split(".").pop()}</div>
                        <div style={{display:"flex",gap:8,marginTop:4,fontSize:9,color:C.muted}}>
                          <span>{d.records} rows</span>
                          <span>•</span>
                          <span>{d.freshness}</span>
                        </div>
                        <div style={{marginTop:4,fontSize:9,fontWeight:600,color:d.status==="healthy"?C.success:d.status==="sla_breach"?"#F59E0B":"#EF4444"}}>
                          {d.status==="healthy"?"✅ Healthy":d.status==="sla_breach"?"⚠️ SLA Breach":"🔴 "+d.status.replace(/_/g," ")}
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            );
          })()}

          <div style={{display:"grid",gridTemplateColumns:"1fr 320px",gap:16,marginBottom:16}}>
            {/* Left: Execution Log */}
            <div style={{background:C.card,borderRadius:14,border:`1px solid ${C.border}`,overflow:"hidden"}}>
              <div style={{padding:"12px 20px",borderBottom:`1px solid ${C.border}`,fontWeight:700,fontSize:13,color:C.heading,background:"#F8FAFC",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                <span>📋 Execution Log</span>
                <span style={{fontSize:10,color:C.muted}}>{testLogs.length} entries</span>
              </div>
              <div style={{maxHeight:400,overflowY:"auto",padding:"4px 0",background:testLogs.length>0?"#FAFBFC":"#fff"}}>
                {testLogs.length===0?(
                  <div style={{padding:40,textAlign:"center",color:C.muted,fontSize:12}}>Click "Run Agent Test" to start the simulation</div>
                ):testLogs.map((log,i)=>(
                  <div key={i} style={{display:"flex",alignItems:"flex-start",gap:8,padding:"5px 16px",fontSize:11,borderBottom:"1px solid #F1F5F9",animation:`fadeUp .15s ease-out ${Math.min(i*.02,.3)}s both`}}>
                    <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:9,color:C.muted,minWidth:62,paddingTop:2}}>{log.ts}</span>
                    <span style={{padding:"1px 8px",borderRadius:4,fontSize:8,fontWeight:700,minWidth:56,textAlign:"center",flexShrink:0,
                      background:log.status==="pass"?"#ECFDF5":log.status==="running"?C.primaryBg:log.status==="hitl"?"#FFF7ED":log.status==="data"?"#EDF2F7":log.status==="info"?"#F0F9FF":log.status==="divider"?"transparent":"#FFFBEB",
                      color:log.status==="pass"?C.success:log.status==="running"?C.primary:log.status==="hitl"?"#EA580C":log.status==="data"?C.heading:log.status==="info"?"#0EA5E9":log.status==="divider"?"transparent":"#F59E0B",
                    }}>{log.status!=="divider"?log.phase:""}</span>
                    <span style={{color:log.status==="pass"?C.success:log.status==="hitl"?"#EA580C":log.status==="divider"?C.border:C.text,fontSize:log.status==="divider"?9:11,fontFamily:log.status==="divider"?"'JetBrains Mono',monospace":"inherit"}}>{log.msg}</span>
                  </div>
                ))}
              </div>
            </div>

            {/* Right: Phase Progress + Agent Card + Metrics */}
            <div style={{display:"flex",flexDirection:"column",gap:16}}>
              {/* Agent Summary */}
              <div style={{background:C.card,borderRadius:14,border:`1px solid ${C.border}`,padding:16}}>
                <div style={{display:"flex",gap:12,alignItems:"center",marginBottom:12}}>
                  <div style={{width:44,height:44,borderRadius:12,background:`${form.color}15`,border:`2px solid ${form.color}44`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:22}}>{form.icon}</div>
                  <div>
                    <div style={{fontWeight:700,fontSize:14,color:C.heading}}>{form.name||"Untitled Agent"}</div>
                    <div style={{fontSize:11,color:form.color,fontWeight:600}}>{form.persona}</div>
                  </div>
                </div>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:6,fontSize:10}}>
                  <div style={{padding:"6px 10px",borderRadius:6,background:"#F8FAFC",border:`1px solid ${C.border}`}}><span style={{color:C.muted}}>Tools:</span> <strong>{form.tools.length}</strong></div>
                  <div style={{padding:"6px 10px",borderRadius:6,background:"#F8FAFC",border:`1px solid ${C.border}`}}><span style={{color:C.muted}}>Schedule:</span> <strong>{form.schedule}</strong></div>
                  <div style={{padding:"6px 10px",borderRadius:6,background:"#FFF7ED",border:"1px solid #FB923C22"}}><span style={{color:C.muted}}>HITL:</span> <strong style={{color:"#EA580C"}}>{form.hitlGate}</strong></div>
                  <div style={{padding:"6px 10px",borderRadius:6,background:"#F8FAFC",border:`1px solid ${C.border}`}}><span style={{color:C.muted}}>Rules:</span> <strong>{form.hitlRules.filter(r=>r.enabled).length} active</strong></div>
                </div>
              </div>

              {/* Phase Progress */}
              <div style={{background:C.card,borderRadius:14,border:`1px solid ${C.border}`,padding:16}}>
                <div style={{fontWeight:700,fontSize:12,color:C.heading,marginBottom:10}}>Phase Progress</div>
                {form.phases.map((p,i)=>{
                  const isDone=testPhase>i;
                  const isActive=testPhase===i&&testState==="running";
                  return (
                    <div key={i} style={{display:"flex",alignItems:"center",gap:8,padding:"8px 10px",borderRadius:8,border:`1px solid ${isDone?C.success+"33":isActive?C.primary+"44":C.border}`,background:isDone?"#ECFDF5":isActive?C.primaryBg:"#FAFBFC",marginBottom:6}}>
                      <div style={{width:20,height:20,borderRadius:5,background:isDone?C.success:isActive?C.primary:"#EDF2F7",color:"#fff",display:"flex",alignItems:"center",justifyContent:"center",fontSize:9,fontWeight:700}}>
                        {isDone?"✓":isActive?"⟳":(i+1)}
                      </div>
                      <span style={{fontSize:11,fontWeight:600,color:isDone?C.success:isActive?C.primary:C.muted,flex:1}}>{p.phase}</span>
                      {p.phase===form.hitlGate&&<span style={{fontSize:9,color:"#EA580C"}}>👤</span>}

                {testState==="pass"&&<div style={{marginTop:8,padding:"8px 10px",borderRadius:6,background:"#ECFDF5",border:"1px solid #10B98133",color:C.success,fontWeight:600,fontSize:11,textAlign:"center"}}>✅ All phases passed</div>}
              </div>

              {/* Test Metrics */}
              {testMetrics&&(
                <div style={{background:C.card,borderRadius:14,border:`1px solid ${C.success}33`,padding:16}}>
                  <div style={{fontWeight:700,fontSize:12,color:C.heading,marginBottom:10}}>📊 Test Metrics</div>
                  <div style={{display:"grid",gap:6}}>
                    {[
                      {l:"Total Actions",v:testMetrics.totalActions,c:C.heading},
                      {l:"Tool API Calls",v:testMetrics.toolCalls,c:C.primary},
                      {l:"HITL Triggers",v:testMetrics.hitlTriggers,c:"#EA580C"},
                      {l:"Avg Phase Time",v:testMetrics.avgPhaseTime+"ms",c:C.heading},
                      {l:"Memory Usage",v:testMetrics.memoryUsed,c:C.heading},
                      {l:"Health Score",v:testMetrics.score+"/100",c:C.success},
                    ].map((m,i)=>(
                      <div key={i} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"5px 0",borderBottom:`1px solid ${C.border}22`}}>
                        <span style={{fontSize:10,color:C.muted}}>{m.l}</span>
                        <span style={{fontSize:11,fontWeight:700,color:m.c}}>{m.v}</span>
                      </div>
                    ))}
                  </div>
                </div>
              )}
            </div>
          </div>

          <div style={{display:"flex",justifyContent:"space-between"}}>
            <button onClick={()=>setStep(4)} style={{padding:"10px 24px",borderRadius:8,background:"#EDF2F7",color:C.muted,fontWeight:600,fontSize:13}}>← Back</button>
            <button onClick={()=>setStep(6)} disabled={testState!=="pass"} style={{padding:"10px 28px",borderRadius:8,background:testState==="pass"?`linear-gradient(135deg,${C.success},#059669)`:"#D9E2EC",color:"#fff",fontWeight:600,fontSize:13}}>Next: Deploy →</button>
          </div>
        </div>
      )}

      {/* Step 6: Deploy */}
      {step===6&&(
        <div style={{animation:"fadeUp .3s ease-out"}}>
          {!deployed?(
            <div>
              {/* Pre-Deploy Config */}
              {deployStage<0&&(
                <div>
                  <div style={{background:C.card,borderRadius:14,border:`1px solid ${C.border}`,padding:24,marginBottom:16}}>
                    <div style={{fontWeight:700,fontSize:16,color:C.heading,marginBottom:4}}>Deploy Agent</div>
                    <div style={{fontSize:12,color:C.muted,marginBottom:20}}>Choose target environment and review configuration before deploying <strong>{form.name||"your agent"}</strong></div>

                    {/* Environment Selection */}
                    <div style={{fontSize:10,fontWeight:600,color:C.heading,marginBottom:8,textTransform:"uppercase",letterSpacing:.5}}>Target Environment</div>
                    <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:12,marginBottom:20}}>
                      {[
                        {id:"staging",name:"Staging",icon:"🧪",desc:"Test with production-like data, no live impact",color:"#F59E0B"},
                        {id:"production",name:"Production",icon:"🚀",desc:"Live environment — affects real Novartis data pipelines",color:C.success},
                        {id:"canary",name:"Canary (10%)",icon:"🐤",desc:"Route 10% of traffic to new agent, monitor before full rollout",color:C.primary},
                      ].map(env=>(
                        <div key={env.id} onClick={()=>setDeployEnv(env.id)} style={{padding:18,borderRadius:12,border:`2px solid ${deployEnv===env.id?env.color:C.border}`,background:deployEnv===env.id?`${env.color}08`:"#FAFBFC",cursor:"pointer",textAlign:"center",transition:"all .2s"}}>
                          <div style={{fontSize:28,marginBottom:6}}>{env.icon}</div>
                          <div style={{fontWeight:700,fontSize:13,color:deployEnv===env.id?env.color:C.heading}}>{env.name}</div>
                          <div style={{fontSize:10,color:C.muted,marginTop:4,lineHeight:1.4}}>{env.desc}</div>
                        </div>
                      ))}
                    </div>

                    {/* Deployment Summary */}
                    <div style={{padding:16,borderRadius:10,background:"#F8FAFC",border:`1px solid ${C.border}`,marginBottom:20}}>
                      <div style={{fontWeight:700,fontSize:12,color:C.heading,marginBottom:10}}>📋 Deployment Summary</div>
                      <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:12}}>
                        {[
                          {l:"Agent",v:form.name||"Untitled",icon:form.icon},
                          {l:"Persona",v:form.persona},
                          {l:"Tools",v:`${form.tools.length} connected`},
                          {l:"Phases",v:`4 phases, ${form.phases.reduce((s,p)=>s+p.actions.filter(a=>a).length,0)} actions`},
                          {l:"HITL Gate",v:`${form.hitlGate} (${form.hitlRules.filter(r=>r.enabled).length} rules)`},
                          {l:"Schedule",v:`Every ${form.schedule}`},
                          {l:"Environment",v:deployEnv.charAt(0).toUpperCase()+deployEnv.slice(1)},
                          {l:"Compute",v:"2 vCPU / 4GB RAM"},
                          {l:"Notifications",v:form.hitlNotifyChannel},
                        ].map((item,i)=>(
                          <div key={i} style={{padding:"8px 12px",borderRadius:6,background:C.card,border:`1px solid ${C.border}`}}>
                            <div style={{fontSize:9,color:C.muted,textTransform:"uppercase",letterSpacing:.5}}>{item.l}</div>
                            <div style={{fontSize:11,fontWeight:600,color:C.heading,marginTop:2}}>{item.icon?`${item.icon} `:""}{item.v}</div>
                          </div>
                        ))}
                      </div>
                    </div>

                    {/* Deploy Button */}
                    <div style={{textAlign:"center"}}>
                      <button onClick={runDeploy} style={{padding:"14px 48px",borderRadius:10,background:deployEnv==="production"?`linear-gradient(135deg,${C.success},#059669)`:`linear-gradient(135deg,${C.primary},${C.primaryDark})`,color:"#fff",fontWeight:700,fontSize:15,boxShadow:deployEnv==="production"?"0 6px 20px rgba(16,185,129,.3)":`0 6px 20px ${C.primary}33`}}>
                        🚀 Deploy to {deployEnv.charAt(0).toUpperCase()+deployEnv.slice(1)}
                      </button>
                      {deployEnv==="production"&&<div style={{fontSize:10,color:"#EA580C",marginTop:8,fontWeight:600}}>⚠️ This will affect live Novartis data pipelines</div>}
                    </div>
                  </div>

                  <div style={{display:"flex",justifyContent:"space-between"}}>
                    <button onClick={()=>setStep(5)} style={{padding:"10px 24px",borderRadius:8,background:"#EDF2F7",color:C.muted,fontWeight:600,fontSize:13}}>← Back</button>
                  </div>
                </div>
              )}

              {/* Deployment In Progress */}
              {deployStage>=0&&(
                <div style={{display:"grid",gridTemplateColumns:"1fr 360px",gap:16}}>
                  {/* Left: Pipeline Stages */}
                  <div style={{background:C.card,borderRadius:14,border:`1px solid ${C.border}`,padding:20}}>
                    <div style={{fontWeight:700,fontSize:16,color:C.heading,marginBottom:4}}>Deployment Pipeline</div>
                    <div style={{fontSize:12,color:C.muted,marginBottom:16}}>Deploying to <strong>{deployEnv}</strong> environment</div>
                    <div style={{display:"grid",gap:8}}>
                      {DEPLOY_STAGES.map((stage,i)=>{
                        const done=deployStage>i;
                        const active=deployStage===i;
                        return (
                          <div key={i} style={{display:"flex",alignItems:"center",gap:14,padding:"14px 18px",borderRadius:10,border:`1px solid ${done?C.success+"33":active?C.primary+"44":C.border}`,background:done?"#ECFDF5":active?C.primaryBg:"#FAFBFC",animation:`fadeUp .3s ease-out ${i*.05}s both`}}>
                            <div style={{width:32,height:32,borderRadius:8,background:done?C.success:active?C.primary:"#EDF2F7",color:done||active?"#fff":C.muted,display:"flex",alignItems:"center",justifyContent:"center",fontSize:done?14:16,fontWeight:700}}>
                              {done?"✓":active?<span style={{animation:"spin 1s linear infinite",display:"inline-block"}}>⟳</span>:stage.icon}
                            </div>
                            <div style={{flex:1}}>
                              <div style={{fontSize:13,fontWeight:600,color:done?C.success:active?C.primary:C.muted}}>{stage.name}</div>
                              <div style={{fontSize:10,color:C.muted,marginTop:1}}>{stage.detail}</div>
                            </div>
                            {done&&<span style={{fontSize:10,color:C.success,fontWeight:600}}>✓ Done</span>}
                            {active&&<span style={{fontSize:10,color:C.primary,fontWeight:600}}>Running...</span>}
                          </div>
                        );
                      })}
                    </div>

                    {/* Progress bar */}
                    <div style={{marginTop:16,background:"#EDF2F7",borderRadius:8,height:6,overflow:"hidden"}}>
                      <div style={{height:"100%",background:`linear-gradient(90deg,${C.primary},${C.success})`,borderRadius:8,width:`${Math.min((deployStage/DEPLOY_STAGES.length)*100,100)}%`,transition:"width .5s ease"}}/>
                    </div>
                    <div style={{fontSize:10,color:C.muted,textAlign:"center",marginTop:6}}>{Math.round((deployStage/DEPLOY_STAGES.length)*100)}% complete</div>
                  </div>

                  {/* Right: Deploy Logs */}
                  <div style={{background:C.card,borderRadius:14,border:`1px solid ${C.border}`,overflow:"hidden",display:"flex",flexDirection:"column"}}>
                    <div style={{padding:"12px 16px",borderBottom:`1px solid ${C.border}`,fontWeight:700,fontSize:12,color:C.heading,background:"#F8FAFC"}}>📋 Deployment Log</div>
                    <div style={{flex:1,maxHeight:500,overflowY:"auto",padding:"6px 0",background:"#1E293B"}}>
                      {deployLogs.map((log,i)=>(
                        <div key={i} style={{padding:"4px 14px",fontSize:10,fontFamily:"'JetBrains Mono',monospace",color:log.status==="pass"?"#4ADE80":log.status==="done"?"#38BDF8":"#94A3B8",animation:`fadeUp .15s ease-out`}}>
                          <span style={{color:"#64748B"}}>[{log.ts}]</span> {log.msg}
                        </div>
                      ))}
                    </div>
                  </div>
                </div>
              )}
            </div>
          ):(
            /* Deployment Success */
            <div>
              <div style={{background:C.card,borderRadius:14,border:`2px solid ${C.success}44`,padding:32,marginBottom:16}}>
                <div style={{textAlign:"center",marginBottom:24}}>
                  <div style={{width:80,height:80,borderRadius:20,background:"#ECFDF5",display:"inline-flex",alignItems:"center",justifyContent:"center",fontSize:40,marginBottom:16,border:"2px solid #10B98133"}}>✅</div>
                  <div style={{fontSize:22,fontWeight:800,color:C.success,marginBottom:4}}>Agent Deployed Successfully!</div>
                  <div style={{fontSize:13,color:C.muted}}><strong>{form.name}</strong> is now live on the iZO platform ({deployEnv})</div>
                </div>

                {/* Post-Deploy Info Cards */}
                <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:12,marginBottom:24}}>
                  {[
                    {l:"Agent ID",v:`izo.agent.${(form.name||"new").toLowerCase().replace(/\s+/g,"_")}`,icon:"🆔"},
                    {l:"Status",v:"🟢 Active",icon:""},
                    {l:"Environment",v:deployEnv.charAt(0).toUpperCase()+deployEnv.slice(1),icon:deployEnv==="production"?"🚀":"🧪"},
                    {l:"First Run",v:"In ~"+form.schedule,icon:"⏰"},
                  ].map((m,i)=>(
                    <div key={i} style={{padding:"14px 16px",borderRadius:10,background:"#F8FAFC",border:`1px solid ${C.border}`}}>
                      <div style={{fontSize:10,color:C.muted}}>{m.l}</div>
                      <div style={{fontSize:12,fontWeight:700,color:C.heading,marginTop:3}}>{m.icon} {m.v}</div>
                    </div>
                  ))}
                </div>

                {/* Agent YAML Config */}
                <div style={{borderRadius:10,overflow:"hidden",marginBottom:24}}>
                  <div style={{padding:"10px 16px",background:"#1E293B",fontSize:10,fontWeight:600,color:"#94A3B8",display:"flex",justifyContent:"space-between"}}>
                    <span>GENERATED AGENT CONFIGURATION (YAML)</span>
                    <span style={{color:"#4ADE80"}}>✓ Deployed</span>
                  </div>
                  <pre style={{padding:16,background:"#0F172A",color:"#E2E8F0",fontSize:10,fontFamily:"'JetBrains Mono',monospace",lineHeight:1.6,margin:0,maxHeight:260,overflowY:"auto"}}>{`agent:
  id: izo.agent.${(form.name||"new").toLowerCase().replace(/\s+/g,"_")}
  name: "${form.name}"
  persona: "${form.persona}"
  version: 1.0.0
  environment: ${deployEnv}

schedule:
  interval: "${form.schedule}"
  timezone: "UTC"

tools:
${form.tools.map(tid=>{const t=TOOL_OPTIONS.find(x=>x.id===tid);return `  - id: ${tid}\n    name: "${t?.name}"\n    endpoint: "${t?.endpoint}"\n    auth: ${form.toolConfigs[tid]?.authMethod||"api_key"}`}).join("\n")}

phases:
${form.phases.map(p=>`  - phase: "${p.phase}"
    title: "${p.title}"
    actions: [${p.actions.filter(a=>a).map(a=>`"${a}"`).join(", ")}]
    tool_bindings: [${(p.toolBindings||[]).join(", ")}]`).join("\n")}

hitl:
  gate_phase: "${form.hitlGate}"
  escalation_threshold: "${form.hitlThreshold}"
  auto_approve_below: "${form.hitlAutoApproveBelow}"
  timeout_minutes: ${form.hitlTimeoutMins}
  notify_channel: "${form.hitlNotifyChannel}"
  reviewers: [${form.hitlReviewers.map(r=>`"${r}"`).join(", ")}]
  rules:
${form.hitlRules.filter(r=>r.enabled).map(r=>`    - id: ${r.id}\n      severity: ${r.severity}\n      phase: ${r.phase}`).join("\n")}

resources:
  compute: "2 vCPU / 4GB RAM"
  secrets_vault: "nvs-pharma-vault"
  log_group: "izo-agents/${(form.name||"new").toLowerCase().replace(/\s+/g,"-")}"`}</pre>
                </div>

                {/* Post-Deploy Actions */}
                <div style={{display:"flex",justifyContent:"center",gap:12}}>
                  <button onClick={()=>onNav("registry")} style={{padding:"12px 32px",borderRadius:8,background:`linear-gradient(135deg,${C.primary},${C.primaryDark})`,color:"#fff",fontWeight:600,fontSize:14}}>View in Agent Registry →</button>
                  <button onClick={()=>onNav("orchestration")} style={{padding:"12px 24px",borderRadius:8,background:"#EDF2F7",color:C.heading,fontWeight:600,fontSize:14}}>Open Orchestration View</button>
                  <button onClick={()=>onNav("hitl")} style={{padding:"12px 24px",borderRadius:8,background:"#FFF7ED",color:"#EA580C",fontWeight:600,fontSize:14,border:"1px solid #FB923C33"}}>HITL Operations</button>
                </div>
              </div>
            </div>
          )}
        </div>
      )}

      </div>
      )}

    </div>
    </div>
  );
};

/* ══ MAIN APP ══ */
function App(){
  const [view,setView]=useState("registry");
  const agent=AGENTS.find(a=>a.id===view);

  return (
    <div style={{display:"flex",height:"100vh",background:C.bg,fontFamily:"'Inter','Segoe UI',system-ui,-apple-system,sans-serif"}}>
      <Sidebar view={view} onNav={setView}/>
      <div style={{flex:1,overflowY:"auto"}}>
        {view==="registry"&&<AgentRegistry onNav={setView}/>}
        {view==="orchestration"&&<OrchestrationView onNav={setView}/>}
        {view==="hitl"&&<HITLOperationsPanel onNav={setView}/>}
        {view==="creator"&&<AgentCreator onNav={setView}/>}
        {agent&&<AgentDetail agent={agent} onBack={()=>setView("registry")}/>}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
