*{box-sizing:border-box;margin:0;padding:0}
html,body,#root{height:100%;width:100%;overflow:hidden}
body{font-family:'Inter','Segoe UI',system-ui,-apple-system,sans-serif;background:#EDF2F7}

::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#A0AEC0;border-radius:3px}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes pulseGlow{0%,100%{box-shadow:0 0 6px rgba(30,130,189,.3)}50%{box-shadow:0 0 18px rgba(30,130,189,.6)}}
@keyframes flowPulse{0%{opacity:.3;transform:scaleX(.3)}50%{opacity:1;transform:scaleX(1)}100%{opacity:.3;transform:scaleX(.3)}}
@keyframes breathe{0%,100%{opacity:1}50%{opacity:.5}}

@keyframes slideRight{0%{transform:translateX(-100%);opacity:0}100%{transform:translateX(0);opacity:1}}

button{cursor:pointer;transition:all .2s;border:none}
button:hover{filter:brightness(1.08);transform:translateY(-1px)}
button:active{transform:translateY(0)}
.hitl-card{border:2px solid #1E82BD44;background:linear-gradient(135deg,#E8F4FD,#F0F7FF);border-radius:12px;padding:16px 20px}

/* ══ UI PRIMITIVES ══ */
const Badge=({children,variant="success",small})=>{
  const m={success:{bg:C.successBg,c:C.success},warning:{bg:C.warnBg,c:C.warn},error:{bg:C.errorBg,c:C.error},info:{bg:C.infoBg,c:C.info},neutral:{bg:"#EDF2F7",c:C.muted},primary:{bg:C.primaryBg,c:C.primary},purple:{bg:"#F3F0FF",c:"#7C3AED"},hitl:{bg:"#FFF7ED",c:"#EA580C"}};
  const s=m[variant]||m.neutral;
  return <span style={{display:"inline-flex",alignItems:"center",padding:small?"1px 6px":"2px 10px",borderRadius:20,fontSize:small?9:11,fontWeight:600,letterSpacing:.3,background:s.bg,color:s.c,border:`1px solid ${s.c}33`,whiteSpace:"nowrap"}}>{children}</span>;
};

const ProgressBar=({value,color=C.primary,height=6})=>(
  <div style={{width:"100%",background:"#D9E2EC",borderRadius:height,height,overflow:"hidden"}}>
    <div style={{width:`${value}%`,height:"100%",borderRadius:height,background:`linear-gradient(90deg,${color},${color}CC)`,transition:"width 1.2s cubic-bezier(0.4,0,0.2,1)"}}/>
  </div>
);

/* ══ HITL COMPONENTS ══ */

/* Per-Agent HITL Gate Panel */
const HITLAgentPanel=({agent})=>{
  const h=agent.hitlConfig;
  const [approvals,setApprovals]=useState(h.recentReviews.map(r=>r.decision));

  const handleDecision=(idx,decision)=>{
    const next=[...approvals];
    next[idx]=decision;
    setApprovals(next);
  };

  return (
    <div style={{background:C.card,borderRadius:14,border:`2px solid ${C.hitlBorder}`,overflow:"hidden",marginBottom:24}}>
      <div style={{padding:"16px 24px",borderBottom:`1px solid ${C.border}`,background:"linear-gradient(135deg,#E8F4FD,#F0F7FF)",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <div style={{display:"flex",alignItems:"center",gap:12}}>
          <div style={{width:36,height:36,borderRadius:10,background:"#1E82BD18",border:"2px solid #1E82BD44",display:"flex",alignItems:"center",justifyContent:"center",fontSize:18,animation:"hitlPulse 2s infinite"}}>👤</div>
          <div>
            <div style={{fontWeight:700,fontSize:14,color:C.heading}}>Human-in-the-Loop Gate</div>
            <div style={{fontSize:11,color:C.muted}}>Active at <strong>{h.approvalGate}</strong> phase · Escalation threshold: <strong>{h.escalationThreshold}</strong></div>
          </div>
        </div>
        <Badge variant="hitl">HITL Active</Badge>
      </div>

      <div style={{padding:20}}>
        {/* Requires Human For */}
        <div style={{marginBottom:18}}>
          <div style={{fontSize:11,fontWeight:700,color:C.primary,textTransform:"uppercase",letterSpacing:1,marginBottom:8}}>Requires Human Approval</div>
          <div style={{display:"flex",flexWrap:"wrap",gap:8}}>
            {h.requiresHumanFor.map(r=>(
              <div key={r} style={{padding:"6px 14px",borderRadius:8,background:"#FFF7ED",border:"1px solid #FB923C44",fontSize:11,fontWeight:500,color:"#EA580C",display:"flex",alignItems:"center",gap:6}}>
                <span style={{fontSize:14}}>🔒</span>{r}
              </div>
            ))}
          </div>
        </div>

        {/* Recent Review Queue */}
        <div style={{fontSize:11,fontWeight:700,color:C.primary,textTransform:"uppercase",letterSpacing:1,marginBottom:8}}>Review Queue</div>
        <div style={{display:"grid",gap:8}}>
          {h.recentReviews.map((r,i)=>(
            <div key={i} style={{display:"flex",alignItems:"center",gap:12,padding:"12px 16px",borderRadius:10,border:`1px solid ${approvals[i]==="Pending"?"#FB923C44":approvals[i]==="Approved"?C.success+"33":approvals[i]==="Denied"?C.error+"33":C.border}`,background:approvals[i]==="Pending"?"#FFFBF5":"#FAFBFC",animation:`fadeUp .3s ease-out ${i*.06}s both`}}>
              <div style={{width:32,height:32,borderRadius:8,background:approvals[i]==="Pending"?"#FFF7ED":approvals[i]==="Approved"?C.successBg:approvals[i]==="Denied"?C.errorBg:"#F1F5F9",display:"flex",alignItems:"center",justifyContent:"center",fontSize:16}}>
                {approvals[i]==="Pending"?"⏳":approvals[i]==="Approved"?"✅":"❌"}
              </div>
              <div style={{flex:1}}>
                <div style={{fontSize:12,fontWeight:600,color:C.text}}>{r.action}</div>
                <div style={{fontSize:10,color:C.muted}}>Reviewer: {r.reviewer} · {r.time}</div>
              </div>
              {approvals[i]==="Pending"?(
                <div style={{display:"flex",gap:6}}>
                  <button onClick={()=>handleDecision(i,"Approved")} style={{padding:"5px 14px",borderRadius:6,background:C.success,color:"#fff",fontSize:11,fontWeight:600}}>Approve</button>
                  <button onClick={()=>handleDecision(i,"Denied")} style={{padding:"5px 14px",borderRadius:6,background:C.error,color:"#fff",fontSize:11,fontWeight:600}}>Deny</button>
                  <button onClick={()=>{}} style={{padding:"5px 14px",borderRadius:6,background:"#F1F5F9",color:C.muted,fontSize:11,fontWeight:600,border:`1px solid ${C.border}`}}>Escalate</button>
                </div>
              ):(
                <Badge variant={approvals[i]==="Approved"?"success":"error"}>{approvals[i]}</Badge>
              )}
            </div>
          ))}
        </div>
      </div>
    </div>
  );
};

/* Platform-Level HITL Operations Panel */
const HITLOperationsPanel=({onNav})=>{
  const [policyTab,setPolicyTab]=useState("queue");
  const allPending=AGENTS.flatMap(a=>a.hitlConfig.recentReviews.filter(r=>r.decision==="Pending").map(r=>({...r,agent:a.name,agentId:a.id,icon:a.icon,color:a.color})));
  const allRecent=AGENTS.flatMap(a=>a.hitlConfig.recentReviews.filter(r=>r.decision!=="Pending").map(r=>({...r,agent:a.name,agentId:a.id,icon:a.icon,color:a.color})));
  const [decisions,setDecisions]=useState(allPending.map(()=>"Pending"));

  const handleDecision=(idx,decision)=>{
    const next=[...decisions]; next[idx]=decision; setDecisions(next);
  };

  return (
    <div><TopBar crumbs={["iZO Platform","HITL Operations"]}/>

      </div>

      {/* HITL Summary Stats */}
      <div style={{display:"grid",gridTemplateColumns:"repeat(5,1fr)",gap:16,marginBottom:24}}>
        {[
          {l:"Pending Approvals",v:allPending.filter((_,i)=>decisions[i]==="Pending").length,icon:"⏳",c:"#EA580C",bg:"#FFF7ED"},
          {l:"Approved Today",v:12,icon:"✅",c:C.success,bg:C.successBg},
          {l:"Denied Today",v:1,icon:"❌",c:C.error,bg:C.errorBg},
          {l:"Avg Response Time",v:"14m",icon:"⏱️",c:C.primary,bg:C.primaryBg},
          {l:"Auto-Approved",v:89,icon:"🤖",c:C.heading,bg:"#E8F4FD"},
        ].map((m,i)=>(
          <div key={i} style={{background:C.card,borderRadius:12,padding:"18px 22px",border:`1px solid ${C.border}`,animation:`fadeUp .4s ease-out ${i*.08}s both`}}>

            <div style={{fontSize:26,fontWeight:800,color:m.c}}>{m.v}</div>
            <div style={{fontSize:11,color:C.muted,marginTop:2}}>{m.l}</div>
          </div>
        ))}
      </div>

      {/* Tab Navigation */}
      <div style={{display:"flex",gap:0,marginBottom:20,background:C.card,borderRadius:12,border:`1px solid ${C.border}`,overflow:"hidden"}}>
        {[{id:"queue",label:"Approval Queue",icon:"📋"},{id:"policies",label:"HITL Policies",icon:"📜"},{id:"audit",label:"Audit Trail",icon:"📝"},{id:"settings",label:"Escalation Settings",icon:"⚙️"}].map(tab=>(
          <div key={tab.id} onClick={()=>setPolicyTab(tab.id)} style={{flex:1,padding:"14px 20px",textAlign:"center",cursor:"pointer",borderBottom:`3px solid ${policyTab===tab.id?C.primary:"transparent"}`,background:policyTab===tab.id?C.primaryBg:"transparent",transition:"all .2s"}}>
            <span style={{fontSize:16,marginRight:8}}>{tab.icon}</span>
            <span style={{fontSize:13,fontWeight:policyTab===tab.id?700:500,color:policyTab===tab.id?C.primary:C.muted}}>{tab.label}</span>

   AGENT DETAIL VIEW — Individual Agent Internals
   ══════════════════════════════════════════════════════════════════════ */
const AgentDetail=({agent,onBack})=>{
  const a=agent;
  const [activePhase,setActivePhase]=useState(0);
  const [running,setRunning]=useState(false);
  const [completedPhases,setCompletedPhases]=useState([]);
  const [hitlTriggered,setHitlTriggered]=useState(false);

  const simulateRun=()=>{
    setRunning(true);setActivePhase(0);setCompletedPhases([]);setHitlTriggered(false);
    let phase=0;
    const interval=setInterval(()=>{
      setCompletedPhases(prev=>[...prev,phase]);
      phase++;
      if(phase<4){
        setActivePhase(phase);
        /* Trigger HITL gate at the configured phase */
        if(a.steps[phase].phase===a.hitlConfig.approvalGate){
          setHitlTriggered(true);
        }
      }
      else{clearInterval(interval);setTimeout(()=>{setRunning(false)},1500)}
    },2000);
  };

  return (
    <div><TopBar crumbs={["iZO Platform","Agent Registry",a.name]}/>
    <div style={{padding:28}}>
      {/* Agent Header */}
      <div style={{background:`linear-gradient(135deg,${C.sidebar},${C.sidebarDark})`,borderRadius:14,padding:"28px 32px",marginBottom:24,position:"relative",overflow:"hidden"}}>
        <div style={{position:"absolute",top:-20,right:-20,width:200,height:200,borderRadius:"50%",background:`${a.color}08`}}/>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
          <div style={{display:"flex",gap:16,alignItems:"center"}}>
            <div style={{width:60,height:60,borderRadius:16,background:`${a.color}22`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:30,border:`2px solid ${a.color}66`}}>{a.icon}</div>
            <div>
              <div style={{fontSize:22,fontWeight:800,color:"#fff"}}>{a.name}</div>
              <div style={{fontSize:13,color:a.color,fontWeight:600,marginTop:2}}>Persona: {a.persona}</div>
              <div style={{fontSize:12,color:"#A0B4CC",marginTop:4,maxWidth:500}}>{a.desc}</div>
            </div>
          </div>
          <div style={{display:"flex",gap:12,alignItems:"flex-start"}}>
            <button onClick={simulateRun} disabled={running} style={{padding:"10px 24px",borderRadius:8,background:running?`${a.color}88`:`linear-gradient(135deg,${C.primary},${C.primaryDark})`,color:"#fff",fontWeight:600,fontSize:13,boxShadow:`0 4px 14px ${C.primary}44`,opacity:running?.7:1}}>
              {running?"⟳ Running...":"▶ Simulate Agent Run"}
            </button>
          </div>
        </div>
        <div style={{display:"flex",gap:24,marginTop:20}}>
          {[["Tasks Today",a.tasks,C.primaryLight],["Success Rate",a.success+"%",C.success],["Connected Tools",a.tools.length,"#fff"],["HITL Gate",a.hitlConfig.approvalGate,"#EA580C"]].map(([l,v,c])=>(
            <div key={l} style={{textAlign:"center"}}><div style={{fontSize:22,fontWeight:800,color:c}}>{v}</div><div style={{fontSize:10,color:"#7BA3C9"}}>{l}</div></div>
          ))}
        </div>
      </div>

      {/* Capabilities & Tools */}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:16,marginBottom:24}}>
        <div style={{background:C.card,borderRadius:12,padding:20,border:`1px solid ${C.border}`}}>
          <div style={{fontWeight:700,fontSize:14,color:C.heading,marginBottom:12}}>🎯 Capabilities</div>
          <div style={{display:"flex",flexWrap:"wrap",gap:8}}>
            {a.capabilities.map(c=><div key={c} style={{padding:"6px 14px",borderRadius:8,background:`${a.color}10`,border:`1px solid ${a.color}25`,fontSize:12,fontWeight:500,color:a.color}}>{c}</div>)}
          </div>
        </div>
        <div style={{background:C.card,borderRadius:12,padding:20,border:`1px solid ${C.border}`}}>
          <div style={{fontWeight:700,fontSize:14,color:C.heading,marginBottom:12}}>🔧 Connected Tools</div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
            {a.tools.map(t=>(
              <div key={t} style={{padding:"10px 14px",borderRadius:8,border:`1px solid ${C.border}`,display:"flex",alignItems:"center",gap:8,background:"#F8FAFC"}}>
                <div style={{width:8,height:8,borderRadius:"50%",background:C.success,animation:"pulseGlow 2s infinite"}}/>
                <span style={{fontSize:12,fontWeight:600,color:C.heading}}>{t}</span>
              </div>
            ))}
          </div>
        </div>
      </div>

      {/* HITL Gate Panel for this Agent */}
      <HITLAgentPanel agent={a}/>

      {/* AGENTIC LOOP */}
      <div style={{background:C.card,borderRadius:14,border:`1px solid ${C.border}`,overflow:"hidden",marginBottom:24}}>
        <div style={{padding:"18px 24px",borderBottom:`1px solid ${C.border}`,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <div>
            <div style={{fontWeight:700,fontSize:16,color:C.heading}}>Agentic Execution Flow</div>
            <div style={{fontSize:12,color:C.muted}}>How this agent autonomously plans, executes, reflects, and acts</div>
          </div>
          <div style={{display:"flex",gap:8}}>
            {running&&<Badge variant="info">⟳ Simulating...</Badge>}
            {hitlTriggered&&<Badge variant="hitl">👤 HITL Gate Triggered</Badge>}
          </div>
        </div>

        <div style={{display:"flex",borderBottom:`1px solid ${C.border}`,background:"#F8FAFC"}}>
          {a.steps.map((step,i)=>{
            const isActive=activePhase===i;
            const isDone=completedPhases.includes(i);
            const isHitlPhase=step.phase===a.hitlConfig.approvalGate;
            return (
              <div key={i} onClick={()=>{if(!running)setActivePhase(i)}} style={{flex:1,padding:"16px 20px",cursor:running?"default":"pointer",borderBottom:`3px solid ${isActive?step.color:"transparent"}`,background:isActive?`${step.color}06`:"transparent",transition:"all .3s",position:"relative"}}>
                <div style={{display:"flex",alignItems:"center",gap:8}}>
                  <div style={{width:28,height:28,borderRadius:8,background:isDone?`${step.color}22`:isActive?`${step.color}15`:"#EDF2F7",border:`2px solid ${isDone?step.color:isActive?step.color:C.border}`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:14,transition:"all .3s"}}>
                    {isDone?"✓":PHASE_ICONS[step.phase]}
                  </div>
                  <div>
                    <div style={{display:"flex",alignItems:"center",gap:4}}>
                      <span style={{fontSize:10,fontWeight:700,color:step.color,letterSpacing:.5}}>{step.phase}</span>
                      {isHitlPhase&&<span style={{fontSize:10,color:"#EA580C"}} title="HITL Gate">👤</span>}
                    </div>
                    <div style={{fontSize:12,fontWeight:600,color:isActive?C.heading:C.muted}}>{step.title}</div>
                  </div>
                </div>
              </div>
            );
          })}
        </div>

        <div style={{padding:24}}>
          {(()=>{
            const step=a.steps[activePhase];
            const isDone=completedPhases.includes(activePhase);
            return (
              <div style={{animation:"fadeUp .3s ease-out"}}>
                <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:16}}>
                  <div style={{width:40,height:40,borderRadius:12,background:`${step.color}15`,border:`2px solid ${step.color}`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:20}}>{PHASE_ICONS[step.phase]}</div>
                  <div>
                    <div style={{fontSize:10,fontWeight:700,color:step.color,textTransform:"uppercase",letterSpacing:1}}>{step.phase}</div>
                    <div style={{fontSize:16,fontWeight:700,color:C.heading}}>{step.title}</div>
                  </div>
                  {isDone&&<Badge variant="success">✓ Completed</Badge>}
                  {running&&activePhase===a.steps.indexOf(step)&&!isDone&&<Badge variant="info">⟳ Executing...</Badge>}
                </div>
                <p style={{fontSize:13,color:C.muted,marginBottom:20,lineHeight:1.6}}>{step.desc}</p>
                <div style={{display:"grid",gap:10}}>
                  {step.actions.map((action,ai)=>{
                    const isHitlAction=action.startsWith("⚠️ HITL");
                    return (
                      <div key={ai} style={{display:"flex",alignItems:"flex-start",gap:12,padding:"12px 16px",borderRadius:10,background:isHitlAction?"#FFF7ED":isDone?`${step.color}06`:"#FAFBFC",border:`1px solid ${isHitlAction?"#FB923C44":isDone?`${step.color}25`:C.border}`,animation:`fadeUp .3s ease-out ${ai*0.08}s both`,transition:"all .3s"}}>
                        <div style={{width:24,height:24,borderRadius:6,background:isHitlAction?"#FFF7ED":isDone?`${step.color}22`:"#EDF2F7",border:`1px solid ${isHitlAction?"#FB923C":isDone?step.color:C.border}`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,fontWeight:700,color:isHitlAction?"#EA580C":isDone?step.color:C.muted,flexShrink:0,marginTop:1}}>
                          {isHitlAction?"👤":isDone?"✓":(ai+1)}
                        </div>
                        <div style={{fontSize:13,color:isHitlAction?"#EA580C":C.text,lineHeight:1.5,fontWeight:isHitlAction?600:400}}>{action}</div>
                      </div>
                    );
                  })}
                </div>
              </div>
            );
          })()}
        </div>
      </div>

      {/* Execution Log */}
      <div style={{background:C.card,borderRadius:12,border:`1px solid ${C.border}`,overflow:"hidden"}}>
        <div style={{padding:"14px 20px",borderBottom:`1px solid ${C.border}`,fontWeight:700,fontSize:14,color:C.heading}}>Recent Execution Log</div>
        <table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}>
          <thead><tr style={{background:"#F8FAFC"}}>{["Timestamp","Phase","Action","Tool","Result","HITL","Duration"].map(h=><th key={h} style={{padding:"10px 14px",textAlign:"left",fontWeight:600,color:C.muted,fontSize:10,textTransform:"uppercase",letterSpacing:.5,borderBottom:`1px solid ${C.border}`}}>{h}</th>)}</tr></thead>
          <tbody>
            {[
              {ts:"2026-03-06 09:42:18",phase:"PLAN",action:"Pipeline health scan",tool:"Monte Carlo",result:"3 incidents found",hitl:"—",dur:"0.8s"},
              {ts:"2026-03-06 09:42:19",phase:"TOOL USE",action:"ML.ANOMALY_DETECTION",tool:"Snowflake",result:"12% TRx drop flagged",hitl:"—",dur:"2.1s"},
              {ts:"2026-03-06 09:42:21",phase:"REFLECT",action:"Root cause analysis",tool:"Cortex",result:"Schema drift detected",hitl:"—",dur:"3.2s"},
              {ts:"2026-03-06 09:42:24",phase:"ACT",action:"Quarantine 12K records",tool:"Snowflake",result:"⏳ Awaiting approval",hitl:"👤 Pending",dur:"—"},
              {ts:"2026-03-06 09:44:08",phase:"ACT",action:"Quarantine 12K records",tool:"Snowflake",result:"✅ Approved by S. Chen",hitl:"✅ Approved",dur:"1m 44s"},
              {ts:"2026-03-06 09:44:10",phase:"ACT",action:"Alert pushed",tool:"Slack",result:"Team notified with RCA",hitl:"—",dur:"0.3s"},
            ].map((r,i)=>(
              <tr key={i} style={{borderBottom:`1px solid ${C.border}`}}>
                <td style={{padding:"10px 14px",color:C.muted,fontFamily:"monospace",fontSize:11}}>{r.ts}</td>
                <td style={{padding:"10px 14px"}}><span style={{padding:"2px 8px",borderRadius:6,fontSize:10,fontWeight:700,background:`${PHASE_COLORS[r.phase]}15`,color:PHASE_COLORS[r.phase]}}>{r.phase}</span></td>
                <td style={{padding:"10px 14px",fontWeight:500,color:C.text}}>{r.action}</td>
                <td style={{padding:"10px 14px"}}><Badge variant="neutral" small>{r.tool}</Badge></td>
                <td style={{padding:"10px 14px",color:C.text}}>{r.result}</td>
                <td style={{padding:"10px 14px",fontSize:11,color:r.hitl.includes("Approved")?C.success:r.hitl.includes("Pending")?"#EA580C":C.light}}>{r.hitl}</td>

              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
    </div>
  );
};

const TOOL_CODE_SNIPPETS={
  snowflake:`# Snowflake + Cortex Integration
async def execute_snowflake_check(self, ctx):
    \"\"\"Run Data Metric Functions against target table\"\"\"
    dmf_sql = f\"\"\"
    SELECT
      SNOWFLAKE.CORE.NULL_COUNT(
        SELECT {ctx.column} FROM {ctx.table}
      ) as null_count,
      SNOWFLAKE.CORE.DUPLICATE_COUNT(
        SELECT {ctx.column} FROM {ctx.table}
      ) as dup_count
    \"\"\"
    results = await self.sf_client.execute(dmf_sql)

    # Use Cortex LLM for root cause analysis
    rca = await self.sf_client.cortex_complete(
        model="llama3.1-70b",
        prompt=f"Analyze DQ issue: {results}"
    )
    return {"dmf_results": results, "rca": rca}`,
  montecarlo:`# Monte Carlo Anomaly Detection
async def check_anomalies(self, ctx):
    \"\"\"Query Monte Carlo for freshness & volume anomalies\"\"\"
    anomalies = await self.mc_client.get_anomalies(
        dataset=ctx.dataset,
        start_time=ctx.window_start,
        severity=["WARNING", "ERROR"]
    )

    # Check freshness SLA
    freshness = await self.mc_client.get_freshness(
        table_id=ctx.table_id
    )
    sla_breach = freshness.hours_since_update > ctx.sla_hours
    return {"anomalies": anomalies, "sla_breach": sla_breach}`,
  reltio:`# Reltio MDM Entity Resolution
async def resolve_entities(self, ctx):
    \"\"\"Match-merge entities and produce golden records\"\"\"
    candidates = await self.reltio.search_entities(
        type=ctx.entity_type,  # "HCP" or "HCO"
        filters=ctx.match_criteria
    )

    # Execute ML-powered merge
    merge_result = await self.reltio.merge_entities(
        winner=candidates.best_match,
        losers=candidates.duplicates,
        survivorship_rules=ctx.survivorship
    )
    golden = await self.reltio.get_golden_record(merge_result.id)
    return {"golden_record": golden, "merged_count": len(candidates)}`,
  enkrypt:`# Enkrypt AI PHI/PII Scanning
async def scan_for_phi(self, ctx):
    \"\"\"Scan dataset for unmasked PHI/PII fields\"\"\"
    scan_result = await self.enkrypt.scan_phi_pii(
        dataset=ctx.dataset,
        policy="HIPAA_SAFE_HARBOR",
        sensitivity="HIGH"
    )

    if scan_result.violations:
        # Auto-mask detected PHI
        await self.enkrypt.mask_fields(
            dataset=ctx.dataset,
            fields=scan_result.violation_fields,
            method="SHA256_TOKENIZE"
        )
    return {"violations": scan_result.violations, "masked": True}`,
  collibra:`# Collibra Data Governance
async def validate_lineage(self, ctx):
    \"\"\"Trace full data lineage and validate certifications\"\"\"
    lineage = await self.collibra.get_lineage(
        asset_id=ctx.asset_id,
        direction="BOTH",
        depth=5
    )

    # Check for uncertified upstream assets
    uncertified = [n for n in lineage.upstream
                   if n.certification != "CERTIFIED"]

    # Update quality score in catalog
    await self.collibra.update_quality_score(
        asset_id=ctx.asset_id,
        score=ctx.computed_score,
        dimensions=ctx.quality_dimensions
    )
    return {"lineage_depth": lineage.depth, "uncertified": uncertified}`,
  veeva:`# Veeva CRM Data Access
async def query_hcp_data(self, ctx):
    \"\"\"Pull HCP prescribing and field activity data\"\"\"
    hcp_data = await self.veeva.query_hcp(
        territory=ctx.territory,
        specialty=ctx.specialty_filter,
        fields=["npi","name","trx_volume","nbrx_volume"]
    )

    # Get recent field activity
    calls = await self.veeva.get_calls(
        hcp_ids=[h.npi for h in hcp_data],
        date_range=ctx.lookback_window
    )
    return {"hcp_records": len(hcp_data), "call_records": len(calls)}`,
  airflow:`# Apache Airflow Pipeline Control
async def manage_pipeline(self, ctx):
    \"\"\"Trigger or pause Airflow DAGs based on findings\"\"\"
    if ctx.action == "quarantine":
        # Pause downstream DAGs to stop bad data flow
        await self.airflow.pause_dag(dag_id=ctx.downstream_dag)

    # Trigger remediation DAG
    run = await self.airflow.trigger_dag(
        dag_id="izo_remediation_pipeline",
        conf={
            "source_table": ctx.table,
            "remediation_type": ctx.action,
            "agent_id": self.agent_id
        }
    )
    return {"dag_run_id": run.run_id, "status": run.state}`,
  atc:`# ATC Dashboard Integration
async def update_dashboard(self, ctx):
    \"\"\"Push metrics and alerts to ATC monitoring\"\"\"
    await self.atc.push_metric(
        dashboard="izo_agent_health",
        metrics={
            "dq_score": ctx.quality_score,
            "records_processed": ctx.record_count,
            "anomalies_detected": ctx.anomaly_count
        }
    )

    if ctx.severity in ["HIGH", "CRITICAL"]:
        await self.atc.create_alert(
            dashboard="izo_agent_health",
            title=f"Agent {self.agent_id}: {ctx.severity} issue",
            body=ctx.summary
        )
    return {"dashboard_updated": True}`,

async def notify_team(self, ctx):
    \"\"\"Send structured notifications to Slack channels\"\"\"
    blocks = [
        {"type":"header","text":f"{ctx.icon} iZO Agent Alert"},
        {"type":"section","text":f"*Agent:* {self.agent_id}\\n*Severity:* {ctx.severity}"},
        {"type":"section","text":f"*Summary:* {ctx.summary}"},
    ]

    if ctx.requires_approval:
        blocks.append({
            "type": "actions",
            "elements": [
                {"type":"button","text":"✅ Approve","action_id":"hitl_approve"},
                {"type":"button","text":"❌ Deny","action_id":"hitl_deny"}
            ]
        })

    await self.slack.chat_postMessage(
        channel=ctx.alert_channel,
        blocks=blocks
    )
    return {"notified": True, "channel": ctx.alert_channel}`,

    response = await self.http_client.request(

        headers={"Authorization": f"Bearer {ctx.token}"},

    )

  const [aiPrompt,setAiPrompt]=useState("");

  const [aiThinkingLines,setAiThinkingLines]=useState([]);
  const [aiParsedConfig,setAiParsedConfig]=useState(null);
  const [aiEditSection,setAiEditSection]=useState(null);

  /* AI Natural Language → Config parser (simulated) */
  const parseAiPrompt=(text)=>{
    const lower=text.toLowerCase();
    /* Detect persona */
    let personaId="dq_eng",persona="Data Quality Engineer",icon="🔍",color="#1E82BD";
    if(lower.match(/govern|compliance|certif|audit|gxp|hipaa|regulatory/)){personaId="gov_spec";persona="Data Governance Specialist";icon="🛡️";color="#0A5081";}
    else if(lower.match(/entity|mdm|master data|golden record|duplicate|merge|hcp|hco|resolution/)){personaId="master_arch";persona="Master Data Architect";icon="🔗";color="#3A9BD5";}
    else if(lower.match(/analytic|kpi|insight|forecast|trx|nbrx|territory|drift|predict/)){personaId="intel_analyst";persona="Decision Intelligence Analyst";icon="📊";color="#28426D";}
    else if(lower.match(/monitor|health|sla|uptime|observab|reliab|pipeline status/)){personaId="rel_eng";persona="Data Reliability Engineer";icon="👁️";color="#5BA4CF";}
    /* Detect name */
    let name=persona.replace("Specialist","Agent").replace("Engineer","Agent").replace("Architect","Agent").replace("Analyst","Agent");
    const nameMatch=text.match(/(?:create|build|set up|make|need)\s+(?:a|an)?\s*["""]?([^""".,!?]+?)["""]?\s+(?:agent|that|to|which|for)/i);
    if(nameMatch&&nameMatch[1].length<40) name=nameMatch[1].trim().replace(/^(a|an)\s+/i,"")+" Agent";
    /* Detect tools */
    const tools=[];
    if(lower.match(/snowflake|dmf|cortex|warehouse/)) tools.push("snowflake");
    if(lower.match(/monte carlo|anomal|freshness|observ/)) tools.push("montecarlo");
    if(lower.match(/reltio|mdm|entity|golden/)) tools.push("reltio");
    if(lower.match(/enkrypt|phi|pii|guardrail/)) tools.push("enkrypt");
    if(lower.match(/collibra|catalog|lineage|certif/)) tools.push("collibra");
    if(lower.match(/veeva|crm|hcp|hco|rep|field/)) tools.push("veeva");
    if(lower.match(/airflow|dag|pipeline|orchestrat/)) tools.push("airflow");
    if(lower.match(/atc|dashboard|kpi|metric/)) tools.push("atc");
    if(lower.match(/slack|notify|alert|message|team/)) tools.push("slack");
    if(tools.length===0) tools.push("snowflake","collibra","slack");
    /* Detect schedule */
    let schedule="5m";
    const schedMatch=lower.match(/every\s+(\d+)\s*(min|hour|h |m |second|day)/);
    if(schedMatch) schedule=schedMatch[1]+(schedMatch[2].startsWith("h")?"h":schedMatch[2].startsWith("d")?"d":"m");
    else if(lower.match(/hourly/)) schedule="1h";
    else if(lower.match(/daily/)) schedule="24h";
    else if(lower.match(/15\s*min/)) schedule="15m";
    /* Detect HITL */
    let hitlGate="ACT",hitlThreshold="Medium";
    if(lower.match(/all.*approval|approve.*everything|critical only|human.*all/)){hitlThreshold="Critical";}
    if(lower.match(/require.*human|need.*approv|hitl|human.*approval|must.*approv/)){hitlThreshold="High";}
    if(lower.match(/before.*quarant|approv.*before|before.*block|before.*delete/)){hitlGate="ACT";}
    if(lower.match(/before.*execut|approv.*tool|before.*run/)){hitlGate="TOOL USE";}
    /* Detect HITL rules */
    const hitlRules=HITL_RULE_PRESETS.map(r=>{
      const enabled=
        (r.id==="mass_action"&&lower.match(/mass|quarantine|bulk|5000|5,000/))||
        (r.id==="schema_change"&&lower.match(/schema|ddl|alter/)) ||
        (r.id==="cross_system"&&lower.match(/cross.system|sync|propagat/))||
        (r.id==="kpi_impact"&&lower.match(/kpi|trx|nbrx|metric/))||
        (r.id==="regulatory"&&lower.match(/regulat|hipaa|gxp|compliance|phi/))||
        (r.id==="pii_exposure"&&lower.match(/pii|phi|personal|mask/))||
        (r.id==="new_entity"&&lower.match(/new.*entity|create.*record|golden/))||
        (r.id==="auto_remediate"&&lower.match(/auto.*fix|auto.*remed|self.heal/));
      return {...r,enabled:!!enabled||r.id==="mass_action"||r.id==="regulatory"};
    });
    /* Build phases from templates or generate from text */
    let phases;
    if(PHASE_TEMPLATES[personaId]){
      phases=PHASE_TEMPLATES[personaId].map(ph=>({...ph,actions:[...ph.actions],toolBindings:tools.filter(tid=>{
        const t=TOOL_OPTIONS.find(x=>x.id===tid);
        return t&&t.recommended.includes(personaId);
      })}));
    } else {
      phases=[
        {phase:"PLAN",title:"Analyze & Prioritize",actions:["Scan data sources","Evaluate context","Rank by impact"],toolBindings:tools.slice(0,2)},
        {phase:"TOOL USE",title:"Execute Checks",actions:["Run primary tool checks","Validate results","Collect metrics"],toolBindings:tools},
        {phase:"REFLECT",title:"Analyze Results",actions:["Cross-reference findings","Classify severity","Generate root cause"],toolBindings:["snowflake"]},
        {phase:"ACT",title:"Remediate & Notify",actions:["Execute remediation","Send notifications","Update dashboards"],toolBindings:tools.filter(t=>["slack","airflow","atc"].includes(t))},
      ];
    }
    /* Extract custom description */
    let desc=text.length>120?text.substring(0,120)+"...":text;
    /* Detect notify channel */
    let notifyChannel="#izo-alerts";
    const chanMatch=lower.match(/#([\w-]+)/);
    if(chanMatch) notifyChannel="#"+chanMatch[1];
    /* Detect reviewers */
    let reviewers=["data-ops@novartis.com"];
    const emailMatch=text.match(/[\w.-]+@[\w.-]+\.\w+/);
    if(emailMatch) reviewers=[emailMatch[0]];

    const toolConfigs={};
    tools.forEach(tid=>{toolConfigs[tid]={verified:true,authMethod:"api_key",latency:Math.floor(Math.random()*150+50)+"ms"};});

    return {name,persona,personaId,icon,color,desc,tools,toolConfigs,phases,
      hitlGate,hitlThreshold,hitlRules,hitlNotifyChannel:notifyChannel,hitlReviewers:reviewers,
      hitlAutoApproveBelow:hitlThreshold==="Critical"?"Medium":"Low",hitlTimeoutMins:60,
      schedule,envTarget:"staging"};
  };

  /* Streaming AI "thinking" simulation */

      {icon:"🔍",text:"Identifying agent persona and domain context..."},
      {icon:"🛠️",text:"Mapping tools from description keywords..."},
      {icon:"📋",text:"Generating PLAN → TOOL USE → REFLECT → ACT phases..."},
      {icon:"🔗",text:"Binding tools to appropriate phases..."},
      {icon:"👤",text:"Configuring HITL gates and escalation rules..."},
      {icon:"⏱️",text:"Setting schedule and notification routing..."},
      {icon:"🔐",text:"Verifying tool connections and auth methods..."},
      {icon:"📊",text:"Calculating complexity score and resource requirements..."},
      {icon:"✅",text:"Configuration complete — ready for review"},
    ];
    let si=0;
    const tick=()=>{
      if(si<thinkSteps.length){
        setAiThinkingLines(prev=>[...prev,thinkSteps[si]]);
        si++;
        setTimeout(tick,400+Math.random()*300);
      } else {
        setTimeout(()=>{
          const config=parseAiPrompt(aiPrompt);
          setAiParsedConfig(config);
          setAiState("review");
        },500);
      }

  /* Apply AI config to form and jump to Test */

    setStep(5);
  };

  /* Apply AI config but go to specific step for editing */
  const aiEditStep=(stepNum)=>{
    if(!aiParsedConfig)return;
    setForm(aiParsedConfig);
    setMode("wizard");
    setStep(stepNum);
  };

  const u=(k,v)=>setForm(p=>({...p,[k]:v}));

  const selectPersona=(p)=>{
    u("personaId",p.id);
    u("persona",p.name);
    u("icon",p.icon);
    if(PHASE_TEMPLATES[p.id]){
      u("phases",PHASE_TEMPLATES[p.id].map(ph=>({...ph,actions:[...ph.actions],toolBindings:[]})));
    }
    /* Auto-select recommended tools */
    const recommended=TOOL_OPTIONS.filter(t=>t.recommended.includes(p.id)).map(t=>t.id);
    u("tools",recommended);
  };

  const toggleTool=(id)=>{
    setForm(p=>{
      const tools=p.tools.includes(id)?p.tools.filter(t=>t!==id):[...p.tools,id];
      const toolConfigs={...p.toolConfigs};
      if(!toolConfigs[id]) toolConfigs[id]={verified:false,authMethod:"api_key"};
      return {...p,tools,toolConfigs};
    });
  };

  const verifyTool=(id)=>{
    setForm(p=>{
      const toolConfigs={...p.toolConfigs,[id]:{...p.toolConfigs[id],verifying:true}};
      return {...p,toolConfigs};
    });
    setTimeout(()=>{
      setForm(p=>{
        const toolConfigs={...p.toolConfigs,[id]:{...p.toolConfigs[id],verified:true,verifying:false,latency:Math.floor(Math.random()*200+50)+"ms"}};
        return {...p,toolConfigs};
      });
    },1200);
  };

  const toggleHitlRule=(idx)=>{
    setForm(p=>{
      const hitlRules=[...p.hitlRules];
      hitlRules[idx]={...hitlRules[idx],enabled:!hitlRules[idx].enabled};
      return {...p,hitlRules};
    });
  };

  const updatePhaseAction=(pi,ai,val)=>{
    setForm(p=>{
      const phases=[...p.phases];
      phases[pi]={...phases[pi],actions:[...phases[pi].actions]};
      phases[pi].actions[ai]=val;
      return {...p,phases};
    });
  };

  const addPhaseAction=(pi)=>{
    setForm(p=>{
      const phases=[...p.phases];
      phases[pi]={...phases[pi],actions:[...phases[pi].actions,""]};
      return {...p,phases};
    });
  };

  const removePhaseAction=(pi,ai)=>{
    setForm(p=>{
      const phases=[...p.phases];
      const actions=[...phases[pi].actions];
      if(actions.length>1){actions.splice(ai,1);phases[pi]={...phases[pi],actions};}
      return {...p,phases};
    });
  };

  const bindToolToPhase=(pi,toolId)=>{
    setForm(p=>{
      const phases=[...p.phases];
      const bindings=[...(phases[pi].toolBindings||[])];
      if(bindings.includes(toolId))bindings.splice(bindings.indexOf(toolId),1);
      else bindings.push(toolId);
      phases[pi]={...phases[pi],toolBindings:bindings};
      return {...p,phases};
    });
  };

  const runTest=()=>{
    setTestState("running");setTestPhase(0);setTestLogs([]);setTestMetrics(null);
    const phases=form.phases;
    const scenario=TEST_SCENARIOS[form.personaId]||TEST_SCENARIOS.dq_eng;
    let i=0;
    let totalLatency=0;
    const addLog=(phase,msg,status,detail)=>{
      setTestLogs(prev=>[...prev,{ts:new Date().toLocaleTimeString(),phase,msg,status,detail:detail||null}]);
    };

    addLog("INIT",`Initializing test scenario: ${scenario.name}`,"info");
    addLog("INIT",`Loading ${scenario.synthetic_data.length} synthetic datasets...`,"info");

    setTimeout(()=>{
      scenario.synthetic_data.forEach(d=>{
        addLog("DATA",`📦 ${d.table} — ${d.records} records, ${d.freshness}, ${d.status==="healthy"?"✅ Healthy":d.status==="sla_breach"?"⚠️ SLA Breach":"🔴 "+d.status}`,"data");
      });

      const doPhase=()=>{
        const ph=phases[i];
        const phaseStart=Date.now();
        addLog(ph.phase,`▶ Starting ${ph.title||ph.phase}...`,"running");

        /* Simulate each action in the phase */
        const actions=scenario.expected_actions.filter((_,idx)=>{
          const perPhase=Math.ceil(scenario.expected_actions.length/4);
          return idx>=i*perPhase&&idx<(i+1)*perPhase;
        });

        let ai=0;
        const doAction=()=>{
          if(ai<actions.length){
            setTimeout(()=>{
              const passed=Math.random()>0.05;
              addLog(ph.phase,passed?`  ✓ ${actions[ai]}`:`  ⚠ ${actions[ai]} — retrying...`,passed?"pass":"warn");
              ai++;
              doAction();
            },400+Math.random()*300);
          } else {
            /* Phase done — check HITL gate */
            const latency=Date.now()-phaseStart;
            totalLatency+=latency;
            if(ph.phase===form.hitlGate){
              addLog("HITL","👤 HITL gate triggered — simulating human approval...","hitl");
              setTimeout(()=>{
                addLog("HITL","✅ Human reviewer approved action (simulated, 2.3s response)","pass");
                finishPhase();
              },800);
            } else {
              finishPhase();
            }
          }
        };

        const finishPhase=()=>{
          const toolsBound=(ph.toolBindings||[]).length;
          addLog(ph.phase,`✅ ${ph.title||ph.phase} complete — ${actions.length} actions, ${toolsBound} tools invoked`,"pass");
          i++;
          setTestPhase(i);
          if(i<phases.length){setTimeout(doPhase,500);}
          else{
            setTimeout(()=>{
              addLog("DONE","━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━","divider");
              addLog("DONE","✅ All 4 phases passed. Agent is ready for deployment.","pass");
              setTestMetrics({
                totalActions:scenario.expected_actions.length,
                totalLatency:totalLatency,
                avgPhaseTime:Math.round(totalLatency/4),
                toolCalls:form.tools.length*2,
                hitlTriggers:1,
                memoryUsed:Math.floor(Math.random()*200+100)+"MB",
                score:Math.floor(Math.random()*10+90),
              });
              setTestState("pass");
            },500);
          }
        };

        doAction();
      };

      setTimeout(doPhase,600);
    },800);
  };

  const DEPLOY_STAGES=[
    {name:"Pre-flight validation",icon:"🔍",detail:"Checking config schema, tool bindings, HITL rules..."},
    {name:"Building agent container",icon:"📦",detail:"Packaging Python runtime, dependencies, model weights..."},
    {name:"Provisioning resources",icon:"☁️",detail:"Allocating compute (2 vCPU, 4GB RAM), setting up secrets vault..."},
    {name:"Connecting tool bindings",icon:"🔗",detail:"Establishing mTLS connections to Snowflake, Monte Carlo, Collibra..."},
    {name:"Registering with iZO Orchestrator",icon:"🌐",detail:"Adding to agent mesh, configuring heartbeat, setting schedule..."},
    {name:"Running smoke test",icon:"🧪",detail:"Executing lightweight end-to-end cycle with test data..."},
    {name:"Health check & activation",icon:"💚",detail:"Verifying liveness probe, enabling production traffic..."},
  ];

  const runDeploy=()=>{
    setDeployStage(0);setDeployLogs([]);
    let si=0;
    const addDLog=(msg,status)=>setDeployLogs(prev=>[...prev,{ts:new Date().toLocaleTimeString(),msg,status}]);

    const next=()=>{
      if(si<DEPLOY_STAGES.length){
        addDLog(`${DEPLOY_STAGES[si].icon} ${DEPLOY_STAGES[si].name}: ${DEPLOY_STAGES[si].detail}`,"running");
        setTimeout(()=>{
          addDLog(`  ✓ ${DEPLOY_STAGES[si].name} — complete`,"pass");
          si++;setDeployStage(si);
          next();
        },1000+Math.random()*800);
      } else {
        setTimeout(()=>{
          addDLog("🎉 Agent deployed successfully to "+deployEnv,"done");
          setDeployed(true);
        },600);
      }
    };
    next();
  };

      <label style={{display:"block",fontSize:11,fontWeight:600,color:C.heading,marginBottom:5,textTransform:"uppercase",letterSpacing:.5}}>{label}</label>
      {area?
        <textarea value={value} onChange={e=>onChange(e.target.value)} placeholder={placeholder} style={{width:"100%",padding:"10px 14px",borderRadius:8,border:`1px solid ${C.border}`,fontSize:13,fontFamily:mono?"'JetBrains Mono',monospace":"inherit",color:C.text,background:"#FAFBFC",resize:"vertical",minHeight:80,outline:"none"}}/>
        :<input value={value} onChange={e=>onChange(e.target.value)} placeholder={placeholder} style={{width:"100%",padding:"10px 14px",borderRadius:8,border:`1px solid ${C.border}`,fontSize:13,fontFamily:mono?"'JetBrains Mono',monospace":"inherit",color:C.text,background:"#FAFBFC",outline:"none"}}/>
      }
    </div>

  return (
    <div><TopBar crumbs={["iZO Platform","Agent Creator"]}/>
    <div style={{padding:28}}>

      {/* ═══ MODE CHOOSER (entry screen) ═══ */}
      {mode===null&&(

          <div style={{textAlign:"center",marginBottom:32}}>

          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:20,maxWidth:860,margin:"0 auto"}}>

            <div onClick={()=>setMode("ai")} style={{padding:32,borderRadius:16,border:`2px solid ${C.primary}44`,background:`linear-gradient(135deg,${C.primaryBg},#fff)`,cursor:"pointer",transition:"all .2s",position:"relative",overflow:"hidden"}}
              onMouseEnter={e=>{e.currentTarget.style.borderColor=C.primary;e.currentTarget.style.transform="translateY(-2px)";e.currentTarget.style.boxShadow=`0 8px 30px ${C.primary}22`}}
              onMouseLeave={e=>{e.currentTarget.style.borderColor=C.primary+"44";e.currentTarget.style.transform="translateY(0)";e.currentTarget.style.boxShadow="none"}}>
              <div style={{position:"absolute",top:12,right:12,padding:"4px 10px",borderRadius:6,background:`linear-gradient(135deg,${C.primary},#8B5CF6)`,fontSize:9,fontWeight:700,color:"#fff",letterSpacing:.5}}>✨ RECOMMENDED</div>
              <div style={{width:64,height:64,borderRadius:16,background:`linear-gradient(135deg,${C.primary}20,#8B5CF620)`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:32,marginBottom:16}}>🧠</div>
              <div style={{fontWeight:800,fontSize:18,color:C.heading,marginBottom:6}}>AI-Assisted Setup</div>
              <div style={{fontSize:13,color:C.muted,lineHeight:1.6,marginBottom:16}}>Describe what your agent should do in plain English. iZO AI will automatically configure the persona, tools, phases, HITL rules, and everything else.</div>
              <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                {["Natural Language","Auto-Configure","Smart Defaults","Instant Setup"].map(t=>(
                  <span key={t} style={{padding:"4px 10px",borderRadius:6,background:C.primaryBg,fontSize:10,fontWeight:600,color:C.primary}}>{t}</span>
                ))}
              </div>
            </div>

            {/* Option 2: Step-by-Step Wizard */}
            <div onClick={()=>{setMode("wizard");setStep(0)}} style={{padding:32,borderRadius:16,border:`2px solid ${C.border}`,background:C.card,cursor:"pointer",transition:"all .2s"}}
              onMouseEnter={e=>{e.currentTarget.style.borderColor=C.primary;e.currentTarget.style.transform="translateY(-2px)";e.currentTarget.style.boxShadow=`0 8px 30px ${C.primary}11`}}
              onMouseLeave={e=>{e.currentTarget.style.borderColor=C.border;e.currentTarget.style.transform="translateY(0)";e.currentTarget.style.boxShadow="none"}}>
              <div style={{width:64,height:64,borderRadius:16,background:"#EDF2F7",display:"flex",alignItems:"center",justifyContent:"center",fontSize:32,marginBottom:16}}>🔧</div>
              <div style={{fontWeight:800,fontSize:18,color:C.heading,marginBottom:6}}>Step-by-Step Wizard</div>
              <div style={{fontSize:13,color:C.muted,lineHeight:1.6,marginBottom:16}}>Manually configure every detail through a 7-step guided wizard. Choose persona, select tools, define phases, set HITL rules, test, and deploy.</div>
              <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                {["Full Control","7 Steps","Granular Config","Advanced Options"].map(t=>(
                  <span key={t} style={{padding:"4px 10px",borderRadius:6,background:"#EDF2F7",fontSize:10,fontWeight:600,color:C.muted}}>{t}</span>
                ))}
              </div>
            </div>
          </div>
        </div>
      )}

      {/* ═══ AI-ASSISTED MODE ═══ */}
      {mode==="ai"&&(
        <div style={{animation:"fadeUp .3s ease-out"}}>
          <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:24}}>
            <button onClick={()=>{setMode(null);setAiState("idle");setAiThinkingLines([]);setAiParsedConfig(null)}} style={{padding:"6px 14px",borderRadius:6,background:"#EDF2F7",color:C.muted,fontWeight:600,fontSize:12}}>← Back</button>
            <div>
              <h2 style={{fontSize:20,fontWeight:700,color:C.heading,margin:0,display:"flex",alignItems:"center",gap:8}}>🧠 AI-Assisted Agent Creator</h2>
              <p style={{fontSize:12,color:C.muted,marginTop:2}}>Describe your agent in natural language and let iZO AI do the rest</p>
            </div>
          </div>

          {aiState==="idle"&&(
            <div>
              {/* Prompt Input */}
              <div style={{background:C.card,borderRadius:14,border:`1px solid ${C.primary}33`,padding:24,marginBottom:16}}>
                <div style={{fontWeight:700,fontSize:14,color:C.heading,marginBottom:4,display:"flex",alignItems:"center",gap:6}}>
                  <span style={{fontSize:16}}>✍️</span> Describe Your Agent
                </div>
                <div style={{fontSize:11,color:C.muted,marginBottom:14}}>Tell iZO what the agent should monitor, which tools it needs, when to alert, and any approval requirements. Be as detailed as you like.</div>
                <textarea value={aiPrompt} onChange={e=>setAiPrompt(e.target.value)} placeholder={"Describe your agent here...\n\nExample: Create an agent that monitors our IQVIA data feeds using Snowflake and Monte Carlo, checks for quality anomalies every 5 minutes, and notifies the team on #data-ops Slack channel when issues are found. Require human approval before quarantining more than 5000 records."}
                  style={{width:"100%",padding:16,borderRadius:10,border:`2px solid ${aiPrompt.length>20?C.primary+"44":C.border}`,fontSize:14,color:C.text,background:"#FAFBFC",resize:"vertical",minHeight:150,outline:"none",lineHeight:1.6,fontFamily:"inherit",transition:"border-color .2s"}}/>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginTop:14}}>
                  <div style={{fontSize:11,color:aiPrompt.length>20?C.success:C.muted}}>{aiPrompt.length} chars {aiPrompt.length>20?"✓":""}</div>
                  <button onClick={runAiParse} disabled={aiPrompt.length<20} style={{padding:"12px 32px",borderRadius:8,background:aiPrompt.length>=20?`linear-gradient(135deg,${C.primary},#8B5CF6)`:"#D9E2EC",color:"#fff",fontWeight:700,fontSize:14,boxShadow:aiPrompt.length>=20?`0 4px 16px ${C.primary}33`:"none"}}>
                    🧠 Generate Agent Configuration
                  </button>
                </div>
              </div>

              {/* Example Prompts */}
              <div style={{background:C.card,borderRadius:14,border:`1px solid ${C.border}`,padding:20}}>
                <div style={{fontWeight:700,fontSize:13,color:C.heading,marginBottom:12,display:"flex",alignItems:"center",gap:6}}>💡 Example Prompts <span style={{fontSize:10,fontWeight:400,color:C.muted}}>— click to use</span></div>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
                  {AI_PROMPT_EXAMPLES.map((ex,i)=>(
                    <div key={i} onClick={()=>setAiPrompt(ex.prompt)} style={{padding:14,borderRadius:10,border:`1px solid ${aiPrompt===ex.prompt?C.primary:C.border}`,background:aiPrompt===ex.prompt?C.primaryBg:"#FAFBFC",cursor:"pointer",transition:"all .15s"}}
                      onMouseEnter={e=>{if(aiPrompt!==ex.prompt)e.currentTarget.style.borderColor=C.primary+"66"}}
                      onMouseLeave={e=>{if(aiPrompt!==ex.prompt)e.currentTarget.style.borderColor=C.border}}>
                      <div style={{fontWeight:700,fontSize:12,color:aiPrompt===ex.prompt?C.primary:C.heading,marginBottom:4}}>{ex.title}</div>
                      <div style={{fontSize:10,color:C.muted,lineHeight:1.5,display:"-webkit-box",WebkitLineClamp:3,WebkitBoxOrient:"vertical",overflow:"hidden"}}>{ex.prompt}</div>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}

          {/* AI Thinking / Streaming Parse */}
          {aiState==="thinking"&&(
            <div style={{background:C.card,borderRadius:14,border:`1px solid ${C.primary}44`,padding:24}}>
              <div style={{fontWeight:700,fontSize:16,color:C.heading,marginBottom:16,display:"flex",alignItems:"center",gap:8}}>
                <span style={{animation:"spin 2s linear infinite",display:"inline-block",fontSize:20}}>🧠</span>
                iZO AI is configuring your agent...
              </div>
              <div style={{background:"#F8FAFC",borderRadius:10,padding:16,border:`1px solid ${C.border}`}}>
                {aiThinkingLines.map((line,i)=>(
                  <div key={i} style={{display:"flex",alignItems:"center",gap:10,padding:"8px 0",borderBottom:`1px solid ${C.border}22`,animation:`fadeUp .3s ease-out ${i*.04}s both`}}>
                    <span style={{fontSize:16}}>{line.icon}</span>
                    <span style={{fontSize:13,color:i===aiThinkingLines.length-1?C.primary:C.success,fontWeight:i===aiThinkingLines.length-1?600:400}}>
                      {line.text}

                    {i<aiThinkingLines.length-1&&<span style={{marginLeft:"auto",color:C.success,fontSize:12}}>✓</span>}
                    {i===aiThinkingLines.length-1&&<span style={{marginLeft:"auto",animation:"pulse 1s infinite",width:8,height:8,borderRadius:"50%",background:C.primary}}/>}
                  </div>
                ))}
              </div>
              {/* User's original prompt, dimmed */}
              <div style={{marginTop:16,padding:12,borderRadius:8,background:"#F1F5F9",border:`1px solid ${C.border}`,fontSize:11,color:C.muted,lineHeight:1.5,fontStyle:"italic",maxHeight:60,overflow:"hidden"}}>
                "{aiPrompt.substring(0,200)}{aiPrompt.length>200?"...":""}"

          {/* AI Review — Parsed Config */}
          {aiState==="review"&&aiParsedConfig&&(
            <div>
              <div style={{background:`linear-gradient(135deg,${C.primaryBg},#F0F0FF)`,borderRadius:14,border:`1px solid ${C.primary}33`,padding:20,marginBottom:16,display:"flex",alignItems:"center",gap:14}}>
                <div style={{width:48,height:48,borderRadius:12,background:`${aiParsedConfig.color}15`,border:`2px solid ${aiParsedConfig.color}44`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:24}}>{aiParsedConfig.icon}</div>
                <div style={{flex:1}}>
                  <div style={{fontWeight:800,fontSize:18,color:C.heading}}>{aiParsedConfig.name}</div>
                  <div style={{fontSize:12,color:aiParsedConfig.color,fontWeight:600}}>{aiParsedConfig.persona}</div>
                </div>
                <div style={{display:"flex",gap:8}}>
                  <button onClick={applyAiConfig} style={{padding:"10px 28px",borderRadius:8,background:`linear-gradient(135deg,${C.success},#059669)`,color:"#fff",fontWeight:700,fontSize:13,boxShadow:"0 4px 14px rgba(16,185,129,.25)"}}>✅ Accept & Test</button>
                  <button onClick={()=>{setAiState("idle")}} style={{padding:"10px 20px",borderRadius:8,background:"#EDF2F7",color:C.muted,fontWeight:600,fontSize:13}}>✏️ Edit Prompt</button>
                </div>
              </div>

              {/* Parsed Config Grid */}
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:16,marginBottom:16}}>
                {/* Left: Agent Details */}
                <div style={{background:C.card,borderRadius:14,border:`1px solid ${C.border}`,overflow:"hidden"}}>
                  <div style={{padding:"12px 18px",borderBottom:`1px solid ${C.border}`,background:"#F8FAFC",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                    <span style={{fontWeight:700,fontSize:13,color:C.heading}}>🤖 Agent Configuration</span>
                    <button onClick={()=>aiEditStep(1)} style={{fontSize:10,color:C.primary,fontWeight:600,background:"none",border:"none",cursor:"pointer",padding:"4px 8px",borderRadius:4}}>Edit ✎</button>
                  </div>
                  <div style={{padding:16}}>
                    <div style={{display:"grid",gap:8,fontSize:12}}>
                      {[
                        {l:"Name",v:aiParsedConfig.name},
                        {l:"Persona",v:aiParsedConfig.persona},
                        {l:"Schedule",v:`Every ${aiParsedConfig.schedule}`},
                        {l:"Description",v:aiParsedConfig.desc},
                      ].map((item,i)=>(
                        <div key={i} style={{display:"flex",gap:8}}>
                          <span style={{fontSize:10,color:C.muted,minWidth:70,textTransform:"uppercase",fontWeight:600,paddingTop:2}}>{item.l}</span>

                  </div>

                {/* Right: Tools */}
                <div style={{background:C.card,borderRadius:14,border:`1px solid ${C.border}`,overflow:"hidden"}}>
                  <div style={{padding:"12px 18px",borderBottom:`1px solid ${C.border}`,background:"#F8FAFC",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                    <span style={{fontWeight:700,fontSize:13,color:C.heading}}>🔗 Connected Tools ({aiParsedConfig.tools.length})</span>
                    <button onClick={()=>aiEditStep(2)} style={{fontSize:10,color:C.primary,fontWeight:600,background:"none",border:"none",cursor:"pointer",padding:"4px 8px",borderRadius:4}}>Edit ✎</button>
                  </div>
                  <div style={{padding:12}}>
                    <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
                      {aiParsedConfig.tools.map(tid=>{
                        const t=TOOL_OPTIONS.find(x=>x.id===tid);
                        return t?(
                          <div key={tid} style={{display:"flex",alignItems:"center",gap:6,padding:"6px 12px",borderRadius:8,background:C.primaryBg,border:`1px solid ${C.primary}22`}}>

                            <span style={{fontSize:11,fontWeight:600,color:C.primary}}>{t.name}</span>
