<script type="text/babel">
const {useState,useEffect,useRef,useMemo,Fragment}=React;

/* ▓▓ SECTION:TOKENS ▓▓ */
/* ══ IMPROZO DESIGN TOKENS — extracted from improzo.com ══ */
const C={
  sidebar:"#0A5081",       /* Improzo dark navy */
  sidebarDark:"#083D63",   /* Deeper navy for footer */
  primary:"#1E82BD",       /* Improzo brand blue - buttons/CTAs */

  primaryDark:"#0A5081",   /* Dark blue sections */
  primaryBg:"#E8F4FD",     /* Light blue background tint */
  heading:"#28426D",       /* Dark blue for headings */
  accent:"#1E82BD",        /* Same brand blue as accent */

  card:"#FFFFFF",
  text:"#333333",          /* Improzo body text */

  light:"#999999",         /* Light gray text */

  warn:"#F59E0B",warnBg:"#FFFBEB",
  error:"#EF4444",errorBg:"#FEF2F2",
  info:"#1E82BD",infoBg:"#E8F4FD",
  hitl:"#1E82BD",          /* HITL accent color */
  hitlBg:"#E8F4FD",        /* HITL background */
  hitlBorder:"#1E82BD44",  /* HITL border */
  codeBg:"#0F172A",codeText:"#E2E8F0",codeComment:"#64748B",codeKeyword:"#7DD3FC",codeString:"#86EFAC",codeFunc:"#C4B5FD",codeNum:"#FCD34D",
};
const PHASE_COLORS={"PLAN":"#8B5CF6","TOOL USE":"#1E82BD","REFLECT":"#F59E0B","ACT":"#10B981"};
const PHASE_ICONS={"PLAN":"🧠","TOOL USE":"🔧","REFLECT":"💭","ACT":"⚡"};
const fmt$=(v)=>{const a=Math.abs(v);if(a>=1e6)return "$"+(v/1e6).toFixed(1)+"M";if(a>=1e3)return "$"+(v/1e3).toFixed(0)+"K";return "$"+Math.round(v)};
const fmtPct=(v,d=1)=>v.toFixed(d)+"%";
/* ▓▓ END:TOKENS ▓▓ */

/* ▓▓ SECTION:RNG ▓▓ */
/* Seeded RNG — all demo data is deterministic per persona; Math.random() reserved for animation jitter only */
const hashStr=(s)=>{let h=1779033703;for(let i=0;i<s.length;i++){h=Math.imul(h^s.charCodeAt(i),3432918353);h=h<<13|h>>>19}return h>>>0};
const mulberry32=(seed)=>{let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}};
const gauss=(rng)=>{let u=0,v=0;while(u===0)u=rng();while(v===0)v=rng();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)};
const pick=(rng,arr)=>arr[Math.floor(rng()*arr.length)];
/* ▓▓ END:RNG ▓▓ */

/* ▓▓ SECTION:PERSONAS ▓▓ */
/* 5 fictional pharma company personas — selector re-skins data, KPIs, plan archetype, narrative */
const PERSONAS=[
  {id:"vertanis",name:"Vertanis Pharma",initials:"VP",type:"Big Pharma — Primary Care",typeShort:"Primary Care",reps:812,roleLabel:"Sales Reps",
   products:["Cardiozen","Lipidra"],metric:"TRx",attainLabel:"TRx Attainment",color:"#1E82BD",launch:false,
   plan:{archetype:"goalAttainment",freq:"Quarterly",threshold:90,thresholdPay:50,accelerator:2.0,excellence:110,cap:200,ti:18500},
   sigma:.11,bias:"lowBaseline",lumpy:false,cycleStage:4,payNoise:30,
   story:"Goal-setting bias against low-baseline territories is suppressing fair payout for 11% of the field",
   nudge:{p4p:2,dist:0,curve:0,diff:-4,fair:-22,budget:2,cmplx:-4,comp:0}},
  {id:"oncovia",name:"Oncovia Therapeutics",initials:"OT",type:"Specialty — Oncology KAM",typeShort:"Oncology",reps:124,roleLabel:"Key Account Managers",
   products:["Veltrazia"],metric:"Volume + MBO",attainLabel:"Blended Attainment (60% MBO / 40% Vol)",color:"#7C3AED",launch:false,
   plan:{archetype:"mboHybrid",freq:"Quarterly",threshold:85,thresholdPay:55,accelerator:1.6,excellence:112,cap:175,ti:24000,mboWeight:.6},
   sigma:.09,bias:"none",lumpy:false,cycleStage:5,payNoise:4,
   story:"Healthy plan — MBO scoring inflation is the one watch-item (92% of KAMs scored ≥95 on MBOs)",
   nudge:{p4p:4,dist:10,curve:8,diff:-2,fair:8,budget:6,cmplx:-2,comp:6}},
  {id:"neurelis",name:"Neurelis Bio",initials:"NB",type:"Launch Biotech — CNS",typeShort:"Launch",reps:96,roleLabel:"Launch Reps",
   products:["Nexavio"],metric:"NBRx",attainLabel:"NBRx vs Launch Goal",color:"#0D9488",launch:true,
   plan:{archetype:"rankBased",freq:"Monthly",threshold:80,thresholdPay:40,accelerator:2.5,excellence:120,cap:250,ti:15000,sigmaPct:24,
     tiers:[250,205,170,145,120,100,82,65,52,40]},
   sigma:.24,bias:"opportunity",lumpy:false,cycleStage:2,payNoise:14,
   story:"Rank-based plan is driving differentiation by design — but 9 territories still have zero NBRx activation",
   nudge:{p4p:-8,dist:-30,curve:-24,diff:14,fair:-28,budget:-34,cmplx:2,comp:-12}},
  {id:"auralys",name:"Auralys Rare",initials:"AR",type:"Rare Disease — Account Model",typeShort:"Rare Disease",reps:38,roleLabel:"Account Directors",
   products:["Auragen"],metric:"Milestones",attainLabel:"Account Milestone Completion",color:"#BE185D",launch:false,
   plan:{archetype:"accountMBO",freq:"Semi-Annual",threshold:70,thresholdPay:40,accelerator:1.5,excellence:115,cap:180,ti:32000,base:40,
     milestones:[{at:70,add:30},{at:90,add:30},{at:100,add:25},{at:115,add:30}]},
   sigma:.17,bias:"none",lumpy:true,cycleStage:6,payNoise:26,
   story:"Lumpy account outcomes make payouts cliff-heavy — 5 ADs missed a milestone by <3 points",
   nudge:{p4p:-14,dist:-26,curve:-30,diff:0,fair:2,budget:-10,cmplx:-14,comp:0}},
  {id:"genovex",name:"Genovex Labs",initials:"GL",type:"Generics — Portfolio GM",typeShort:"Generics",reps:210,roleLabel:"Portfolio Reps",
   products:["240-SKU Portfolio"],metric:"GM",attainLabel:"Gross Margin vs Plan",color:"#B45309",launch:false,
   plan:{archetype:"gmCommission",freq:"Monthly",threshold:0,thresholdPay:0,accelerator:1.0,excellence:120,cap:300,ti:9500,floor:35,rate:1.0},
   sigma:.14,bias:"none",lumpy:false,cycleStage:3,payNoise:6,
   story:"GM-commission floor pays 35% to the bottom decile regardless of margin — $310K/yr in unearned floor payments",
   nudge:{p4p:0,dist:-16,curve:-18,diff:4,fair:0,budget:-16,cmplx:6,comp:-8}},
];
/* ▓▓ END:PERSONAS ▓▓ */

/* ▓▓ SECTION:STATS ▓▓ */
const rank=(arr,desc=true)=>{const idx=arr.map((v,i)=>[v,i]).sort((a,b)=>desc?b[0]-a[0]:a[0]-b[0]);const r=new Array(arr.length);idx.forEach(([,i],k)=>r[i]=k+1);return r};
const spearman=(xs,ys)=>{const rx=rank(xs),ry=rank(ys),n=xs.length;let d2=0;for(let i=0;i<n;i++)d2+=(rx[i]-ry[i])**2;return 1-6*d2/(n*(n*n-1))};
const pearson=(xs,ys)=>{const n=xs.length,mx=xs.reduce((a,b)=>a+b,0)/n,my=ys.reduce((a,b)=>a+b,0)/n;let sxy=0,sx=0,sy=0;for(let i=0;i<n;i++){sxy+=(xs[i]-mx)*(ys[i]-my);sx+=(xs[i]-mx)**2;sy+=(ys[i]-my)**2}return sxy/Math.sqrt(sx*sy||1)};
const percentile=(arr,p)=>{const s=[...arr].sort((a,b)=>a-b);const i=(s.length-1)*p;const lo=Math.floor(i),hi=Math.ceil(i);return s[lo]+(s[hi]-s[lo])*(i-lo)};
const mean=(arr)=>arr.reduce((a,b)=>a+b,0)/arr.length;
const normCdf=(z)=>{const t=1/(1+.2316419*Math.abs(z));const d=.3989423*Math.exp(-z*z/2);let p=d*t*(.3193815+t*(-.3565638+t*(1.781478+t*(-1.821256+t*1.330274))));return z>0?1-p:p};
const binHistogram=(values,min,max,bins)=>{const w=(max-min)/bins;const out=Array.from({length:bins},(_,i)=>({x0:min+i*w,x1:min+(i+1)*w,n:0}));values.forEach(v=>{const i=Math.max(0,Math.min(bins-1,Math.floor((v-min)/w)));out[i].n++});return out};
/* payoutCurve(plan) → fn(attainment%) → payout% of target incentive. Dispatches on plan archetype. */
const payoutCurve=(plan)=>{
  const p=plan;
  const core=(att)=>{ /* goal-attainment archetype: threshold → linear → accelerator → excellence kicker → cap */
    if(att<p.threshold)return 0;
    if(att<100)return p.thresholdPay+(att-p.threshold)*((100-p.thresholdPay)/Math.max(1,100-p.threshold));
    let pay=att<=p.excellence?100+(att-100)*p.accelerator:100+(p.excellence-100)*p.accelerator+(att-p.excellence)*p.accelerator*1.5;
    return Math.min(p.cap,pay);
  };
  if(p.archetype==="rankBased")return(att)=>{const pct=normCdf((att-100)/(p.sigmaPct||24));const d=Math.min(9,Math.max(0,Math.floor((1-pct)*10)));return p.tiers[d]};
  if(p.archetype==="gmCommission")return(att)=>Math.max(p.floor,Math.min(p.cap,att*p.rate));
  if(p.archetype==="accountMBO")return(att)=>{let pay=att>=p.threshold?p.base:p.base*.5;p.milestones.forEach(m=>{if(att>=m.at)pay+=m.add});return Math.min(p.cap,pay)};
  if(p.archetype==="mboHybrid")return(att)=>{const mbo=Math.max(60,Math.min(118,100+(att-100)*.45));return p.mboWeight*mbo+(1-p.mboWeight)*core(att)};
  return core;
};
/* Expected cost of a plan against an attainment sample, annualized across the full field */
const costOfPlan=(plan,atts,reps)=>{const curve=payoutCurve(plan);const m=mean(atts.map(a=>curve(a)));return m/100*plan.ti*reps};
/* Monte Carlo over goal-scenario draws — precomputed at DATAGEN, screen animation is reveal-only */
const monteCarlo=(plan,sigma,rng,n=500)=>{
  const curve=payoutCurve(plan);const draws=[];
  for(let i=0;i<n;i++)draws.push(100+gauss(rng)*sigma*100);
  const pT=draws.filter(a=>a>=plan.threshold).length/n,p100=draws.filter(a=>a>=100).length/n,pE=draws.filter(a=>a>=plan.excellence).length/n;
  const payouts=draws.map(curve);
  return {pThreshold:pT,pTarget:p100,pExcellence:pE,meanPayout:mean(payouts),bins:binHistogram(draws,40,160,24),draws:draws.slice(0,60)};
};
/* ▓▓ END:STATS ▓▓ */

/* ▓▓ SECTION:DATAGEN ▓▓ */
const FIRSTS=["Maya","James","Priya","Daniel","Sofia","Marcus","Elena","Ryan","Aisha","Tom","Nina","Carlos","Grace","Kevin","Lara","Omar","Jenna","Derek","Tara","Sam","Ivy","Noah","Zara","Felix","Dana"];
const LASTS=["Kapoor","Whitfield","Chen","Moreau","Delgado","Okafor","Lindqvist","Harrington","Patel","Brooks","Tanaka","Rivera","Sloane","Novak","Ferreira","Quinn","Marsh","Iyer","Bauer","Cole"];
const REGIONS=[
  {r:"Northeast",d:["Boston","NY Metro","Philadelphia"]},
  {r:"Southeast",d:["Atlanta","Miami","Carolinas"]},
  {r:"Midwest",d:["Chicago","Twin Cities","Ohio Valley"]},
  {r:"South Central",d:["Dallas","Houston","Gulf Coast"]},
  {r:"West",d:["SoCal","Bay Area","Pacific NW"]},
];
const CYCLE_STAGES=["Data Lock","Validation","Calc Run","Shadow Audit","QC","HITL Approval","Statements","Payroll Feed"];
const DIST_FLAGS=["Legacy guarantee","Windfall account","Quota error"];

const buildPersonaData=(pid)=>{
  const ps=PERSONAS.find(p=>p.id===pid);
  const rng=mulberry32(hashStr("izo-ic-"+pid));
  const curve=payoutCurve(ps.plan);
  /* ── 100 territory rows, fixed draw order ── */
  const rows=[];
  for(let i=0;i<100;i++){
    const reg=REGIONS[i%5],district=reg.d[Math.floor(i/5)%3];
    const rep=FIRSTS[Math.floor(rng()*FIRSTS.length)]+" "+LASTS[Math.floor(rng()*LASTS.length)];
    const tenureYrs=Math.round((rng()*13+.5)*10)/10;
    const baselineVol=Math.round(2200+rng()*7800);
    const marketOpportunity=Math.round((40+rng()*60));
    let att=100+gauss(rng)*ps.sigma*100;
    if(ps.bias==="lowBaseline"&&baselineVol<3900)att-=6.5;          /* Vertanis story: biased goals on low-baseline territories */
    if(ps.bias==="opportunity"&&marketOpportunity<52)att-=9;        /* Neurelis: low-opportunity territories can't ramp */
    if(ps.lumpy&&rng()<.28)att+=(rng()<.5?-1:1)*(8+rng()*26);       /* Auralys: lumpy account milestones */
    const quota=Math.round(baselineVol*(1+(marketOpportunity-65)*.004+.06));
    const actual=Math.round(quota*att/100);
    const calls=Math.round(180+rng()*420);
    const callPlanAdherence=Math.round(58+rng()*40);
    const reach=Math.round(52+rng()*44);
    const freq=Math.round((1.4+rng()*3.2)*10)/10;
    const tierAShare=Math.round((25+rng()*52));
    const workloadIdx=Math.round((0.62+rng()*0.92)*100)/100;
    let payoutPct=curve(att)+gauss(rng)*ps.payNoise;                /* admin noise (splits, adjustments) — persona-tuned so ρ tells each story */
    if(payoutPct<0)payoutPct=0;
    rows.push({id:"T-"+String(i+1).padStart(3,"0"),rep,region:reg.r,district,tenureYrs,quota,actual,
      attainment:Math.round(att*10)/10,payoutPct:Math.round(payoutPct*10)/10,payout:0,
      perfRank:0,payoutRank:0,decile:0,quadrant:"aligned",calls,callPlanAdherence,reach,freq,tierAShare,
      marketOpportunity,baselineVol,workloadIdx,flags:[]});
  }
  /* ── inject ~8% payout distortions; these SAME rows drive P4P outliers, health findings, disputes ── */
  const distorted=[];
  for(let k=0;k<8;k++){
    let idx=Math.floor(rng()*100);
    while(distorted.includes(idx))idx=Math.floor(rng()*100);
    distorted.push(idx);
    const row=rows[idx],type=DIST_FLAGS[k%3];
    if(type==="Legacy guarantee"){row.payoutPct=Math.max(row.payoutPct,128+rng()*30);row.flags.push("Legacy guarantee")}
    else if(type==="Windfall account"){row.attainment=Math.round((row.attainment+24+rng()*14)*10)/10;row.payoutPct=Math.round(curve(row.attainment)*10)/10;row.calls=Math.round(row.calls*.55);row.flags.push("Windfall account")}
    else{row.attainment=Math.round((row.attainment-16-rng()*8)*10)/10;row.payoutPct=Math.round(Math.max(0,curve(row.attainment))*10)/10;row.flags.push("Quota error")}
  }
  /* ── ranks, deciles, quadrants, dollar payouts ── */
  const atts=rows.map(r=>r.attainment),pays=rows.map(r=>r.payoutPct);
  const pr=rank(atts),yr=rank(pays);
  const perQ=ps.plan.freq==="Quarterly"?4:ps.plan.freq==="Monthly"?12:2;
  rows.forEach((r,i)=>{
    r.perfRank=pr[i];r.payoutRank=yr[i];r.decile=Math.min(10,Math.ceil(pr[i]/10));
    const gap=r.payoutRank-r.perfRank;
    r.quadrant=r.flags.length?"review":gap<=-18?"overpaid":gap>=18?"underpaid":"aligned";
    if(r.flags.includes("Legacy guarantee"))r.quadrant="overpaid";
    if(r.flags.includes("Quota error"))r.quadrant="underpaid";
    r.payout=Math.round(ps.plan.ti/perQ*r.payoutPct/100);
  });
  const rho=Math.round(spearman(atts,pays)*1000)/1000;
  /* ── health check: 8 scored dimensions, data-derived + persona nudges ── */
  const clamp=(v)=>Math.max(8,Math.min(98,Math.round(v)));
  const pctMid=rows.filter(r=>r.attainment>=ps.plan.threshold&&r.payoutPct<ps.plan.cap).length;
  const spread=(percentile(pays,.9)-percentile(pays,.1))/Math.max(1,percentile(pays,.5));
  const fairCorr=pearson(rows.map(r=>r.baselineVol),atts);
  const tenCorr=pearson(rows.map(r=>r.tenureYrs),atts);
  const sizeCorr=pearson(rows.map(r=>r.quota),atts);
  const capped=rows.filter(r=>r.payoutPct>=ps.plan.cap-.5).length;
  const below=rows.filter(r=>r.payoutPct<=0.5).length;
  const util=mean(pays)/100;
  const n=ps.nudge;
  const dims=[
    {id:"p4p",label:"Pay-for-Performance Alignment",icon:"🎯",link:"p4p",score:clamp(rho*100+n.p4p),
     metric:"ρ = "+rho.toFixed(2)},
    {id:"dist",label:"Payout Distribution vs Design",icon:"📊",link:"p4p",score:clamp(pctMid+n.dist),
     metric:capped+"% capped · "+below+"% at zero"},
    {id:"curve",label:"Attainment Curve Health",icon:"📈",link:"studio",score:clamp(82+n.curve-(capped>8?10:0)),
     metric:"kink @ "+ps.plan.excellence+"%"},
    {id:"diff",label:"Differentiation & Motivation",icon:"⚡",link:"p4p",score:clamp(spread*88+n.diff),
     metric:"top:median spread "+spread.toFixed(2)+"×"},
    {id:"fair",label:"Goal Fairness",icon:"⚖️",link:"goals",score:clamp(86-Math.abs(fairCorr)*120+n.fair),
     metric:"baseline corr r="+fairCorr.toFixed(2)},
    {id:"budget",label:"Budget Utilization",icon:"💰",link:"command",score:clamp(96-Math.abs(util-1)*160+n.budget),
     metric:fmtPct(util*100,0)+" of target spend"},
    {id:"cmplx",label:"Plan Complexity",icon:"🧩",link:"studio",score:clamp(88+n.cmplx),
     metric:ps.plan.archetype==="mboHybrid"?"7 moving parts":"4 moving parts"},
    {id:"comp",label:"Compliance & Audit Readiness",icon:"🛡️",link:"govern",score:clamp(92+n.comp),
     metric:"99.97% shadow-calc parity"},
  ];
  dims.forEach(d=>{d.status=d.score>=80?"good":d.score>=60?"warn":"risk"});
  const overall=Math.round(dims.reduce((a,d)=>a+d.score,0)/dims.length);
  /* ── KPIs w/ seeded sparklines ── */
  const spark=(v,vol)=>{const s=[];let x=v*(.84+rng()*.06);for(let i=0;i<8;i++){s.push(Math.round(x*10)/10);x+=v*(rng()-.42)*vol}s[7]=v;return s};
  const spendQTD=ps.plan.ti/perQ*util*ps.reps*.78;
  const pctAtGoal=rows.filter(r=>r.attainment>=100).length;
  const disputeRate=Math.round((1.4+rng()*1.6)*10)/10;

/* Shared scale helpers */
const scaleLinear=(d0,d1,r0,r1)=>{const m=(r1-r0)/((d1-d0)||1);return v=>r0+(v-d0)*m};
const niceTicks=(min,max,count=5)=>{const span=max-min||1;const step0=span/count;const mag=Math.pow(10,Math.floor(Math.log10(step0)));const norm=step0/mag;const step=(norm<1.5?1:norm<3?2:norm<7?5:10)*mag;const lo=Math.ceil(min/step)*step;const out=[];for(let v=lo;v<=max+1e-9;v+=step)out.push(Math.round(v*100)/100);return out};
/* Shared tooltip wrapper — every chart gets exactly one */
const ChartBox=({w,h,tip,children,style})=>(
  <div style={{position:"relative",width:"100%",...style}}>
    <svg viewBox={`0 0 ${w} ${h}`} width="100%" style={{display:"block",overflow:"visible"}}>{children}</svg>
    {tip&&<div style={{position:"absolute",left:(tip.x*100/w)+"%",top:(tip.y*100/h)+"%",transform:"translate(-50%,-118%)",background:C.codeBg,color:"#F1F5F9",padding:"6px 10px",borderRadius:6,fontSize:11,pointerEvents:"none",whiteSpace:"nowrap",zIndex:5,boxShadow:"0 4px 14px rgba(0,0,0,.35)",lineHeight:1.5}}>{tip.c}</div>}
  </div>
);
const Axis=({ticks,pos,axis,at,grid=0,fmt=v=>v})=>(
  <g>{ticks.map(t=>axis==="x"?(
    <g key={t}>{grid>0&&<line x1={pos(t)} y1={at-grid} x2={pos(t)} y2={at} stroke="#EDF2F7" strokeWidth="1"/>}
      <text x={pos(t)} y={at+13} fontSize="9" fill="#94A3B8" textAnchor="middle">{fmt(t)}</text></g>
  ):(
    <g key={t}>{grid>0&&<line x1={at} y1={pos(t)} x2={at+grid} y2={pos(t)} stroke="#EDF2F7" strokeWidth="1"/>}
      <text x={at-6} y={pos(t)+3} fontSize="9" fill="#94A3B8" textAnchor="end">{fmt(t)}</text></g>
  ))}</g>
);
const lerpHex=(h1,h2,t)=>{const a=parseInt(h1.slice(1),16),b=parseInt(h2.slice(1),16);const c=[16,8,0].map(s=>Math.round(((a>>s&255)*(1-t))+((b>>s&255)*t)));return "#"+c.map(v=>v.toString(16).padStart(2,"0")).join("")};
const arcPath=(cx,cy,r,a0,a1)=>{const rad=a=>(a-90)*Math.PI/180;const x0=cx+r*Math.cos(rad(a0)),y0=cy+r*Math.sin(rad(a0)),x1=cx+r*Math.cos(rad(a1)),y1=cy+r*Math.sin(rad(a1));return `M ${x0.toFixed(2)} ${y0.toFixed(2)} A ${r} ${r} 0 ${a1-a0>180?1:0} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}`};
/* 240° score gauge w/ dashoffset animation; mini variant at size ≤ 80 */
const Gauge=({value,size=180,label,sub,color})=>{
  const [v,setV]=useState(0);
  useEffect(()=>{const t=setTimeout(()=>setV(value),80);return()=>clearTimeout(t)},[value]);
  const mini=size<=80;
  const col=color||(value>=80?C.success:value>=60?C.warn:C.error);
  const cx=size/2,cy=size/2,r=size*.4,sw=mini?size*.1:size*.07;
  const len=2*Math.PI*r*(240/360);
  return (
    <div style={{position:"relative",width:size,height:size*.88,flexShrink:0}}>
      <svg width={size} height={size*.88} viewBox={`0 0 ${size} ${size*.88}`}>
        <path d={arcPath(cx,cy,r,-120,120)} fill="none" stroke="#E2EBF3" strokeWidth={sw} strokeLinecap="round"/>
        <path d={arcPath(cx,cy,r,-120,120)} fill="none" stroke={col} strokeWidth={sw} strokeLinecap="round"
          strokeDasharray={len} strokeDashoffset={len*(1-Math.max(0,Math.min(100,v))/100)} style={{transition:"stroke-dashoffset 1.4s cubic-bezier(.4,0,.2,1)"}}/>
        <text x={cx} y={cy+(mini?4:2)} textAnchor="middle" fontSize={mini?size*.28:size*.21} fontWeight="800" fill={col} fontFamily="Inter">{Math.round(v)}</text>
        {!mini&&label&&<text x={cx} y={cy+size*.14} textAnchor="middle" fontSize={size*.062} fontWeight="600" fill={C.muted} fontFamily="Inter">{label}</text>}
        {!mini&&sub&&<text x={cx} y={cy+size*.225} textAnchor="middle" fontSize={size*.05} fill={C.light} fontFamily="Inter">{sub}</text>}
      </svg>
    </div>
  );
};
const Sparkline=({data,w=90,h=28,color=C.primary})=>{

  const x=scaleLinear(0,data.length-1,2,w-2),y=scaleLinear(min,max===min?min+1:max,h-3,3);
  const pts=data.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
  return <svg width={w} height={h} viewBox={`0 0 ${w} ${h}`}><polyline points={pts} fill="none" stroke={color} strokeWidth="1.8" strokeLinejoin="round" strokeLinecap="round"/><circle cx={x(data.length-1)} cy={y(data[data.length-1])} r="2.2" fill={color}/></svg>;
};

      {diagonal&&<line x1={X(xd[0])} y1={Y(yd[0])} x2={X(xd[1])} y2={Y(yd[1])} stroke="#64748B" strokeWidth="1.2" strokeDasharray="5 4" opacity=".55"/>}
      {pts.map((p,i)=>(

          style={{cursor:"pointer",animation:`fadeIn .5s ease-out ${i*.004}s both`}}
          onMouseEnter={()=>setTip({x:X(p.x),y:Y(p.y),c:<span><b>{p.label}</b>{p.sub&&<Fragment><br/>{p.sub}</Fragment>}</span>})}
          onMouseLeave={()=>setTip(null)}/>

      {xLabel&&<text x={(P.l+w-P.r)/2} y={h-3} fontSize="9.5" fontWeight="600" fill={C.muted} textAnchor="middle">{xLabel}</text>}
      {yLabel&&<text x={11} y={(P.t+h-P.b)/2} fontSize="9.5" fontWeight="600" fill={C.muted} textAnchor="middle" transform={`rotate(-90 11 ${(P.t+h-P.b)/2})`}>{yLabel}</text>}

/* Histogram + ideal-bell overlay + vertical markers */
const Histogram=({bins,w=560,h=240,bell,markers=[],color=C.primary,xFmt=v=>v,highlight})=>{
  const [tip,setTip]=useState(null);
  const P={l:34,r:12,t:16,b:28};
  const maxN=Math.max(...bins.map(b=>b.n),1);
  const X=scaleLinear(bins[0].x0,bins[bins.length-1].x1,P.l,w-P.r),Y=scaleLinear(0,maxN*1.15,h-P.b,P.t);
  const bellPts=bell?Array.from({length:80},(_,i)=>{
    const x=bins[0].x0+(bins[bins.length-1].x1-bins[0].x0)*i/79;
    return `${X(x).toFixed(1)},${Y(Math.exp(-((x-bell.mu)**2)/(2*bell.sigma**2))*maxN).toFixed(1)}`;
  }).join(" "):null;
  return (
    <ChartBox w={w} h={h} tip={tip}>
      <Axis ticks={niceTicks(bins[0].x0,bins[bins.length-1].x1,7)} pos={X} axis="x" at={h-P.b} fmt={xFmt}/>
      <Axis ticks={niceTicks(0,maxN,4).filter(t=>t>0)} pos={Y} axis="y" at={P.l} grid={w-P.l-P.r}/>
      <line x1={P.l} y1={h-P.b} x2={w-P.r} y2={h-P.b} stroke="#CBD5E1" strokeWidth="1"/>
      {bins.map((b,i)=>{
        const hl=highlight&&highlight(b);
        return <rect key={i} x={X(b.x0)+1} y={Y(b.n)} width={Math.max(1,X(b.x1)-X(b.x0)-2)} height={h-P.b-Y(b.n)} rx="2"
          fill={hl?C.warn:color} opacity={hl?.85:.65} style={{cursor:"pointer",animation:`fadeIn .4s ease-out ${i*.02}s both`}}
          onMouseEnter={()=>setTip({x:(X(b.x0)+X(b.x1))/2,y:Y(b.n),c:<span><b>{b.n}</b> territories<br/>{xFmt(Math.round(b.x0))}–{xFmt(Math.round(b.x1))}</span>})}
          onMouseLeave={()=>setTip(null)}/>;
      })}
      {bellPts&&<polyline points={bellPts} fill="none" stroke={C.heading} strokeWidth="1.8" strokeDasharray="1000" pathLength="1000" opacity=".65" style={{animation:"dashDraw 1.6s ease-out both"}}/>}
      {markers.map((m,i)=>(
        <g key={i}>
          <line x1={X(m.x)} y1={P.t} x2={X(m.x)} y2={h-P.b} stroke={m.color||C.error} strokeWidth="1.3" strokeDasharray="4 3"/>
          <text x={X(m.x)} y={P.t-4} fontSize="8.5" fontWeight="700" fill={m.color||C.error} textAnchor="middle">{m.label}</text>
        </g>
      ))}
    </ChartBox>
  );
};

        <circle key={si+"-"+i} cx={X(p.x)} cy={Y(p.y)} r="6" fill="transparent" style={{cursor:"pointer"}}
          onMouseEnter={()=>setTip({x:X(p.x),y:Y(p.y),c:<span><b>{s.name}</b><br/>{xFmt(Math.round(p.x))} → {yFmt(Math.round(p.y))}</span>})}
          onMouseLeave={()=>setTip(null)}/>

      {xLabel&&<text x={(P.l+w-P.r)/2} y={h-2} fontSize="9.5" fontWeight="600" fill={C.muted} textAnchor="middle">{xLabel}</text>}
    </ChartBox>
  );
};
/* Bars: vertical/horizontal, refLine, flag markers, optional grouped series */
const BarChart=({data,grouped,w=560,h=240,horizontal,refLine,fmt=v=>v,vFmt=v=>v,flagLabel="⚑"})=>{
  const [tip,setTip]=useState(null);
  if(grouped){
    const P={l:40,r:14,t:18,b:30};
    const maxV=Math.max(...grouped.flatMap(g=>g.series.map(s=>s.value)))*1.18;
    const Y=scaleLinear(0,maxV,h-P.b,P.t);
    const bw=(w-P.l-P.r)/grouped.length;
    return (
      <ChartBox w={w} h={h} tip={tip}>
        <Axis ticks={niceTicks(0,maxV,4)} pos={Y} axis="y" at={P.l} grid={w-P.l-P.r} fmt={vFmt}/>
        <line x1={P.l} y1={h-P.b} x2={w-P.r} y2={h-P.b} stroke="#CBD5E1" strokeWidth="1"/>
        {grouped.map((g,gi)=>{
          const n=g.series.length,sw=Math.min(26,(bw-18)/n);
          return (
            <g key={gi}>
              {g.series.map((s,si)=>(
                <rect key={si} x={P.l+gi*bw+bw/2-(n*sw)/2+si*sw+1} y={Y(s.value)} width={sw-2} height={h-P.b-Y(s.value)} rx="2.5" fill={s.color} opacity=".82"
                  style={{cursor:"pointer",animation:`fadeIn .4s ease-out ${(gi*n+si)*.04}s both`}}
                  onMouseEnter={()=>setTip({x:P.l+gi*bw+bw/2-(n*sw)/2+si*sw+sw/2,y:Y(s.value),c:<span><b>{s.name}</b><br/>{g.label}: {vFmt(s.value)}</span>})}
                  onMouseLeave={()=>setTip(null)}/>
              ))}
              <text x={P.l+gi*bw+bw/2} y={h-P.b+13} fontSize="9" fill="#94A3B8" textAnchor="middle">{g.label}</text>
            </g>
          );
        })}
        {refLine&&<g><line x1={P.l} y1={Y(refLine.value)} x2={w-P.r} y2={Y(refLine.value)} stroke={C.error} strokeWidth="1.4" strokeDasharray="6 4"/>
          <text x={w-P.r} y={Y(refLine.value)-5} fontSize="8.5" fontWeight="700" fill={C.error} textAnchor="end">{refLine.label}</text></g>}
      </ChartBox>
    );
  }
  if(horizontal){
    const P={l:118,r:44,t:8,b:8};
    const maxV=Math.max(...data.map(d=>d.value))*1.08;
    const X=scaleLinear(0,maxV,P.l,w-P.r);
    const bh=(h-P.t-P.b)/data.length;
    return (
      <ChartBox w={w} h={h} tip={tip}>
        {data.map((d,i)=>(
          <g key={i}>
            <text x={P.l-8} y={P.t+i*bh+bh/2+3} fontSize="10" fontWeight="600" fill={C.muted} textAnchor="end">{d.label}</text>
            <rect x={P.l} y={P.t+i*bh+bh*.18} width={Math.max(2,X(d.value)-P.l)} height={bh*.64} rx="3" fill={d.color||C.primary} opacity=".85"
              style={{cursor:"pointer",animation:`fadeIn .4s ease-out ${i*.05}s both`}}
              onMouseEnter={()=>setTip({x:X(d.value),y:P.t+i*bh+bh/2,c:<span><b>{d.label}</b><br/>{vFmt(d.value)}{d.sub?<Fragment><br/>{d.sub}</Fragment>:null}</span>})}
              onMouseLeave={()=>setTip(null)}/>
            <text x={X(d.value)+5} y={P.t+i*bh+bh/2+3} fontSize="9.5" fontWeight="700" fill={C.heading}>{vFmt(d.value)}{d.flag&&<tspan fill={C.error}> {flagLabel}</tspan>}</text>
          </g>
        ))}
      </ChartBox>
    );
  }
  const P={l:40,r:14,t:18,b:30};
  const maxV=Math.max(...data.map(d=>d.value))*1.18;
  const Y=scaleLinear(0,maxV,h-P.b,P.t);
  const bw=(w-P.l-P.r)/data.length;
  return (
    <ChartBox w={w} h={h} tip={tip}>
      <Axis ticks={niceTicks(0,maxV,4)} pos={Y} axis="y" at={P.l} grid={w-P.l-P.r} fmt={vFmt}/>
      <line x1={P.l} y1={h-P.b} x2={w-P.r} y2={h-P.b} stroke="#CBD5E1" strokeWidth="1"/>
      {data.map((d,i)=>(
        <g key={i}>
          <rect x={P.l+i*bw+bw*.16} y={Y(d.value)} width={bw*.68} height={h-P.b-Y(d.value)} rx="3" fill={d.color||C.primary} opacity={d.flag?.95:.78}
            style={{cursor:"pointer",animation:`fadeIn .4s ease-out ${i*.04}s both`}}
            onMouseEnter={()=>setTip({x:P.l+i*bw+bw/2,y:Y(d.value),c:<span><b>{d.label}</b>: {vFmt(d.value)}{d.sub?<Fragment><br/>{d.sub}</Fragment>:null}</span>})}
            onMouseLeave={()=>setTip(null)}/>
          {d.flag&&<text x={P.l+i*bw+bw/2} y={Y(d.value)-5} fontSize="10" fontWeight="800" fill={C.error} textAnchor="middle">{flagLabel}</text>}
          <text x={P.l+i*bw+bw/2} y={h-P.b+13} fontSize="9" fill="#94A3B8" textAnchor="middle">{fmt(d.label)}</text>
        </g>
      ))}
      {refLine&&<g><line x1={P.l} y1={Y(refLine.value)} x2={w-P.r} y2={Y(refLine.value)} stroke={C.error} strokeWidth="1.4" strokeDasharray="6 4"/>
        <text x={w-P.r} y={Y(refLine.value)-5} fontSize="8.5" fontWeight="700" fill={C.error} textAnchor="end">{refLine.label}</text></g>}
    </ChartBox>
  );
};
/* Region × metric heatmap w/ hover */
const Heatmap=({rows,cols,w=560,h=216,fmt=v=>v+"%"})=>{
  const [tip,setTip]=useState(null);
  const P={l:104,r:10,t:30,b:8};
  const all=rows.flatMap(r=>r.vals);
  const lo=Math.min(...all),hi=Math.max(...all);
  const cw=(w-P.l-P.r)/cols.length,ch=(h-P.t-P.b)/rows.length;
  return (
    <ChartBox w={w} h={h} tip={tip}>
      {cols.map((c,i)=><text key={i} x={P.l+i*cw+cw/2} y={P.t-10} fontSize="9" fontWeight="700" fill={C.muted} textAnchor="middle">{c}</text>)}
      {rows.map((r,ri)=>(
        <g key={ri}>
          <text x={P.l-8} y={P.t+ri*ch+ch/2+3} fontSize="10" fontWeight="600" fill={C.muted} textAnchor="end">{r.region}</text>
          {r.vals.map((v,ci)=>{
            const t=(v-lo)/((hi-lo)||1);
            const weak=v<lo+(hi-lo)*.22;
            return <g key={ci}>
              <rect x={P.l+ci*cw+2} y={P.t+ri*ch+2} width={cw-4} height={ch-4} rx="6"
                fill={weak?"#FDE8E8":lerpHex("#EFF6FC","#1E82BD",t*.92)} stroke={weak?C.error+"66":"transparent"} strokeWidth="1.5"
                style={{cursor:"pointer",animation:`fadeIn .4s ease-out ${(ri*cols.length+ci)*.025}s both`}}
                onMouseEnter={()=>setTip({x:P.l+ci*cw+cw/2,y:P.t+ri*ch+4,c:<span><b>{r.region}</b> · {cols[ci]}<br/>{fmt(v)}{weak?" ⚠ weak":""}</span>})}
                onMouseLeave={()=>setTip(null)}/>
              <text x={P.l+ci*cw+cw/2} y={P.t+ri*ch+ch/2+3.5} fontSize="10" fontWeight="700" fill={weak?C.error:t>.55?"#fff":C.heading} textAnchor="middle" style={{pointerEvents:"none"}}>{v}</text>
            </g>;
          })}
        </g>
      ))}
    </ChartBox>
  );
};
/* Donut w/ center label + legend chips */
const DonutChart=({segs,size=170,centerLabel,centerSub})=>{
  const [tip,setTip]=useState(null);
  const total=segs.reduce((a,s)=>a+s.value,0)||1;
  const r=size*.36,cx=size/2,cy=size/2,circ=2*Math.PI*r;
  let acc=0;
  return (
    <div style={{display:"flex",alignItems:"center",gap:16}}>
      <ChartBox w={size} h={size} tip={tip} style={{width:size,flexShrink:0}}>
        {segs.map((s,i)=>{
          const frac=s.value/total,off=acc;acc+=frac;
          return <circle key={i} cx={cx} cy={cy} r={r} fill="none" stroke={s.color} strokeWidth={size*.13}
            strokeDasharray={`${Math.max(0,frac*circ-2)} ${circ}`} strokeDashoffset={-off*circ} transform={`rotate(-90 ${cx} ${cy})`}
            style={{cursor:"pointer",transition:"stroke-width .2s"}}
            onMouseEnter={()=>setTip({x:cx,y:cy-r-8,c:<span><b>{s.label}</b>: {s.value} ({Math.round(frac*100)}%)</span>})}
            onMouseLeave={()=>setTip(null)}/>;
        })}
        <text x={cx} y={cy-1} textAnchor="middle" fontSize={size*.16} fontWeight="800" fill={C.heading}>{centerLabel}</text>
        {centerSub&&<text x={cx} y={cy+size*.1} textAnchor="middle" fontSize={size*.057} fill={C.muted}>{centerSub}</text>}
      </ChartBox>
      <div style={{display:"grid",gap:6}}>
        {segs.map((s,i)=>(
          <div key={i} style={{display:"flex",alignItems:"center",gap:7,fontSize:11,color:C.muted}}>
            <span style={{width:10,height:10,borderRadius:3,background:s.color,flexShrink:0}}/>
            <span style={{fontWeight:600,color:C.text}}>{s.label}</span><span>· {s.value}</span>
          </div>
        ))}
      </div>
    </div>
  );
};
/* Payout curve canvas: proposed solid vs current dashed over shaded attainment underlay + threshold/target/cap markers */
const CurveBuilder=({plan,base,hist,w=640,h=300})=>{
  const [tip,setTip]=useState(null);
  const P={l:46,r:16,t:20,b:32};
  const x0=plan.archetype==="gmCommission"?20:40,x1=160;
  const cur=payoutCurve(plan),basC=base?payoutCurve(base):null;
  const yMax=Math.max(plan.cap||200,base?base.cap||200:0)*1.12;
  const X=scaleLinear(x0,x1,P.l,w-P.r),Y=scaleLinear(0,yMax,h-P.b,P.t);
  const sample=(fn)=>Array.from({length:121},(_,i)=>{const a=x0+(x1-x0)*i/120;return `${X(a).toFixed(1)},${Y(Math.min(yMax,fn(a))).toFixed(1)}`}).join(" ");
  const maxN=hist?Math.max(...hist.map(b=>b.n),1):1;
  return (
    <ChartBox w={w} h={h} tip={tip}>
      {hist&&hist.map((b,i)=>(
        <rect key={i} x={X(Math.max(x0,b.x0))} y={Y(0)-((h-P.b-P.t)*.32)*(b.n/maxN)} width={Math.max(1,X(Math.min(x1,b.x1))-X(Math.max(x0,b.x0))-1)} height={((h-P.b-P.t)*.32)*(b.n/maxN)} fill={C.primary} opacity=".1"/>
      ))}
      <Axis ticks={niceTicks(x0,x1,7)} pos={X} axis="x" at={h-P.b} fmt={v=>v+"%"}/>
      <Axis ticks={niceTicks(0,yMax,5)} pos={Y} axis="y" at={P.l} grid={w-P.l-P.r} fmt={v=>v+"%"}/>
      <line x1={P.l} y1={h-P.b} x2={w-P.r} y2={h-P.b} stroke="#CBD5E1" strokeWidth="1"/>
      {plan.threshold>0&&<g><line x1={X(plan.threshold)} y1={P.t} x2={X(plan.threshold)} y2={h-P.b} stroke={C.warn} strokeWidth="1.2" strokeDasharray="4 3"/>
        <text x={X(plan.threshold)} y={P.t-6} fontSize="8.5" fontWeight="700" fill={C.warn} textAnchor="middle">THRESHOLD {plan.threshold}%</text></g>}
      <line x1={X(100)} y1={P.t} x2={X(100)} y2={h-P.b} stroke="#94A3B8" strokeWidth="1" strokeDasharray="3 3" opacity=".7"/>
      <text x={X(100)} y={h-P.b+24} fontSize="8.5" fontWeight="700" fill="#94A3B8" textAnchor="middle">TARGET</text>
      {plan.cap<yMax&&plan.archetype!=="rankBased"&&<g><line x1={P.l} y1={Y(plan.cap)} x2={w-P.r} y2={Y(plan.cap)} stroke={C.error} strokeWidth="1.2" strokeDasharray="5 4"/>
        <text x={w-P.r-4} y={Y(plan.cap)-5} fontSize="8.5" fontWeight="700" fill={C.error} textAnchor="end">CAP {plan.cap}%</text></g>}
      {basC&&<polyline points={sample(basC)} fill="none" stroke="#94A3B8" strokeWidth="1.8" strokeDasharray="6 5" opacity=".75"/>}
      <polyline points={sample(cur)} fill="none" stroke={C.primary} strokeWidth="2.6" strokeLinejoin="round" strokeDasharray="1400" pathLength="1400" style={{animation:"dashDraw 1.2s ease-out both"}}/>
      {Array.from({length:13},(_,i)=>{const a=x0+(x1-x0)*i/12;return (
        <circle key={i} cx={X(a)} cy={Y(Math.min(yMax,cur(a)))} r="7" fill="transparent" style={{cursor:"pointer"}}
          onMouseEnter={()=>setTip({x:X(a),y:Y(Math.min(yMax,cur(a))),c:<span>{Math.round(a)}% attainment<br/><b>{Math.round(cur(a))}%</b> payout{basC?<Fragment> · was {Math.round(basC(a))}%</Fragment>:null}</span>})}
          onMouseLeave={()=>setTip(null)}/>);})}
      <g transform={`translate(${P.l+10},${P.t+2})`}>
        <line x1="0" y1="4" x2="18" y2="4" stroke={C.primary} strokeWidth="2.6"/><text x="23" y="7.5" fontSize="9.5" fontWeight="600" fill={C.muted}>Proposed</text>
        {basC&&<Fragment><line x1="78" y1="4" x2="96" y2="4" stroke="#94A3B8" strokeWidth="1.8" strokeDasharray="5 4"/><text x="101" y="7.5" fontSize="9.5" fontWeight="600" fill={C.muted}>Current</text></Fragment>}
      </g>
    </ChartBox>
  );
};

      setItems(prev=>{
        const next=[{...pool[idxRef.current%pool.length],t:"just now"},...prev.map(p=>({...p,t:p.t==="just now"?"3s ago":p.t}))];

const dimNarrative=(dim,data,persona)=>{
  const ov=data.rows.filter(r=>r.quadrant==="overpaid").length,un=data.rows.filter(r=>r.quadrant==="underpaid").length;
  switch(dim.id){
    case "p4p":return {finding:`Spearman ρ between performance rank and payout rank is ${data.rho.toFixed(2)} (guardrail ≥ 0.80). ${ov} territories pay above their performance rank, ${un} below.`,
      rec:ov+un>10?"Re-credit the flagged outliers and retest before payroll lock.":"Maintain — monitor outliers at each calc run."};
    case "dist":return {finding:`${data.rows.filter(r=>r.payoutPct>=persona.plan.cap-.5).length}% of the field is capped and ${data.rows.filter(r=>r.payoutPct<=0.5).length}% earns zero — vs design intent of ~5% / ~8%.`,
      rec:"Re-shape the curve in Plan Design Studio: test cap +50pts against budget."};
    case "curve":return {finding:`The ${persona.plan.archetype==="rankBased"?"decile tier table":"accelerator ("+persona.plan.accelerator+"× above 100%)"} creates a payout kink at ${persona.plan.excellence}% attainment that concentrates ${persona.plan.freq.toLowerCase()} spend.`,
      rec:"Smooth the excellence kicker or stage it in 5-pt steps."};
    case "diff":return {finding:`Top-decile earners take ${(percentile(data.rows.map(r=>r.payoutPct),.9)/Math.max(1,percentile(data.rows.map(r=>r.payoutPct),.5))).toFixed(1)}× the median payout — ${dim.score>=80?"strong motivation signal":dim.score>=60?"moderate differentiation":"too flat to motivate top talent"}.`,
      rec:dim.score<60?"Steepen upside above 110% attainment; fund it from the sub-threshold band.":"Hold steady — differentiation is doing its job."};
    case "fair":return {finding:persona.bias==="lowBaseline"?`Territories with baseline volume <3,900 attain 6.5 pts lower on average (r=${data.goals.fairCorr.toFixed(2)}) — goals are systematically harder where baselines are small.`:persona.bias==="opportunity"?`Low-opportunity launch territories attain 9 pts lower — launch goals ignore market access reality (r=${data.goals.fairCorr.toFixed(2)}).`:`No systematic goal bias detected across baseline, size, or tenure cohorts (max |r|=${Math.max(Math.abs(data.goals.fairCorr),Math.abs(data.goals.tenCorr)).toFixed(2)}).`,
      rec:persona.bias!=="none"?"Re-weight goal allocation by market opportunity; restate affected territories.":"Keep the quarterly bias screen armed."};
    case "budget":return {finding:`Projected spend lands at ${fmtPct(data.util*100,0)} of incentive budget for ${data.cycle.period} (${fmt$(data.spendQTD)} QTD).`,
      rec:data.util>1.02?"Model a cap or decelerator in the Studio before next cycle.":data.util<.9?"Underspend risks demotivation — consider richer threshold pay.":"On plan — no action."};
    case "cmplx":return {finding:`${persona.plan.archetype==="mboHybrid"?"Blended MBO + volume scoring takes 7 inputs per KAM per period — reps model it in spreadsheets to predict pay.":"Plan resolves to "+(persona.plan.archetype==="rankBased"?"a single decile lookup":"4 parameters")+" — reps can do the math on a napkin."}`,
      rec:persona.plan.archetype==="mboHybrid"?"Cut MBO components from 5 to 3; publish a payout calculator.":"Preserve simplicity in any redesign."};
    default:return {finding:`Shadow recalculation matches the vendor system at 99.97% parity; audit trail is complete for ${persona.reps} statements. 2 region-level deltas >25bps are isolated and explained.`,
      rec:"Close the 2 open deltas before payroll feed sign-off."};
  }
};
const DimEvidence=({dim,data})=>{
  const w=190,h=40;
  if(dim.id==="p4p"){const q={aligned:0,overpaid:0,underpaid:0,review:0};data.rows.forEach(r=>q[r.quadrant]++);let x=0;
    return <svg width="100%" viewBox={`0 0 ${w} ${h}`}>{Object.entries(q).map(([k,v])=>{const seg=<rect key={k} x={x} y={14} width={v/100*w} height={12} rx="2" fill={QUAD_COLORS[k]} opacity=".8"/>;x+=v/100*w;return seg})}
      <text x="0" y="9" fontSize="8" fill={C.light}>quadrant mix</text><text x="0" y="37" fontSize="8" fill={C.light}>{q.aligned} aligned · {q.overpaid+q.underpaid+q.review} flagged</text></svg>;}
  if(dim.id==="fair"){const lo=data.rows.filter(r=>r.baselineVol<3900),hi=data.rows.filter(r=>r.baselineVol>=3900);
    const ml=mean(lo.map(r=>r.attainment)),mh=mean(hi.map(r=>r.attainment));
    return <svg width="100%" viewBox={`0 0 ${w} ${h}`}>
      <text x="0" y="9" fontSize="8" fill={C.light}>avg attainment: low vs high baseline</text>
      <rect x="0" y="13" width={(ml/130)*w} height="9" rx="2" fill={C.error} opacity=".75"/><text x={(ml/130)*w+4} y="20.5" fontSize="8.5" fontWeight="700" fill={C.error}>{ml.toFixed(1)}%</text>
      <rect x="0" y="26" width={(mh/130)*w} height="9" rx="2" fill={C.success} opacity=".75"/><text x={(mh/130)*w+4} y="33.5" fontSize="8.5" fontWeight="700" fill={C.success}>{mh.toFixed(1)}%</text></svg>;}
  if(dim.id==="dist"){const bins=binHistogram(data.rows.map(r=>r.payoutPct),0,Math.max(...data.rows.map(r=>r.payoutPct))+10,16);const mx=Math.max(...bins.map(b=>b.n),1);
    return <svg width="100%" viewBox={`0 0 ${w} ${h}`}>{bins.map((b,i)=><rect key={i} x={i*(w/16)+1} y={h-4-(b.n/mx)*(h-12)} width={w/16-2} height={(b.n/mx)*(h-12)} rx="1.5" fill={C.primary} opacity=".65"/>)}</svg>;}
  if(dim.id==="curve"){const pts=Array.from({length:50},(_,i)=>{const a=40+120*i/49;return `${(i/49*w).toFixed(1)},${(h-4-Math.min(1,data.curve(a)/260)*(h-10)).toFixed(1)}`}).join(" ");
    return <svg width="100%" viewBox={`0 0 ${w} ${h}`}><polyline points={pts} fill="none" stroke={C.primary} strokeWidth="2"/></svg>;}
  if(dim.id==="diff"){const d1=mean(data.rows.filter(r=>r.decile===1).map(r=>r.payoutPct)),d5=mean(data.rows.filter(r=>r.decile===5).map(r=>r.payoutPct)),d10=mean(data.rows.filter(r=>r.decile===10).map(r=>r.payoutPct));
    return <svg width="100%" viewBox={`0 0 ${w} ${h}`}>{[["D1",d1,C.success],["D5",d5,C.primary],["D10",d10,C.light]].map(([l,v,c],i)=>(<g key={l}><rect x={i*64} y={h-8-(v/260)*(h-16)} width="40" height={(v/260)*(h-16)} rx="2" fill={c} opacity=".8"/><text x={i*64+20} y={h-0.5} fontSize="8" fill={C.muted} textAnchor="middle">{l} · {Math.round(v)}%</text></g>))}</svg>;}
  if(dim.id==="budget")return <div style={{paddingTop:10}}><ProgressBar value={data.util*100} color={data.util>1.02?C.warn:C.success} height={9}/><div style={{fontSize:9,color:C.muted,marginTop:4}}>{fmtPct(data.util*100,0)} of budget</div></div>;
  if(dim.id==="cmplx")return <div style={{display:"flex",gap:4,flexWrap:"wrap",paddingTop:8}}>{(data.ps.plan.archetype==="mboHybrid"?["MBO ×5","Vol curve","Weights"]:data.ps.plan.archetype==="rankBased"?["Decile lookup"]:["Threshold","Curve","Accel","Cap"]).map(t=><Badge key={t} variant="neutral" small>{t}</Badge>)}</div>;

      <div style={{display:"grid",gridTemplateColumns:"1.4fr 1fr",gap:18}}>
        <SectionCard title="Goal Growth vs Market Opportunity" sub="Each dot = a territory's goal growth plotted against its real market opportunity. Red = flagged by the bias screen." pad={14}>
          <ScatterPlot pts={data.goals.growthScatter.map(p=>({x:p.x,y:p.y,c:p.flag?C.error:persona.color,big:p.flag,label:p.flag?"Flagged territory":"Territory",sub:"opportunity "+p.x+" · goal growth "+p.y+"%"}))}
            w={580} h={266} xLabel="Market opportunity index →" yLabel="Goal growth % →"/>
          <div style={{fontSize:10.5,color:C.muted,marginTop:6}}>{flagged>0?"⚠ "+flagged+" territories carry high growth asks without the market opportunity to support them.":"Growth asks track opportunity — the allocation engine is doing its job."}</div>
        </SectionCard>
        <SectionCard title="🎲 Monte Carlo Goal Attainability" sub="500 demand scenarios against the current goal set — precomputed by the Goal Setting Agent, replayed here"
          right={<button onClick={runMc} disabled={mcState==="running"} style={{padding:"8px 16px",borderRadius:8,background:mcState==="running"?C.primaryLight+"77":`linear-gradient(135deg,${C.primary},${C.primaryDark})`,color:"#fff",fontWeight:700,fontSize:11.5}}>{mcState==="running"?"⟳ Simulating…":mcState==="done"?"↻ Re-simulate":"▶ Simulate 500 scenarios"}</button>} pad={16}>
          {mcState!=="done"&&(
            <div style={{padding:"22px 6px"}}>
              <div style={{display:"flex",justifyContent:"space-between",fontSize:11,color:C.muted,marginBottom:7}}>
                <span>{mcState==="idle"?"Ready — goals, demand variance and curve are loaded":"Drawing demand scenarios…"}</span>
                <span className="mono" style={{fontWeight:700,color:C.primary}}>{mcState==="idle"?"0":Math.min(500,mcProg)} / 500</span>
              </div>
              <ProgressBar value={mcState==="idle"?0:mcProg/5} color={C.primary} height={8}/>
              {mcState==="running"&&<div style={{fontSize:10,color:C.light,marginTop:8,fontStyle:"italic"}}>sampling N(100, {Math.round(persona.sigma*100)}²) · applying {persona.plan.archetype} curve · tallying outcomes…</div>}
            </div>
          )}
          {mcState==="done"&&(
            <Fragment>
              <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:10,marginBottom:14,animation:"fadeUp .4s ease-out"}}>
                {[["P(≥ threshold)",mc.pThreshold,C.primary],["P(≥ target)",mc.pTarget,C.success],["P(≥ excellence)",mc.pExcellence,"#7C3AED"]].map(([l,p,c])=>(
                  <div key={l} style={{textAlign:"center",padding:"12px 8px",borderRadius:10,background:c+"0E",border:`1px solid ${c}33`}}>
                    <div style={{fontSize:22,fontWeight:800,color:c}}>{Math.round(p*100)}%</div>
                    <div style={{fontSize:9.5,color:C.muted,fontWeight:600,marginTop:2}}>{l}</div>
                  </div>
                ))}
              </div>
              <Histogram bins={mc.bins} w={520} h={150} color="#7C3AED" xFmt={v=>v+"%"}
                markers={[{x:persona.plan.threshold||60,label:"THR",color:C.warn},{x:100,label:"GOAL",color:"#64748B"}]}/>
              <div style={{fontSize:10.5,color:C.muted,marginTop:8,lineHeight:1.5}}>
                {mc.pTarget<.35?"⚠ Fewer than 35% of scenarios reach goal — the field will read these goals as unwinnable.":mc.pTarget>.7?"⚠ Goals are too easy — "+Math.round(mc.pTarget*100)+"% of scenarios clear target, which overpays the middle.":"✓ Goal difficulty sits in the motivational sweet spot (40–65% of scenarios reach target)."} Mean simulated payout: {Math.round(mc.meanPayout)}% of TI.
              </div>
            </Fragment>
          )}
        </SectionCard>
      </div>
    </div>
  );
};
/* ▓▓ END:SCREEN-GOALS ▓▓ */

/* ▓▓ SECTION:SCREEN-STUDIO ▓▓ */
const ARCHETYPES=[
  {id:"goalAttainment",label:"Goal Attainment",icon:"📈",desc:"Threshold → linear → accelerator → cap. The primary-care workhorse."},
  {id:"rankBased",label:"Rank-Based",icon:"🏁",desc:"Forced decile tiers. Maximum differentiation — launch favorite."},
  {id:"mboHybrid",label:"MBO Hybrid",icon:"🧬",desc:"60% MBO / 40% volume blend for KAM & specialty models."},
  {id:"accountMBO",label:"Account MBO",icon:"🏥",desc:"Milestone steps per account — rare disease & account teams."},
  {id:"gmCommission",label:"GM Commission",icon:"💹",desc:"Straight margin commission with a floor — generics portfolio."},
];
const SLIDER_RELEVANCE={goalAttainment:["threshold","thresholdPay","accelerator","excellence","cap","ti"],mboHybrid:["threshold","thresholdPay","accelerator","excellence","cap","ti"],rankBased:["cap","ti"],accountMBO:["threshold","cap","ti"],gmCommission:["cap","ti"]};
const archDefaults=(arch,base)=>{
  const p={...base,archetype:arch};
  if(arch==="rankBased"&&!p.tiers){p.tiers=[250,205,170,145,120,100,82,65,52,40];p.sigmaPct=18}
  if(arch==="accountMBO"&&!p.milestones){p.base=40;p.milestones=[{at:70,add:30},{at:90,add:30},{at:100,add:25},{at:115,add:30}]}
  if(arch==="gmCommission"){p.floor=p.floor||35;p.rate=p.rate||1.0}
  return p;
};
const PlanStudio=({persona,data,onNav})=>{
  const [plan,setPlan]=useState({...persona.plan});
  const [scen,setScen]=useState({shock:false,nocap:false,stretch:false});
  const [modal,setModal]=useState(false);
  const [submitted,setSubmitted]=useState(false);
  const upd=(k,v)=>setPlan(p=>({...p,[k]:v}));
  const effPlan=useMemo(()=>({...plan,cap:scen.nocap?400:plan.cap}),[plan,scen.nocap]);
  const impact=useMemo(()=>{
    const shift=(scen.shock?-10:0)+(scen.stretch?-5:0);
    const atts=data.rows.map(r=>r.attainment+shift);
    const cN=payoutCurve(effPlan),cC=payoutCurve(persona.plan);
    const pN=atts.map(a=>Math.max(0,cN(a))),pC=atts.map(a=>Math.max(0,cC(a)));
    const costN=mean(pN)/100*effPlan.ti/data.perQ*persona.reps,costC=mean(pC)/100*persona.plan.ti/data.perQ*persona.reps;
    const budget=persona.plan.ti/data.perQ*persona.reps;
    return {costN,costC,budget,utilN:costN/budget*100,dCost:(costN-costC)/Math.max(1,costC)*100,
      rhoN:spearman(atts,pN),rhoC:spearman(atts,pC),
      capN:pN.filter(p=>p>=effPlan.cap-.5).length,belowN:pN.filter(p=>p<=.5).length,
      capC:pC.filter(p=>p>=persona.plan.cap-.5).length,belowC:pC.filter(p=>p<=.5).length};
  },[effPlan,scen,persona,data]);
  const rel=SLIDER_RELEVANCE[plan.archetype]||[];
  const sliders=[
    {k:"threshold",label:"Payout Threshold",min:50,max:100,step:1,fmt:v=>v+"% att"},
    {k:"thresholdPay",label:"Pay at Threshold",min:0,max:100,step:5,fmt:v=>v+"% TI"},
    {k:"accelerator",label:"Accelerator Slope",min:1,max:4,step:.1,fmt:v=>v.toFixed(1)+"×"},
    {k:"excellence",label:"Excellence Point",min:100,max:140,step:1,fmt:v=>v+"% att"},
    {k:"cap",label:"Payout Cap",min:100,max:400,step:5,fmt:v=>v+"% TI"},
    {k:"ti",label:"Target Incentive",min:5000,max:50000,step:500,fmt:v=>fmt$(v)+"/yr"},
  ];
  const changed=sliders.filter(s=>plan[s.k]!==persona.plan[s.k]);
  const tile=(label,val,delta,goodWhen)=>(
    <div style={{background:C.card,borderRadius:11,border:`1px solid ${C.border}`,padding:"13px 16px"}}>
      <div style={{fontSize:10,color:C.muted,fontWeight:600}}>{label}</div>
      <div style={{fontSize:21,fontWeight:800,color:C.heading,marginTop:3}}>{val}</div>
      {delta&&<div style={{fontSize:10.5,fontWeight:700,marginTop:2,color:goodWhen?C.success:C.warn}}>{delta}</div>}
    </div>
  );
  return (
    <div style={{padding:26}}>
      <ScreenHeader title="🧪 Plan Design Studio" sub={"Reshape "+persona.name+"'s "+persona.plan.freq.toLowerCase()+" plan and watch cost, alignment and motivation react instantly — powered by the Plan Simulator Agent."}
        right={<button onClick={()=>setModal(true)} disabled={submitted} style={{padding:"10px 22px",borderRadius:8,background:submitted?"#D9E2EC":`linear-gradient(135deg,${C.primary},${C.primaryDark})`,color:submitted?C.muted:"#fff",fontWeight:700,fontSize:12.5,boxShadow:submitted?"none":`0 4px 14px ${C.primary}44`}}>{submitted?"✓ Submitted to IC Council":"Submit to HITL review →"}</button>}/>
      {submitted&&<div className="hitl-card" style={{marginBottom:16,display:"flex",alignItems:"center",gap:12}}>
        <span style={{fontSize:20,animation:"hitlPulse 2s infinite",borderRadius:"50%"}}>👤</span>
        <div style={{fontSize:12,color:C.heading}}><strong>Pending human review.</strong> Scenario routed to the IC Council queue — {changed.length} parameter change{changed.length!==1?"s":""}, cost impact {impact.dCost>=0?"+":""}{impact.dCost.toFixed(1)}%. You'll keep full edit access until approval.</div>
      </div>}
      <div style={{display:"grid",gridTemplateColumns:"repeat(5,1fr)",gap:11,marginBottom:18}}>
        {ARCHETYPES.map(a=>{
          const active=plan.archetype===a.id,isDefault=persona.plan.archetype===a.id;
          return (
            <div key={a.id} onClick={()=>setPlan(p=>archDefaults(a.id,p))} style={{background:active?C.primaryBg:C.card,border:`1.5px solid ${active?C.primary:C.border}`,borderRadius:11,padding:"12px 14px",cursor:"pointer",transition:"all .2s",position:"relative"}}>
              {isDefault&&<span style={{position:"absolute",top:-8,right:8,fontSize:8,fontWeight:800,background:persona.color,color:"#fff",padding:"2px 8px",borderRadius:8,letterSpacing:.5}}>CURRENT</span>}
              <div style={{fontSize:18}}>{a.icon}</div>
              <div style={{fontSize:11.5,fontWeight:700,color:active?C.primary:C.heading,marginTop:4}}>{a.label}</div>
              <div style={{fontSize:9.5,color:C.muted,marginTop:3,lineHeight:1.4}}>{a.desc}</div>
            </div>
          );
        })}
      </div>
      <div style={{display:"grid",gridTemplateColumns:"320px 1fr",gap:18,marginBottom:18}}>
        <SectionCard title="Plan Parameters" sub="Drag — the curve and tiles react live" pad={18}>
          <div style={{display:"grid",gap:15}}>
            {sliders.map(s=>{
              const active=rel.includes(s.k);
              return (
                <div key={s.k} style={{opacity:active?1:.38}}>
                  <div style={{display:"flex",justifyContent:"space-between",marginBottom:5}}>
                    <span style={{fontSize:11,fontWeight:700,color:C.heading}}>{s.label}</span>
                    <span style={{fontSize:11,fontWeight:800,color:C.primary}} className="mono">{s.fmt(plan[s.k])}</span>
                  </div>
                  <input type="range" min={s.min} max={s.max} step={s.step} value={plan[s.k]} disabled={!active}
                    onChange={e=>upd(s.k,parseFloat(e.target.value))}/>
                  {!active&&<div style={{fontSize:8.5,color:C.light,marginTop:2}}>not used by {ARCHETYPES.find(a=>a.id===plan.archetype).label}</div>}
                </div>
              );
            })}
          </div>
          <div style={{marginTop:18,paddingTop:14,borderTop:`1px solid ${C.border}`}}>
            <div style={{fontSize:10,fontWeight:700,color:C.muted,textTransform:"uppercase",letterSpacing:1,marginBottom:8}}>What-if scenarios</div>
            <div style={{display:"flex",flexWrap:"wrap",gap:7}}>
              {[["shock","🌧 Demand shock −10%"],["nocap","🚀 Remove cap"],["stretch","🎯 Stretch goals +5%"]].map(([k,l])=>(
                <div key={k} onClick={()=>setScen(s=>({...s,[k]:!s[k]}))} style={{padding:"6px 13px",borderRadius:16,fontSize:10.5,fontWeight:700,cursor:"pointer",border:`1.5px solid ${scen[k]?C.primary:C.border}`,background:scen[k]?C.primaryBg:"#FAFBFC",color:scen[k]?C.primary:C.muted,transition:"all .2s"}}>{l}</div>
              ))}
            </div>
          </div>
        </SectionCard>
        <SectionCard title="Payout Curve — Proposed vs Current" sub={"Shaded underlay = where "+persona.name+"'s field actually lands on attainment"+(scen.shock||scen.stretch?" (scenario-shifted)":"")} pad={14}>
          <CurveBuilder plan={effPlan} base={persona.plan} hist={data.goals.hist} w={660} h={318}/>
        </SectionCard>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:14}}>
        {tile("Cost of Plan / "+(persona.plan.freq==="Quarterly"?"quarter":persona.plan.freq==="Monthly"?"month":"half"),fmt$(impact.costN),
          (impact.dCost>=0?"+":"")+impact.dCost.toFixed(1)+"% vs current · "+fmtPct(impact.utilN,0)+" of budget",impact.utilN<=102)}
        {tile("P4P Alignment ρ",impact.rhoN.toFixed(2),(impact.rhoN-impact.rhoC>=0?"+":"")+(impact.rhoN-impact.rhoC).toFixed(2)+" vs current",impact.rhoN>=impact.rhoC)}
        {tile("% of Field Capped",impact.capN+"%",(impact.capN-impact.capC>=0?"+":"")+(impact.capN-impact.capC)+" pts vs current",impact.capN<=impact.capC)}
        {tile("% Below Threshold",impact.belowN+"%",(impact.belowN-impact.belowC>=0?"+":"")+(impact.belowN-impact.belowC)+" pts vs current",impact.belowN<=impact.belowC)}
      </div>
      {modal&&(
        <div onClick={()=>setModal(false)} style={{position:"fixed",inset:0,background:"rgba(8,40,70,.45)",zIndex:100,display:"flex",alignItems:"center",justifyContent:"center",animation:"fadeIn .2s ease-out"}}>
          <div onClick={e=>e.stopPropagation()} style={{background:C.card,borderRadius:16,width:560,maxWidth:"92vw",maxHeight:"86vh",overflowY:"auto",boxShadow:"0 30px 80px rgba(8,40,70,.4)",animation:"fadeUp .25s ease-out"}}>
            <div style={{padding:"18px 26px",borderBottom:`1px solid ${C.border}`,background:"linear-gradient(135deg,#E8F4FD,#F0F7FF)"}}>
              <div style={{fontWeight:800,fontSize:15,color:C.heading}}>👤 Submit Plan Change for Human Review</div>
              <div style={{fontSize:11.5,color:C.muted,marginTop:3}}>Plan Simulator Agent packages the evidence — the IC Council decides</div>
            </div>
            <div style={{padding:24}}>
              <div style={{fontSize:10.5,fontWeight:700,color:C.muted,textTransform:"uppercase",letterSpacing:1,marginBottom:9}}>Parameter changes</div>
              {changed.length===0&&plan.archetype===persona.plan.archetype?<div style={{fontSize:12,color:C.light,fontStyle:"italic",marginBottom:14}}>No changes vs the current plan yet — drag a slider first.</div>:(
                <div style={{display:"grid",gap:7,marginBottom:16}}>
                  {plan.archetype!==persona.plan.archetype&&(
                    <div style={{display:"flex",justifyContent:"space-between",padding:"8px 13px",borderRadius:8,background:"#F6F9FC",fontSize:12}}>
                      <span style={{fontWeight:600,color:C.heading}}>Archetype</span>
                      <span className="mono" style={{color:C.muted}}>{persona.plan.archetype} → <strong style={{color:C.primary}}>{plan.archetype}</strong></span>
                    </div>)}
                  {changed.map(s=>(
                    <div key={s.k} style={{display:"flex",justifyContent:"space-between",padding:"8px 13px",borderRadius:8,background:"#F6F9FC",fontSize:12}}>
                      <span style={{fontWeight:600,color:C.heading}}>{s.label}</span>
                      <span className="mono" style={{color:C.muted}}>{s.fmt(persona.plan[s.k])} → <strong style={{color:C.primary}}>{s.fmt(plan[s.k])}</strong></span>
                    </div>
                  ))}
                </div>
              )}
              <div style={{fontSize:10.5,fontWeight:700,color:C.muted,textTransform:"uppercase",letterSpacing:1,marginBottom:9}}>Simulated impact ({persona.reps} {persona.roleLabel.toLowerCase()})</div>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:9,marginBottom:18}}>
                {[["Cost Δ",(impact.dCost>=0?"+":"")+impact.dCost.toFixed(1)+"%"],["Budget utilization",fmtPct(impact.utilN,0)],["P4P ρ",impact.rhoN.toFixed(2)],["Capped / below-threshold",impact.capN+"% / "+impact.belowN+"%"]].map(([l,v])=>(
                  <div key={l} style={{padding:"9px 13px",borderRadius:8,border:`1px solid ${C.border}`}}><div style={{fontSize:9.5,color:C.muted}}>{l}</div><div style={{fontSize:15,fontWeight:800,color:C.heading,marginTop:1}}>{v}</div></div>
                ))}
              </div>
              <div style={{display:"flex",gap:10,justifyContent:"flex-end"}}>
                <button onClick={()=>setModal(false)} style={{padding:"10px 20px",borderRadius:8,background:"#EDF2F7",color:C.muted,fontWeight:600,fontSize:12.5}}>Cancel</button>
                <button onClick={()=>{setSubmitted(true);setModal(false)}} style={{padding:"10px 24px",borderRadius:8,background:`linear-gradient(135deg,${C.success},#059669)`,color:"#fff",fontWeight:700,fontSize:12.5}}>👤 Route to IC Council</button>
              </div>
            </div>
          </div>
        </div>
      )}
    </div>
  );
};
/* ▓▓ END:SCREEN-STUDIO ▓▓ */

/* ▓▓ SECTION:SCREEN-SFE ▓▓ */
const TerritorySFE=({persona,data,onNav})=>(
  <StubScreen title="Territory & SFE" icon="🗺️" desc="Call-plan adherence heatmap, targeting effectiveness, white space, workload balance." persona={persona} data={data}/>
);
/* ▓▓ END:SCREEN-SFE ▓▓ */

/* ▓▓ SECTION:SCREEN-PULSE ▓▓ */
const FieldPulse=({persona,data,onNav})=>(
  <StubScreen title="Field Pulse & Disputes" icon="💬" desc="Inquiry queue with AI triage traces, HITL adjudication, sentiment + themes." persona={persona} data={data}/>
);
/* ▓▓ END:SCREEN-PULSE ▓▓ */

/* ▓▓ SECTION:SCREEN-COPILOT ▓▓ */
const Copilot=({persona,data,onNav})=>(
  <StubScreen title="Ask iZO Copilot" icon="✨" desc="Conversational IC analyst — streaming reasoning traces, typed answers, live charts." persona={persona} data={data}/>
);
/* ▓▓ END:SCREEN-COPILOT ▓▓ */

/* ▓▓ SECTION:SCREEN-REGISTRY ▓▓ */
const Registry=({persona,data,onNav})=>(
  <StubScreen title="Agent Registry" icon="🤖" desc="11 IC agents — 4-phase loop, simulate runs, HITL gates." persona={persona} data={data}/>
);
/* ▓▓ END:SCREEN-REGISTRY ▓▓ */

/* ▓▓ SECTION:SCREEN-GOVERN ▓▓ */
const Governance=({persona,data,onNav})=>(
  <StubScreen title="Governance & Compliance" icon="🛡️" desc="Fairness audit, shadow-payout parity, audit trail, model cards & HITL policy." persona={persona} data={data}/>
);
/* ▓▓ END:SCREEN-GOVERN ▓▓ */

/* ▓▓ SECTION:APP ▓▓ */
const SCREENS={command:CommandCenter,health:HealthCheck,p4p:P4PLab,goals:GoalsFairness,studio:PlanStudio,sfe:TerritorySFE,pulse:FieldPulse,copilot:Copilot,registry:Registry,govern:Governance};
function App(){
  const [personaId,setPersonaId]=useState("vertanis");
  const [view,setView]=useState("command");
  const persona=PERSONAS.find(p=>p.id===personaId);
  const data=getData(personaId);
  const Screen=SCREENS[view]||CommandCenter;
  const pendingHitl=data.disputes.filter(d=>d.status==="needs-hitl").length;
  return (
    <div style={{display:"flex",height:"100vh",background:C.bg,fontFamily:"'Inter','Segoe UI',system-ui,-apple-system,sans-serif"}}>
      <Sidebar view={view} onNav={setView} persona={persona} pendingHitl={pendingHitl}/>
      <div style={{flex:1,overflow:"auto",minWidth:0}}>
        <div style={{minWidth:1060}}>
          <TopBar crumbs={["iZO IC Platform",VIEW_LABELS[view]]} persona={persona} onSelectPersona={setPersonaId}/>
          <Screen key={personaId+view} persona={persona} data={data} onNav={setView}/>
        </div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
/* ▓▓ END:APP ▓▓ */
</script>
</body>
</html>
