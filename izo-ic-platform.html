<script type="text/babel">
const {useState,useEffect,useRef,useMemo,Fragment}=React;

/* ▓▓ SECTION:TOKENS ▓▓ */
/* ══ IMPROZO DESIGN TOKENS — extracted from improzo.com ══ */
const C={
  sidebar:"#0A5081",       /* Improzo dark navy */
  sidebarDark:"#083D63",   /* Deeper navy for footer */
  primary:"#1E82BD",       /* Improzo brand blue - buttons/CTAs */

  primaryDark:"#0A5081",   /* Dark blue sections */

  heading:"#28426D",       /* Dark blue for headings */
  accent:"#1E82BD",        /* Same brand blue as accent */

  warn:"#F59E0B",warnBg:"#FFFBEB",

  info:"#1E82BD",infoBg:"#E8F4FD",
  hitl:"#1E82BD",          /* HITL accent color */
  hitlBg:"#E8F4FD",        /* HITL background */
  hitlBorder:"#1E82BD44",  /* HITL border */
  codeBg:"#0F172A",codeText:"#E2E8F0",codeComment:"#64748B",codeKeyword:"#7DD3FC",codeString:"#86EFAC",codeFunc:"#C4B5FD",codeNum:"#FCD34D",
};
const PHASE_COLORS={"PLAN":"#8B5CF6","TOOL USE":"#1E82BD","REFLECT":"#F59E0B","ACT":"#10B981"};
const PHASE_ICONS={"PLAN":"🧠","TOOL USE":"🔧","REFLECT":"💭","ACT":"⚡"};
const fmt$=(v)=>{const a=Math.abs(v);if(a>=1e6)return "$"+(v/1e6).toFixed(1)+"M";if(a>=1e3)return "$"+(v/1e3).toFixed(0)+"K";return "$"+Math.round(v)};
const fmtPct=(v,d=1)=>v.toFixed(d)+"%";
/* ▓▓ END:TOKENS ▓▓ */

/* ▓▓ SECTION:RNG ▓▓ */
/* Seeded RNG — all demo data is deterministic per persona; Math.random() reserved for animation jitter only */
const hashStr=(s)=>{let h=1779033703;for(let i=0;i<s.length;i++){h=Math.imul(h^s.charCodeAt(i),3432918353);h=h<<13|h>>>19}return h>>>0};
const mulberry32=(seed)=>{let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}};
const gauss=(rng)=>{let u=0,v=0;while(u===0)u=rng();while(v===0)v=rng();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)};
const pick=(rng,arr)=>arr[Math.floor(rng()*arr.length)];
/* ▓▓ END:RNG ▓▓ */

/* ▓▓ SECTION:PERSONAS ▓▓ */
/* 5 fictional pharma company personas — selector re-skins data, KPIs, plan archetype, narrative */
const PERSONAS=[
  {id:"vertanis",name:"Vertanis Pharma",initials:"VP",type:"Big Pharma — Primary Care",typeShort:"Primary Care",reps:812,roleLabel:"Sales Reps",
   products:["Cardiozen","Lipidra"],metric:"TRx",attainLabel:"TRx Attainment",color:"#1E82BD",launch:false,
   plan:{archetype:"goalAttainment",freq:"Quarterly",threshold:90,thresholdPay:50,accelerator:2.0,excellence:110,cap:200,ti:18500},
   sigma:.11,bias:"lowBaseline",lumpy:false,cycleStage:4,
   story:"Goal-setting bias against low-baseline territories is suppressing fair payout for 11% of the field",
   nudge:{p4p:0,dist:-4,curve:-2,diff:-6,fair:-22,budget:2,cmplx:-4,comp:0}},
  {id:"oncovia",name:"Oncovia Therapeutics",initials:"OT",type:"Specialty — Oncology KAM",typeShort:"Oncology",reps:124,roleLabel:"Key Account Managers",
   products:["Veltrazia"],metric:"Volume + MBO",attainLabel:"Blended Attainment (60% MBO / 40% Vol)",color:"#7C3AED",launch:false,
   plan:{archetype:"mboHybrid",freq:"Quarterly",threshold:85,thresholdPay:55,accelerator:1.6,excellence:112,cap:175,ti:24000,mboWeight:.6},
   sigma:.09,bias:"none",lumpy:false,cycleStage:5,
   story:"Healthy plan — MBO scoring inflation is the one watch-item (92% of KAMs scored ≥95 on MBOs)",
   nudge:{p4p:3,dist:4,curve:3,diff:-8,fair:6,budget:3,cmplx:-10,comp:4}},
  {id:"neurelis",name:"Neurelis Bio",initials:"NB",type:"Launch Biotech — CNS",typeShort:"Launch",reps:96,roleLabel:"Launch Reps",
   products:["Nexavio"],metric:"NBRx",attainLabel:"NBRx vs Launch Goal",color:"#0D9488",launch:true,
   plan:{archetype:"rankBased",freq:"Monthly",threshold:80,thresholdPay:40,accelerator:2.5,excellence:120,cap:250,ti:15000,sigmaPct:24,
     tiers:[250,205,170,145,120,100,82,65,52,40]},
   sigma:.24,bias:"opportunity",lumpy:false,cycleStage:2,
   story:"Rank-based plan is driving differentiation by design — but 9 territories still have zero NBRx activation",
   nudge:{p4p:-6,dist:-12,curve:-8,diff:14,fair:-14,budget:-18,cmplx:2,comp:-6}},
  {id:"auralys",name:"Auralys Rare",initials:"AR",type:"Rare Disease — Account Model",typeShort:"Rare Disease",reps:38,roleLabel:"Account Directors",
   products:["Auragen"],metric:"Milestones",attainLabel:"Account Milestone Completion",color:"#BE185D",launch:false,
   plan:{archetype:"accountMBO",freq:"Semi-Annual",threshold:70,thresholdPay:40,accelerator:1.5,excellence:115,cap:180,ti:32000,base:40,
     milestones:[{at:70,add:30},{at:90,add:30},{at:100,add:25},{at:115,add:30}]},
   sigma:.17,bias:"none",lumpy:true,cycleStage:6,
   story:"Lumpy account outcomes make payouts cliff-heavy — 5 ADs missed a milestone by <3 points",
   nudge:{p4p:-8,dist:-10,curve:-14,diff:0,fair:2,budget:0,cmplx:-6,comp:2}},
  {id:"genovex",name:"Genovex Labs",initials:"GL",type:"Generics — Portfolio GM",typeShort:"Generics",reps:210,roleLabel:"Portfolio Reps",
   products:["240-SKU Portfolio"],metric:"GM",attainLabel:"Gross Margin vs Plan",color:"#B45309",launch:false,
   plan:{archetype:"gmCommission",freq:"Monthly",threshold:0,thresholdPay:0,accelerator:1.0,excellence:120,cap:300,ti:9500,floor:35,rate:1.0},
   sigma:.14,bias:"none",lumpy:false,cycleStage:3,
   story:"GM-commission floor pays 35% to the bottom decile regardless of margin — $310K/yr in unearned floor payments",
   nudge:{p4p:4,dist:-6,curve:-8,diff:4,fair:0,budget:-8,cmplx:6,comp:-4}},
];
/* ▓▓ END:PERSONAS ▓▓ */

/* ▓▓ SECTION:STATS ▓▓ */
const rank=(arr,desc=true)=>{const idx=arr.map((v,i)=>[v,i]).sort((a,b)=>desc?b[0]-a[0]:a[0]-b[0]);const r=new Array(arr.length);idx.forEach(([,i],k)=>r[i]=k+1);return r};
const spearman=(xs,ys)=>{const rx=rank(xs),ry=rank(ys),n=xs.length;let d2=0;for(let i=0;i<n;i++)d2+=(rx[i]-ry[i])**2;return 1-6*d2/(n*(n*n-1))};
const pearson=(xs,ys)=>{const n=xs.length,mx=xs.reduce((a,b)=>a+b,0)/n,my=ys.reduce((a,b)=>a+b,0)/n;let sxy=0,sx=0,sy=0;for(let i=0;i<n;i++){sxy+=(xs[i]-mx)*(ys[i]-my);sx+=(xs[i]-mx)**2;sy+=(ys[i]-my)**2}return sxy/Math.sqrt(sx*sy||1)};
const percentile=(arr,p)=>{const s=[...arr].sort((a,b)=>a-b);const i=(s.length-1)*p;const lo=Math.floor(i),hi=Math.ceil(i);return s[lo]+(s[hi]-s[lo])*(i-lo)};
const mean=(arr)=>arr.reduce((a,b)=>a+b,0)/arr.length;
const normCdf=(z)=>{const t=1/(1+.2316419*Math.abs(z));const d=.3989423*Math.exp(-z*z/2);let p=d*t*(.3193815+t*(-.3565638+t*(1.781478+t*(-1.821256+t*1.330274))));return z>0?1-p:p};
const binHistogram=(values,min,max,bins)=>{const w=(max-min)/bins;const out=Array.from({length:bins},(_,i)=>({x0:min+i*w,x1:min+(i+1)*w,n:0}));values.forEach(v=>{const i=Math.max(0,Math.min(bins-1,Math.floor((v-min)/w)));out[i].n++});return out};
/* payoutCurve(plan) → fn(attainment%) → payout% of target incentive. Dispatches on plan archetype. */
const payoutCurve=(plan)=>{
  const p=plan;
  const core=(att)=>{ /* goal-attainment archetype: threshold → linear → accelerator → excellence kicker → cap */
    if(att<p.threshold)return 0;
    if(att<100)return p.thresholdPay+(att-p.threshold)*((100-p.thresholdPay)/Math.max(1,100-p.threshold));
    let pay=att<=p.excellence?100+(att-100)*p.accelerator:100+(p.excellence-100)*p.accelerator+(att-p.excellence)*p.accelerator*1.5;
    return Math.min(p.cap,pay);
  };
  if(p.archetype==="rankBased")return(att)=>{const pct=normCdf((att-100)/(p.sigmaPct||24));const d=Math.min(9,Math.max(0,Math.floor((1-pct)*10)));return p.tiers[d]};
  if(p.archetype==="gmCommission")return(att)=>Math.max(p.floor,Math.min(p.cap,att*p.rate));
  if(p.archetype==="accountMBO")return(att)=>{let pay=att>=p.threshold?p.base:p.base*.5;p.milestones.forEach(m=>{if(att>=m.at)pay+=m.add});return Math.min(p.cap,pay)};
  if(p.archetype==="mboHybrid")return(att)=>{const mbo=Math.max(60,Math.min(118,100+(att-100)*.45));return p.mboWeight*mbo+(1-p.mboWeight)*core(att)};
  return core;
};
/* Expected cost of a plan against an attainment sample, annualized across the full field */
const costOfPlan=(plan,atts,reps)=>{const curve=payoutCurve(plan);const m=mean(atts.map(a=>curve(a)));return m/100*plan.ti*reps};
/* Monte Carlo over goal-scenario draws — precomputed at DATAGEN, screen animation is reveal-only */
const monteCarlo=(plan,sigma,rng,n=500)=>{
  const curve=payoutCurve(plan);const draws=[];
  for(let i=0;i<n;i++)draws.push(100+gauss(rng)*sigma*100);
  const pT=draws.filter(a=>a>=plan.threshold).length/n,p100=draws.filter(a=>a>=100).length/n,pE=draws.filter(a=>a>=plan.excellence).length/n;
  const payouts=draws.map(curve);
  return {pThreshold:pT,pTarget:p100,pExcellence:pE,meanPayout:mean(payouts),bins:binHistogram(draws,40,160,24),draws:draws.slice(0,60)};
};
/* ▓▓ END:STATS ▓▓ */

/* ▓▓ SECTION:DATAGEN ▓▓ */
const FIRSTS=["Maya","James","Priya","Daniel","Sofia","Marcus","Elena","Ryan","Aisha","Tom","Nina","Carlos","Grace","Kevin","Lara","Omar","Jenna","Derek","Tara","Sam","Ivy","Noah","Zara","Felix","Dana"];
const LASTS=["Kapoor","Whitfield","Chen","Moreau","Delgado","Okafor","Lindqvist","Harrington","Patel","Brooks","Tanaka","Rivera","Sloane","Novak","Ferreira","Quinn","Marsh","Iyer","Bauer","Cole"];
const REGIONS=[
  {r:"Northeast",d:["Boston","NY Metro","Philadelphia"]},
  {r:"Southeast",d:["Atlanta","Miami","Carolinas"]},
  {r:"Midwest",d:["Chicago","Twin Cities","Ohio Valley"]},
  {r:"South Central",d:["Dallas","Houston","Gulf Coast"]},
  {r:"West",d:["SoCal","Bay Area","Pacific NW"]},
];
const CYCLE_STAGES=["Data Lock","Validation","Calc Run","Shadow Audit","QC","HITL Approval","Statements","Payroll Feed"];
const DIST_FLAGS=["Legacy guarantee","Windfall account","Quota error"];

const buildPersonaData=(pid)=>{
  const ps=PERSONAS.find(p=>p.id===pid);
  const rng=mulberry32(hashStr("izo-ic-"+pid));
  const curve=payoutCurve(ps.plan);
  /* ── 100 territory rows, fixed draw order ── */
  const rows=[];
  for(let i=0;i<100;i++){
    const reg=REGIONS[i%5],district=reg.d[Math.floor(i/5)%3];
    const rep=FIRSTS[Math.floor(rng()*FIRSTS.length)]+" "+LASTS[Math.floor(rng()*LASTS.length)];
    const tenureYrs=Math.round((rng()*13+.5)*10)/10;
    const baselineVol=Math.round(2200+rng()*7800);
    const marketOpportunity=Math.round((40+rng()*60));
    let att=100+gauss(rng)*ps.sigma*100;
    if(ps.bias==="lowBaseline"&&baselineVol<3900)att-=6.5;          /* Vertanis story: biased goals on low-baseline territories */
    if(ps.bias==="opportunity"&&marketOpportunity<52)att-=9;        /* Neurelis: low-opportunity territories can't ramp */
    if(ps.lumpy&&rng()<.28)att+=(rng()<.5?-1:1)*(8+rng()*26);       /* Auralys: lumpy account milestones */
    const quota=Math.round(baselineVol*(1+(marketOpportunity-65)*.004+.06));
    const actual=Math.round(quota*att/100);
    const calls=Math.round(180+rng()*420);
    const callPlanAdherence=Math.round(58+rng()*40);
    const reach=Math.round(52+rng()*44);
    const freq=Math.round((1.4+rng()*3.2)*10)/10;
    const tierAShare=Math.round((25+rng()*52));
    const workloadIdx=Math.round((0.62+rng()*0.92)*100)/100;
    let payoutPct=curve(att)+gauss(rng)*2.2;                        /* small admin noise on top of curve */
    if(payoutPct<0)payoutPct=0;
    rows.push({id:"T-"+String(i+1).padStart(3,"0"),rep,region:reg.r,district,tenureYrs,quota,actual,
      attainment:Math.round(att*10)/10,payoutPct:Math.round(payoutPct*10)/10,payout:0,
      perfRank:0,payoutRank:0,decile:0,quadrant:"aligned",calls,callPlanAdherence,reach,freq,tierAShare,
      marketOpportunity,baselineVol,workloadIdx,flags:[]});
  }
  /* ── inject ~8% payout distortions; these SAME rows drive P4P outliers, health findings, disputes ── */
  const distorted=[];
  for(let k=0;k<8;k++){
    let idx=Math.floor(rng()*100);
    while(distorted.includes(idx))idx=Math.floor(rng()*100);
    distorted.push(idx);
    const row=rows[idx],type=DIST_FLAGS[k%3];
    if(type==="Legacy guarantee"){row.payoutPct=Math.max(row.payoutPct,128+rng()*30);row.flags.push("Legacy guarantee")}
    else if(type==="Windfall account"){row.attainment=Math.round((row.attainment+24+rng()*14)*10)/10;row.payoutPct=Math.round(curve(row.attainment)*10)/10;row.calls=Math.round(row.calls*.55);row.flags.push("Windfall account")}
    else{row.attainment=Math.round((row.attainment-16-rng()*8)*10)/10;row.payoutPct=Math.round(Math.max(0,curve(row.attainment))*10)/10;row.flags.push("Quota error")}
  }
  /* ── ranks, deciles, quadrants, dollar payouts ── */
  const atts=rows.map(r=>r.attainment),pays=rows.map(r=>r.payoutPct);
  const pr=rank(atts),yr=rank(pays);
  const perQ=ps.plan.freq==="Quarterly"?4:ps.plan.freq==="Monthly"?12:2;
  rows.forEach((r,i)=>{
    r.perfRank=pr[i];r.payoutRank=yr[i];r.decile=Math.min(10,Math.ceil(pr[i]/10));
    const gap=r.payoutRank-r.perfRank;
    r.quadrant=r.flags.length?"review":gap<=-18?"overpaid":gap>=18?"underpaid":"aligned";
    if(r.flags.includes("Legacy guarantee"))r.quadrant="overpaid";
    if(r.flags.includes("Quota error"))r.quadrant="underpaid";
    r.payout=Math.round(ps.plan.ti/perQ*r.payoutPct/100);
  });
  const rho=Math.round(spearman(atts,pays)*1000)/1000;
  /* ── health check: 8 scored dimensions, data-derived + persona nudges ── */
  const clamp=(v)=>Math.max(8,Math.min(98,Math.round(v)));
  const pctMid=rows.filter(r=>r.attainment>=ps.plan.threshold&&r.payoutPct<ps.plan.cap).length;
  const spread=(percentile(pays,.9)-percentile(pays,.1))/Math.max(1,percentile(pays,.5));
  const fairCorr=pearson(rows.map(r=>r.baselineVol),atts);
  const tenCorr=pearson(rows.map(r=>r.tenureYrs),atts);
  const sizeCorr=pearson(rows.map(r=>r.quota),atts);
  const capped=rows.filter(r=>r.payoutPct>=ps.plan.cap-.5).length;
  const below=rows.filter(r=>r.payoutPct<=0.5).length;
  const util=mean(pays)/100;
  const n=ps.nudge;
  const dims=[
    {id:"p4p",label:"Pay-for-Performance Alignment",icon:"🎯",link:"p4p",score:clamp(rho*100+n.p4p),
     metric:"ρ = "+rho.toFixed(2)},
    {id:"dist",label:"Payout Distribution vs Design",icon:"📊",link:"p4p",score:clamp(pctMid+n.dist),
     metric:capped+"% capped · "+below+"% at zero"},
    {id:"curve",label:"Attainment Curve Health",icon:"📈",link:"studio",score:clamp(82+n.curve-(capped>8?10:0)),
     metric:"kink @ "+ps.plan.excellence+"%"},
    {id:"diff",label:"Differentiation & Motivation",icon:"⚡",link:"p4p",score:clamp(spread*88+n.diff),
     metric:"top:median spread "+spread.toFixed(2)+"×"},
    {id:"fair",label:"Goal Fairness",icon:"⚖️",link:"goals",score:clamp(86-Math.abs(fairCorr)*120+n.fair),
     metric:"baseline corr r="+fairCorr.toFixed(2)},
    {id:"budget",label:"Budget Utilization",icon:"💰",link:"command",score:clamp(96-Math.abs(util-1)*160+n.budget),
     metric:fmtPct(util*100,0)+" of target spend"},
    {id:"cmplx",label:"Plan Complexity",icon:"🧩",link:"studio",score:clamp(88+n.cmplx),
     metric:ps.plan.archetype==="mboHybrid"?"7 moving parts":"4 moving parts"},
    {id:"comp",label:"Compliance & Audit Readiness",icon:"🛡️",link:"govern",score:clamp(92+n.comp),
     metric:"99.97% shadow-calc parity"},
  ];
  dims.forEach(d=>{d.status=d.score>=80?"good":d.score>=60?"warn":"risk"});
  const overall=Math.round(dims.reduce((a,d)=>a+d.score,0)/dims.length);
  /* ── KPIs w/ seeded sparklines ── */
  const spark=(v,vol)=>{const s=[];let x=v*(.84+rng()*.06);for(let i=0;i<8;i++){s.push(Math.round(x*10)/10);x+=v*(rng()-.42)*vol}s[7]=v;return s};
  const spendQTD=ps.plan.ti/perQ*util*ps.reps*.78;
  const pctAtGoal=rows.filter(r=>r.attainment>=100).length;
  const disputeRate=Math.round((1.4+rng()*1.6)*10)/10;
  const forecastAcc=Math.round((91+rng()*6)*10)/10;
  const kpis=[

        <StatCard label="Field size" value={persona.reps} sub={persona.roleLabel}/>
        <StatCard label="Territories modeled" value={data.rows.length} sub="seeded, deterministic"/>
        <StatCard label="P4P ρ" value={data.rho.toFixed(2)} sub={`health ${data.overall}/100`} color={data.rho>=.8?C.success:C.warn}/>
      </div>
    </SectionCard>
  </div>
);
/* ▓▓ END:UI ▓▓ */

/* ▓▓ SECTION:SHELL ▓▓ */
const NAV=[
  {group:"OVERVIEW",items:[{id:"command",icon:"🛰️",label:"Command Center"}]},
  {group:"DIAGNOSE",items:[
    {id:"health",icon:"🩺",label:"IC Health Check"},
    {id:"p4p",icon:"🎯",label:"Pay-for-Performance Lab"},
    {id:"goals",icon:"📐",label:"Goal Setting & Fairness"},
    {id:"sfe",icon:"🗺️",label:"Territory & SFE"}]},
  {group:"DESIGN",items:[{id:"studio",icon:"🧪",label:"Plan Design Studio"}]},
  {group:"EXECUTE",items:[{id:"pulse",icon:"💬",label:"Field Pulse & Disputes"}]},
  {group:"ASK iZO",items:[{id:"copilot",icon:"✨",label:"Ask iZO Copilot"}]},
  {group:"GOVERN",items:[
    {id:"registry",icon:"🤖",label:"Agent Registry"},
    {id:"govern",icon:"🛡️",label:"Governance & Compliance"}]},
];
const VIEW_LABELS={};NAV.forEach(g=>g.items.forEach(it=>VIEW_LABELS[it.id]=it.label));
const SidebarItem=({icon,label,active,onClick,isHitl})=>(
  <div onClick={onClick} style={{display:"flex",alignItems:"center",gap:11,padding:"9px 18px",cursor:"pointer",background:active?"rgba(30,130,189,.22)":"transparent",borderLeft:active?`3px solid ${C.primaryLight}`:"3px solid transparent",color:active?"#fff":"#A0B4CC",transition:"all .2s",fontSize:13,fontWeight:active?600:400}}>
    <span style={{fontSize:15,width:20,textAlign:"center"}}>{icon}</span>
    <span style={{flex:1}}>{label}</span>
    {isHitl&&<span style={{width:8,height:8,borderRadius:"50%",background:"#EA580C",animation:"breathe 2s infinite"}}/>}
  </div>
);
const Sidebar=({view,onNav,persona,pendingHitl})=>(
  <div style={{width:248,minWidth:248,background:`linear-gradient(180deg,${C.sidebar},${C.sidebarDark})`,display:"flex",flexDirection:"column",height:"100vh"}}>
    <div style={{padding:"20px 18px 16px",borderBottom:"1px solid rgba(255,255,255,.1)"}}>
      <div style={{display:"flex",alignItems:"center",gap:10}}>
        <div style={{width:36,height:36,borderRadius:10,background:`linear-gradient(135deg,${C.primary},${C.primaryLight})`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:14,fontWeight:800,color:"#fff"}}>iZ</div>
        <div><div style={{fontSize:15,fontWeight:700,color:"#fff",letterSpacing:.4}}>iZO IC Platform</div><div style={{fontSize:9,color:"#7BA3C9",letterSpacing:2,textTransform:"uppercase",marginTop:1}}>Incentives · SFE · by Improzo</div></div>
      </div>
    </div>
    <div style={{flex:1,paddingTop:6,overflowY:"auto"}}>
      {NAV.map(g=>(
        <div key={g.group}>
          <div style={{padding:"12px 18px 4px",fontSize:9.5,fontWeight:700,color:"#7BA3C9",textTransform:"uppercase",letterSpacing:1.6}}>{g.group}</div>
          {g.items.map(it=><SidebarItem key={it.id} icon={it.icon} label={it.label} active={view===it.id} onClick={()=>onNav(it.id)} isHitl={it.id==="pulse"&&pendingHitl>0}/>)}
        </div>
      ))}
    </div>
    <div style={{padding:"13px 18px",borderTop:"1px solid rgba(255,255,255,.1)",display:"flex",alignItems:"center",gap:10,background:"rgba(0,0,0,.15)"}}>
      <div style={{width:32,height:32,borderRadius:"50%",display:"flex",alignItems:"center",justifyContent:"center",background:`linear-gradient(135deg,${persona.color},${C.heading})`,fontSize:11,fontWeight:700,color:"#fff"}}>{persona.initials}</div>
      <div style={{minWidth:0}}><div style={{fontSize:12,fontWeight:600,color:"#E2E8F0",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{persona.name}</div><div style={{fontSize:9.5,color:"#7BA3C9"}}>{persona.type}</div></div>
    </div>
  </div>
);
const PersonaSelector=({persona,onSelect})=>{
  const [open,setOpen]=useState(false);
  return (
    <div style={{position:"relative"}}>
      <div onClick={()=>setOpen(o=>!o)} style={{display:"flex",alignItems:"center",gap:9,padding:"6px 12px",borderRadius:8,border:`1px solid ${open?C.primary:C.border}`,cursor:"pointer",background:"#F8FAFC",transition:"all .2s"}}>
        <div style={{width:24,height:24,borderRadius:7,background:`linear-gradient(135deg,${persona.color},${C.heading})`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:9,fontWeight:800,color:"#fff"}}>{persona.initials}</div>
        <div><div style={{fontSize:12,fontWeight:700,color:C.heading,lineHeight:1.1}}>{persona.name}</div><div style={{fontSize:9,color:C.muted}}>{persona.type}</div></div>
        <span style={{fontSize:10,color:C.muted,marginLeft:4}}>{open?"▲":"▼"}</span>
      </div>
      {open&&<Fragment>
        <div onClick={()=>setOpen(false)} style={{position:"fixed",inset:0,zIndex:40}}/>
        <div style={{position:"absolute",top:"calc(100% + 6px)",right:0,width:300,background:C.card,borderRadius:12,border:`1px solid ${C.border}`,boxShadow:"0 12px 40px rgba(10,80,129,.18)",zIndex:50,overflow:"hidden",animation:"fadeUp .2s ease-out"}}>
          <div style={{padding:"10px 16px",fontSize:9.5,fontWeight:700,color:C.muted,textTransform:"uppercase",letterSpacing:1.2,borderBottom:`1px solid ${C.border}`,background:"#F8FAFC"}}>Switch demo company</div>
          {PERSONAS.map(p=>(
            <div key={p.id} onClick={()=>{onSelect(p.id);setOpen(false)}} style={{display:"flex",alignItems:"center",gap:11,padding:"11px 16px",cursor:"pointer",background:p.id===persona.id?C.primaryBg:"transparent",borderLeft:p.id===persona.id?`3px solid ${C.primary}`:"3px solid transparent"}}
              onMouseEnter={e=>{if(p.id!==persona.id)e.currentTarget.style.background="#F8FAFC"}} onMouseLeave={e=>{if(p.id!==persona.id)e.currentTarget.style.background="transparent"}}>
              <div style={{width:30,height:30,borderRadius:8,background:`linear-gradient(135deg,${p.color},${C.heading})`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:10,fontWeight:800,color:"#fff"}}>{p.initials}</div>
              <div style={{flex:1}}><div style={{fontSize:12.5,fontWeight:600,color:C.heading}}>{p.name}</div><div style={{fontSize:10,color:C.muted}}>{p.type} · {p.reps} {p.roleLabel.toLowerCase()}</div></div>
              {p.id===persona.id&&<span style={{color:C.primary,fontWeight:700}}>✓</span>}
            </div>
          ))}
        </div>
      </Fragment>}
    </div>
  );
};
const TopBar=({crumbs,persona,onSelectPersona})=>(
  <div style={{background:C.card,borderBottom:`1px solid ${C.border}`,padding:"11px 26px",display:"flex",justifyContent:"space-between",alignItems:"center",position:"sticky",top:0,zIndex:30}}>
    <div style={{display:"flex",alignItems:"center",gap:8,fontSize:13,color:C.muted}}>
      {crumbs.map((b,i)=><span key={i} style={{display:"flex",alignItems:"center",gap:8}}>{i>0&&<span style={{color:C.light}}>›</span>}<span style={{fontWeight:i===crumbs.length-1?600:400,color:i===crumbs.length-1?C.heading:C.muted}}>{b}</span></span>)}
    </div>
    <div style={{display:"flex",alignItems:"center",gap:14}}>
      <PersonaSelector persona={persona} onSelect={onSelectPersona}/>
      <div style={{position:"relative"}}><span style={{fontSize:17,cursor:"pointer"}}>🔔</span><span style={{position:"absolute",top:-4,right:-4,width:15,height:15,borderRadius:"50%",background:"#EA580C",color:"#fff",fontSize:8.5,fontWeight:700,display:"flex",alignItems:"center",justifyContent:"center"}}>2</span></div>
      <div style={{width:32,height:32,borderRadius:"50%",display:"flex",alignItems:"center",justifyContent:"center",background:`linear-gradient(135deg,${C.primary},${C.heading})`,color:"#fff",fontSize:11,fontWeight:700}}>SO</div>
    </div>
  </div>
);
/* ▓▓ END:SHELL ▓▓ */

/* ▓▓ SECTION:SCREEN-COMMAND ▓▓ */
const CommandCenter=({persona,data,onNav})=>(
  <StubScreen title="Command Center" icon="🛰️" desc="Always-on IC health gauge, KPI tiles, cycle timeline, live agent feed, top findings." persona={persona} data={data}/>
);
/* ▓▓ END:SCREEN-COMMAND ▓▓ */

/* ▓▓ SECTION:SCREEN-HEALTH ▓▓ */
const HealthCheck=({persona,data,onNav})=>(
  <StubScreen title="IC Health Check" icon="🩺" desc="8 scored dimensions — the 6-week consultant health check, rerun in 4 minutes." persona={persona} data={data}/>
);
/* ▓▓ END:SCREEN-HEALTH ▓▓ */

/* ▓▓ SECTION:SCREEN-P4P ▓▓ */
const P4PLab=({persona,data,onNav})=>(
  <StubScreen title="Pay-for-Performance Lab" icon="🎯" desc="Perf-rank vs payout-rank quadrants, decile curve, flagged outliers, President's Club." persona={persona} data={data}/>
);
/* ▓▓ END:SCREEN-P4P ▓▓ */

/* ▓▓ SECTION:SCREEN-GOALS ▓▓ */
const GoalsFairness=({persona,data,onNav})=>(
  <StubScreen title="Goal Setting & Fairness" icon="📐" desc="Attainment distribution vs ideal bell, bias detectors, Monte Carlo goal simulation." persona={persona} data={data}/>
);
/* ▓▓ END:SCREEN-GOALS ▓▓ */

/* ▓▓ SECTION:SCREEN-STUDIO ▓▓ */
const PlanStudio=({persona,data,onNav})=>(
  <StubScreen title="Plan Design Studio" icon="🧪" desc="Archetype templates, 6 live sliders, payout curve vs current, cost & ρ impact tiles." persona={persona} data={data}/>
);
/* ▓▓ END:SCREEN-STUDIO ▓▓ */

/* ▓▓ SECTION:SCREEN-SFE ▓▓ */
const TerritorySFE=({persona,data,onNav})=>(
  <StubScreen title="Territory & SFE" icon="🗺️" desc="Call-plan adherence heatmap, targeting effectiveness, white space, workload balance." persona={persona} data={data}/>
);
/* ▓▓ END:SCREEN-SFE ▓▓ */

/* ▓▓ SECTION:SCREEN-PULSE ▓▓ */
const FieldPulse=({persona,data,onNav})=>(
  <StubScreen title="Field Pulse & Disputes" icon="💬" desc="Inquiry queue with AI triage traces, HITL adjudication, sentiment + themes." persona={persona} data={data}/>
);
/* ▓▓ END:SCREEN-PULSE ▓▓ */

/* ▓▓ SECTION:SCREEN-COPILOT ▓▓ */
const Copilot=({persona,data,onNav})=>(
  <StubScreen title="Ask iZO Copilot" icon="✨" desc="Conversational IC analyst — streaming reasoning traces, typed answers, live charts." persona={persona} data={data}/>
);
/* ▓▓ END:SCREEN-COPILOT ▓▓ */

/* ▓▓ SECTION:SCREEN-REGISTRY ▓▓ */
const Registry=({persona,data,onNav})=>(
  <StubScreen title="Agent Registry" icon="🤖" desc="11 IC agents — 4-phase loop, simulate runs, HITL gates." persona={persona} data={data}/>
);
/* ▓▓ END:SCREEN-REGISTRY ▓▓ */

/* ▓▓ SECTION:SCREEN-GOVERN ▓▓ */
const Governance=({persona,data,onNav})=>(
  <StubScreen title="Governance & Compliance" icon="🛡️" desc="Fairness audit, shadow-payout parity, audit trail, model cards & HITL policy." persona={persona} data={data}/>
);
/* ▓▓ END:SCREEN-GOVERN ▓▓ */

/* ▓▓ SECTION:APP ▓▓ */
const SCREENS={command:CommandCenter,health:HealthCheck,p4p:P4PLab,goals:GoalsFairness,studio:PlanStudio,sfe:TerritorySFE,pulse:FieldPulse,copilot:Copilot,registry:Registry,govern:Governance};
function App(){
  const [personaId,setPersonaId]=useState("vertanis");
  const [view,setView]=useState("command");
  const persona=PERSONAS.find(p=>p.id===personaId);
  const data=getData(personaId);
  const Screen=SCREENS[view]||CommandCenter;
  const pendingHitl=data.disputes.filter(d=>d.status==="needs-hitl").length;
  return (
    <div style={{display:"flex",height:"100vh",background:C.bg,fontFamily:"'Inter','Segoe UI',system-ui,-apple-system,sans-serif"}}>
      <Sidebar view={view} onNav={setView} persona={persona} pendingHitl={pendingHitl}/>
      <div style={{flex:1,overflowY:"auto",minWidth:0}}>
        <TopBar crumbs={["iZO IC Platform",VIEW_LABELS[view]]} persona={persona} onSelectPersona={setPersonaId}/>
        <Screen key={personaId+view} persona={persona} data={data} onNav={setView}/>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
/* ▓▓ END:APP ▓▓ */
</script>
</body>
</html>
